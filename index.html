<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DC TCG · Duel des champions</title>
<!-- Application web : s'ouvre en plein écran depuis l'écran d'accueil -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DC TCG">
<meta name="theme-color" content="#0d0f13">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#121419;--panel:#1b1e25;--panel2:#242832;--line:#323745;--text:#eceef3;--muted:#98a0ae;--accent:#ffc94a;--good:#45d483;--bad:#ff5c5c;--atk:#ff8f6b;--def:#6fb6ff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);overscroll-behavior:none;-webkit-tap-highlight-color:transparent;}
/* Plein écran iPhone (app sur l'écran d'accueil) : avec la barre d'état transparente, iOS calcule la hauteur
   de la page sans la zone de la barre d'état ; sur une page courte, la barre du bas remonte. On compense. */
html{min-height:calc(100% + env(safe-area-inset-top))}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
#app{flex:1 0 auto}
html,body{color:var(--text);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover:not(:disabled){border-color:#5a6480}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--accent);color:#1a1400;border-color:var(--accent);font-weight:700}
button.ghost{background:transparent}
input,select,textarea{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
header{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:18px;padding:calc(10px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) 10px calc(18px + env(safe-area-inset-left));background:#0d0f13;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:17px;letter-spacing:3px;white-space:nowrap}
header h1 span{color:#3b8ff0}
.tabs{display:flex;gap:6px}
.tabs button{border-radius:999px;padding:6px 18px}
.tabs button.on{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:700}
.ver{margin-left:auto;color:var(--muted);font-size:12px}
.page{max-width:1200px;margin:0 auto;padding:18px}
.muted{color:var(--muted)}
h3{margin:22px 0 10px;font-size:15px}

/* cartes */
.card{--tc:#888;position:relative;width:128px;min-height:168px;border-radius:10px;background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 24%,var(--panel2)) 0,var(--panel2) 48%);border:2px solid var(--tc);padding:6px 7px;display:flex;flex-direction:column;gap:3px;transition:transform .15s,opacity .15s,box-shadow .15s;user-select:none}
.card .top{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.card .top b{color:var(--text);font-size:12px}
.card .nm{font-weight:750;font-size:13.5px;line-height:1.15}
.card .band{height:3px;background:var(--tc);border-radius:2px;margin:1px 0 2px}
.card .kind{font-size:10.5px;color:var(--muted)}
.card .tal{font-size:11px;color:var(--accent);font-weight:600}
.card .spe{font-size:11px;color:var(--atk);font-weight:700}
.card .txt{font-size:11px;color:#c9ced8;line-height:1.3}
.card .stats{margin-top:auto;display:flex;justify-content:space-between;font-weight:800;font-size:17px}
.card .stats .atk{color:var(--atk)} .card .stats .def{color:var(--def)}
.card .stats .up{text-decoration:underline;filter:brightness(1.25)}
.card .stats .hurt{color:var(--bad)}
.card .cnt{position:absolute;top:-9px;right:-9px;background:var(--text);color:var(--bg);font-weight:800;border-radius:999px;padding:1px 7px;font-size:12px}
.card .tags{display:flex;flex-wrap:wrap;gap:3px}
.tag{font-size:10px;background:#0007;border-radius:4px;padding:1px 5px;color:#dfe3ea}
.tag.eq{background:#2bb3a333;color:#7fe6da}
.tag.st{background:#ffc94a22;color:var(--accent)}
.card.click{cursor:pointer}
.card.click:hover{transform:translateY(-3px)}
.card.target{cursor:pointer;box-shadow:0 0 0 3px var(--accent)}
.card.target:hover{transform:translateY(-3px)}
.card.sel{box-shadow:0 0 0 3px var(--good)}
.card.dim{opacity:.55}
.card.big{width:210px;min-height:260px;padding:10px 12px}
.card.big .nm{font-size:20px}.card.big .stats{font-size:26px}.card.big .txt{font-size:13px}
.card.back{background:repeating-linear-gradient(45deg,#2a2f3b 0 8px,#222631 8px 16px);border-color:#454b5a;width:70px;min-height:96px}
.card.back.full{width:128px;min-height:168px}

/* decks */
.dtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.dtile{--tc:#888;text-align:left;padding:14px;border:2px solid var(--line);border-radius:14px;background:linear-gradient(160deg,color-mix(in srgb,var(--tc) 30%,var(--panel)) 0,var(--panel) 70%)}
.dtile.on{border-color:var(--tc);box-shadow:0 0 0 2px var(--tc)}
.dt-name{font-size:20px;font-weight:800}
.dt-sub{font-size:12px;color:var(--muted);margin:4px 0}
.deckhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:14px;margin-top:22px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.deckhead h2{margin:0}
.grid{display:flex;flex-wrap:wrap;gap:14px}
.seg{display:inline-flex;gap:4px;margin-top:14px}
.seg button.on{background:var(--text);color:var(--bg);font-weight:700}

/* modale */
.modal-bg{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:780px;width:100%;max-height:90vh;overflow:auto}
.mrow{display:flex;gap:20px;flex-wrap:wrap}
.minfo{flex:1;min-width:240px}
.minfo dt{color:var(--muted);font-size:12px;margin-top:10px}
.minfo dd{margin:2px 0 0}
.chain{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.chain .arr{color:var(--muted);font-size:20px}
.mclose{float:right}

/* préparation */
.setup{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.box h3{margin-top:0}
.dpick{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.dchip{--tc:#888;border:2px solid var(--line)}
.dchip.on{border-color:var(--tc);background:color-mix(in srgb,var(--tc) 35%,var(--panel2));font-weight:700}
.opts label{display:flex;gap:8px;align-items:flex-start;margin:8px 0}
.duels{display:flex;flex-wrap:wrap;gap:8px}

/* table */
.arena{display:grid;grid-template-columns:1fr 340px;gap:12px;padding:12px;align-items:start}
.table{display:flex;flex-direction:column;gap:10px;min-width:0}
.player{background:var(--panel);border-radius:14px;padding:10px 12px;border:2px solid transparent}
.player.active{border-color:var(--accent)}
.pinfo{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.pname{font-weight:800;font-size:16px}
.badge{font-size:11px;background:var(--accent);color:#1a1400;border-radius:4px;padding:1px 6px;font-weight:800}
.badge.dim{background:var(--line);color:var(--muted)}
.chip{--tc:#888;font-size:12px;border:1px solid var(--tc);color:var(--tc);border-radius:999px;padding:1px 9px;font-weight:700}
.wins{color:var(--accent);letter-spacing:2px}
.troph{font-size:24px;font-weight:850}
.troph small{font-size:12px;color:var(--muted);font-weight:600}
.flag{font-size:11px;background:#ffc94a22;color:var(--accent);border-radius:4px;padding:2px 6px;font-weight:700}
.field{display:flex;gap:18px;flex-wrap:wrap;padding:8px 2px;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);margin:6px 0}
.slotz{display:flex;flex-direction:column;gap:4px}
.slotz .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.slotz .row{display:flex;gap:10px;align-items:flex-start;min-height:170px}
.emptyslot{width:128px;min-height:168px;border:2px dashed var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px}
.zone{display:flex;flex-wrap:wrap;gap:10px;padding:8px 2px;min-height:60px;align-items:flex-start}
.empty{color:var(--muted);font-style:italic;align-self:center}
.hcard{display:flex;flex-direction:column;gap:4px;width:128px}
.hcard button{font-size:11.5px;padding:4px 6px}
.mid{background:#191c22;border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.midtxt{flex:1;min-width:260px}
.midbtns{display:flex;gap:8px;flex-wrap:wrap}
.counter{display:inline-block;font-size:12px;background:var(--panel2);border-radius:6px;padding:1px 7px;margin-left:6px}
.counter.hot{background:var(--accent);color:#1a1400;font-weight:800}
.pend{margin-top:6px;color:var(--accent)}
.prev{font-size:12.5px;color:var(--muted);margin-top:4px}
.side{display:flex;flex-direction:column;gap:12px;position:sticky;top:62px}
.side .box{padding:12px}
.log{max-height:320px;overflow:auto;font-size:12.5px;display:flex;flex-direction:column;gap:3px}
.log .l.head{font-weight:800;color:var(--accent);margin-top:4px}
.log .l.turn{font-weight:700;color:#cfd5e0;border-top:1px solid var(--line);padding-top:3px}
.log .l.good{color:var(--good)} .log .l.bad{color:var(--bad)} .log .l.sys{color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{border-bottom:1px solid var(--line);padding:4px 5px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600}
.reg input{width:100%;font-size:12px;padding:3px 5px}
.handoff{position:fixed;inset:0;z-index:40;background:#0d0f13f2;display:flex;align-items:center;justify-content:center;text-align:center}
.handoff h2{font-size:34px;margin:6px 0 18px}
.banner{font-size:16px}
details summary{cursor:pointer;font-weight:700}
.pop{position:fixed;z-index:70;width:290px;background:#0d0f13;border:1px solid #5a6480;border-radius:12px;padding:12px 14px;box-shadow:0 10px 30px #000a;font-size:13px;pointer-events:none}
.pop h4{margin:0 0 2px;font-size:16px}.pop .sub{color:var(--muted);font-size:12px;margin-bottom:8px}
.pop dl{margin:0}.pop dt{color:var(--muted);font-size:11.5px;margin-top:7px}.pop dd{margin:1px 0 0}
.pop .ab{color:var(--accent);font-weight:700}
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:35;display:flex;background:#0d0f13;border-top:1px solid var(--line);padding:6px calc(8px + env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left))}
.bottombar button{flex:1;border:0;background:transparent;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;color:var(--muted);font-size:12.5px}
.bottombar button .ic{font-size:24px;line-height:1}
.bottombar button.on{color:var(--text);background:var(--panel2);font-weight:700}
#app{padding-bottom:calc(120px + env(safe-area-inset-bottom))}
.backbtn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(62px + env(safe-area-inset-bottom));z-index:34;padding:9px 22px;border-radius:999px;background:var(--panel2);border:1px solid #5a6480;font-weight:600;box-shadow:0 4px 16px #0008}
.ptitle{text-align:center;margin:0 0 16px;font-size:20px}
.vcenter{display:flex;flex-direction:column;justify-content:flex-start;min-height:calc(100vh - 46px - 120px - env(safe-area-inset-bottom) - 36px);min-height:calc(100dvh - 46px - 120px - env(safe-area-inset-bottom) - 36px)}
.vcenter>.menu{margin-top:auto;margin-bottom:auto}
.vcenter::after{content:'';flex:none;height:44px}
.ptop{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-bottom:16px}
.ptop h2{margin:0;font-size:20px;grid-column:2}
.ptop .right{grid-column:3;justify-self:end}
.randbtn{flex:0 0 auto;margin-top:12px;padding:0 16px;border:2px solid var(--line);border-radius:12px;font-size:22px;background:var(--panel2)}
.randbtn.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 25%,var(--panel2))}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.menu button{text-align:left;padding:22px 20px;border:2px solid var(--line);border-radius:14px;background:var(--panel);font-size:22px;font-weight:800;min-height:96px}
.menu button small{display:block;font-size:11px;font-weight:500;color:var(--muted);margin-top:6px}
.menu button:disabled small{color:var(--muted)}
.navhead{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;margin-bottom:16px}
.navhead h2{text-align:center}
.navhead .ghost.spacer{visibility:hidden}
.ctr{text-align:center}
.ctr .menu button{text-align:center}
.ctr .dpick,.ctr .duels,.ctr .grid{justify-content:center}
.ctr .opts label{justify-content:center}
.ctr .dtile{text-align:center}
.ctr .card{text-align:left}
.deckbtn{--tc:#888;display:block;width:100%;margin-top:12px;padding:14px;border:2px solid var(--tc);border-radius:12px;background:color-mix(in srgb,var(--tc) 22%,var(--panel2));font-size:15px}
.deckbtn small{display:block;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.dtile.on{box-shadow:0 0 0 3px var(--accent)}
.grid.compact{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.grid.compact .card{width:auto;min-height:150px;padding:5px 6px}
.grid.compact .card .nm{font-size:12px}
.grid.compact .card .top{font-size:9.5px}
.grid.compact .card .tal,.grid.compact .card .spe,.grid.compact .card .kind,.grid.compact .card .txt{font-size:10px}
.grid.compact .card .stats{font-size:14px}
.filters{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:0 0 12px;text-align:left}
.filters input{grid-column:1/-1}
.filters label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.filters select,.filters input{width:100%;font-size:14px;padding:7px 8px}
@media (min-width:760px){.filters{grid-template-columns:2fr repeat(4,1fr)}.filters input{grid-column:auto}}
.navhead h2{margin:0;font-size:20px}
.rules h3{margin:22px 0 8px}.rules p,.rules li{line-height:1.55}.rules table{margin:8px 0;max-width:640px}
/* ===== Écran de match compact (téléphone) ===== */
body.inmatch .bottombar{display:none}
body.inmatch header{display:none}
body.inmatch .match{padding-top:calc(6px + env(safe-area-inset-top))}
body.inmatch #app{padding-bottom:0;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
body.inmatch .match{flex:1 1 auto;min-height:0;width:100%;box-sizing:border-box;padding-bottom:calc(4px + env(safe-area-inset-bottom))}
body.inmatch .match>*{flex-shrink:0}
body.inmatch .mfield{flex:1 1 0;min-height:0}
body.inmatch .mslot{min-height:0}
body.inmatch .mfield .mcard,body.inmatch .mfield .mempty{flex:1 1 auto;height:auto!important;min-height:0}
.mhandrow{position:relative;display:flex;gap:6px;align-items:stretch}
.mhandrow .mhandcol{flex:1;min-width:0}
.match{max-width:560px;margin:0 auto;padding:6px 8px 0;display:flex;flex-direction:column;gap:6px}
.pbar{display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap;font-size:11.5px;padding:4px 8px;border-radius:10px;background:var(--panel);border:1px solid transparent;color:var(--muted)}
.pbar.on{border-color:var(--accent)}
.pbar .nm{font-weight:800;font-size:13.5px;color:var(--text)}
.pbar .st{font-weight:850;font-size:15px;color:var(--text)}
.pbar .st small{font-size:11px;color:var(--muted);font-weight:600}
.pbar .badge,.pbar .chip,.pbar .flag{font-size:10.5px;padding:0 6px}
.mfield{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mslot{display:flex;flex-direction:column;gap:2px;min-width:0}
.mslot .lb{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;text-align:center}
.mslot.champ .lb{color:var(--accent);font-weight:700}
.mcard{--tc:#888;position:relative;height:118px;border-radius:9px;border:2px solid var(--tc);background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 24%,var(--panel2)) 0,var(--panel2) 55%);padding:4px 5px;display:flex;flex-direction:column;gap:1px;overflow:hidden;cursor:pointer;font-size:10px;user-select:none;min-width:0}
.mcard .mtop{display:flex;justify-content:space-between;color:var(--muted);font-size:8.5px;text-transform:uppercase;letter-spacing:.3px}
.mcard .mtop b{color:var(--text);font-size:10px}
.mcard .mnm{font-weight:750;font-size:11.5px;line-height:1.12;max-height:2.25em;overflow:hidden}
.mcard .mab{color:var(--accent);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard .msp{color:var(--atk);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard .mtxt{color:#c9ced8;line-height:1.25;overflow:hidden;flex:1}
.mcard .mtags{display:flex;flex-wrap:wrap;gap:2px}
.mcard .mtags span{font-size:8.5px;background:#0007;border-radius:3px;padding:0 3px;white-space:nowrap}
.mcard .mst{margin-top:auto;display:flex;justify-content:space-between;align-items:baseline;font-weight:800;font-size:14px}
.mcard .mst .atk{color:var(--atk)} .mcard .mst .def{color:var(--def)} .mcard .mst .hurt{color:var(--bad)} .mcard .mst .up{text-decoration:underline}
.mcard .mst small{font-size:10px;color:var(--muted)}
.mcard.target{box-shadow:0 0 0 3px var(--accent)}
.mcard.sel{box-shadow:0 0 0 3px var(--good)}
.mcard.dim{opacity:.5}
.mcard.back{background:repeating-linear-gradient(45deg,#2a2f3b 0 8px,#222631 8px 16px);border-color:#454b5a;cursor:default}
.mempty{height:118px;border:2px dashed var(--line);border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:10.5px}
.mhandlbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;text-align:center}
.mhand{display:flex;gap:6px;overflow-x:auto;padding:3px 2px 6px;-webkit-overflow-scrolling:touch}
.mhand .mcard{flex:0 0 88px}
.mhand .empty{margin:auto;font-size:12px}
.mmid{background:#191c22;border:1px solid var(--line);border-radius:12px;padding:7px 8px;display:flex;flex-direction:column;gap:6px;font-size:12.5px;text-align:center}
.mmid .pips{display:inline-flex;gap:3px;vertical-align:middle;margin-left:6px}
.mmid .pips i{width:10px;height:10px;border-radius:50%;background:var(--line);display:inline-block}
.mmid .pips i.on{background:var(--accent)}
.mmid .btns{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.mmid .btns button{padding:8px 10px;font-size:13px}
.mmid .small{font-size:11.5px;color:var(--muted)}
.mmid .pend{margin:0}
.gear{position:relative;align-self:flex-end;flex:0 0 auto;margin-bottom:6px;z-index:36;width:42px;height:42px;border-radius:50%;font-size:22px;padding:0;background:var(--panel2);border:1px solid #5a6480;box-shadow:0 4px 14px #0008}
.gmenu-bg{position:fixed;inset:0;z-index:36}
.gmenu{position:absolute;left:0;bottom:calc(100% + 6px);z-index:37;background:var(--panel);border:1px solid #5a6480;border-radius:14px;padding:6px;display:flex;flex-direction:column;gap:2px;min-width:230px;box-shadow:0 10px 30px #000a}
.gmenu button{text-align:left;border:0;background:transparent;padding:11px 12px;font-size:15px;border-radius:9px}
.gmenu button:hover{background:var(--panel2)}
.gmenu .confirm{padding:8px 10px;font-size:14px;display:flex;flex-direction:column;gap:8px}
.gmenu .confirm div{display:flex;gap:8px}
.sheet-bg{position:fixed;inset:0;background:#000a;z-index:50;display:flex;align-items:flex-end;justify-content:center}

function newMatch(o){
  const v=VARIANTS[o.variant];
  G={uid:1,online:!!o.online,mode:o.mode,target:o.mode==='blitz'?1:2,variant:o.variant,win:v.win,tro:v.tro,noEvo:o.noEvo,hide:o.online?false:o.hideHands,
     levM:!!o.levM,levAtk:!!o.levAtk,names:o.names.slice(),decks:o.decks.slice(),wins:[0,0],round:0,log:[],players:[null,null],histCount:HIST.length};
  UNDO=[];

  log(`${o.mode==='blitz'?'Partie Blitz (1 manche)':'Match (2 manches gagnantes)'} : ${G.names[0]} (${deckLabel(G.decks[0])}) contre ${G.names[1]} (${deckLabel(G.decks[1])}) · victoire à ${v.win} étoiles.`,'sys');
  log(`Pile ou face : ${G.names[G.first]} commence.`,'sys');

}
function startRound(){
  G.round++; G.turn=0; G.pturns=[0,0]; G.phase='setup'; G.mull=[0,0]; G.evoCount=0; G.start=Date.now();
  G.pending=[]; G.after=null; G.revealed=false; G.setupSel=[[],[]];
  log(`Manche ${G.round} · premier joueur : ${G.names[G.first]}`,'head');
  for(let p=0;p<2;p++){
    const P={deck:shuffle(expand(deckList(G.decks[p]))),hand:[],champion:null,bench:[],discard:[],trophies:0,piedFerme:false,elan:false};
    G.players[p]=P;
    const deal=()=>{for(let i=0;i<CONFIG.startHand;i++)P.hand.push({uid:nu(),id:P.deck.pop()});};
    deal();
    let g=0;
    while(!P.hand.some(h=>C(h.id).size==='P')&&g++<100){P.deck.push(...P.hand.map(h=>h.id));P.hand=[];shuffle(P.deck);deal();G.mull[p]++;}
    if(G.mull[p]) log(`${G.names[p]} : main noire ×${G.mull[p]} (aucun combattant ✯ en main).`,'sys');
  }
  for(let p=0;p<2;p++){const n=G.mull[1-p]*CONFIG.mulliganGift;
    for(let i=0;i<n;i++) G.players[p].hand.push({uid:nu(),id:G.players[p].deck.pop()});
    if(n) log(`${G.names[p]} pioche ${n} carte${s_(n)} grâce à la main noire adverse.`,'sys');}
  G.cur=G.first; G.handoff=G.hide;
}
function seatOfHand(uid){return PL(0).hand.some(h=>h.uid===uid)?0:PL(1).hand.some(h=>h.uid===uid)?1:-1;}
function setupToggle(uid){
  const seat=seatOfHand(uid); if(seat<0||PL(seat).champion) return;
  const h=PL(seat).hand.find(x=>x.uid===uid); if(C(h.id).cat!=='creature'||C(h.id).size!=='P') return;
  const sel=G.setupSel[seat], i=sel.indexOf(uid);
  if(i>=0) sel.splice(i,1); else if(sel.length<CONFIG.maxStarters) sel.push(uid); else if(CONFIG.maxStarters===1) sel[0]=uid;
}
function setupConfirm(seat){
  if(seat==null) seat=G.cur;
  const P=PL(seat), sel=G.setupSel[seat];
  const ids=sel.map(u=>{const i=P.hand.findIndex(h=>h.uid===u);return P.hand.splice(i,1)[0].id;});
  P.champion=makeC(ids[0],true); P.bench=ids.slice(1).map(id=>makeC(id,true));
  log(`${G.names[seat]} pose ${ids.length} combattant${s_(ids.length)} face cachée.`,'sys');
  if(!PL(1-seat).champion){ if(!G.online){G.cur=1-seat;G.handoff=G.hide;} return; }
  G.revealed=true;
  [0,1].forEach(p=>{const P=PL(p);log(`Révélation · ${G.names[p]} : champion ${nm(P.champion)}${P.bench.length?`, banc ${P.bench.map(nm).join(' et ')}`:', banc vide'}.`);});
  G.cur=G.first; startTurn();
}
function drawCard(p){const P=PL(p);if(!P.deck.length)return false;P.hand.push({uid:nu(),id:P.deck.pop()});return true;}
function lose(p,reason){if(!isOver()) endRound(1-p,reason);}
function startTurn(){
  G.turn++; G.pturns[G.cur]++;
  const P=cp();
  P.piedFerme=false; P.garde=0;
  G.actions=CONFIG.actionsPerTurn; G.evolved=[]; G.phase='actions'; G.after=null;
  log(`Tour ${G.turn} · ${G.names[G.cur]}`,'turn');
  if(!drawCard(G.cur)) return lose(G.cur,'deck vide');
  // Début de tour (v1.7) : pioche, puis soins (Soigneuse), puis dégâts (Brasier)
  const n=P.bench.filter(b=>abIs(C(b.id),'soigneuse')).length;
  if(n&&P.champion){const g=heal(P.champion,n);if(g)log(`Soigneuse${s_(n)} : ${nm(P.champion)} récupère ${g} DEF (${curDef(P.champion)}/${maxDef(P.champion)}).`,'good');}
  const burnt=mine(G.cur).filter(c=>c.burn);
  burnt.forEach(c=>{if(!mine(G.cur).includes(c))return;const x=c.burn;c.burn=0;const L=c.burnName||'Brasier';c.burnName=null;damage(G.cur,c,x,1-G.cur,`🔥 ${L} ${x}`);});
  if(burnt.length){aftermath();if(isOver())return;}
  G.handoff=G.hide;
}
function heal(c,n){const b=curDef(c);c.dmg=Math.max(0,c.dmg-n);return curDef(c)-b;}
function damage(p,c,n,src,label){
  c.dmg+=n;
  log(`${label?label+' : ':''}${nm(c)} (${G.names[p]}) subit ${n} dégât${s_(n)} → ${Math.max(0,curDef(c))}/${maxDef(c)} DEF.`, n?'bad':'');
  if(curDef(c)<=0) vanquish(p,c,src);
}
function vanquish(p,c,killer){
  const P=PL(p);
  if(P.champion===c) P.champion=null; else P.bench.splice(P.bench.indexOf(c),1);
  P.discard.push(c.id); if(c.item) P.discard.push(c.item);
  const card=C(c.id), t=G.tro[card.size];
  PL(killer).trophies+=t;
  log(`☠ ${card.name} est vaincu : ${G.names[killer]} récupère ${t} étoile${s_(t)} (${PL(killer).trophies}/${G.win}).`,'good');
  if(abIs(card,'embrasement')){
    const kc=PL(killer).champion;
    if(kc) damage(killer,kc,card.abX,p,`✦ ${ABIL[card.ab].name} ${card.abX}`);
    else log(`✦ ${ABIL[card.ab].name} : aucun champion à toucher.`,'sys');
  }
}
// Fin de résolution : victoire, remplacement, défaite (section 6.3)
function aftermath(){
  if(isOver()) return;
  const t=G.players.map(x=>x.trophies), def=1-G.cur;
  const r=[0,1].filter(i=>t[i]>=G.win);
  if(r.length===2) return endRound(t[0]>t[1]?0:t[1]>t[0]?1:def,'étoiles (les deux joueurs)');
  if(r.length===1) return endRound(r[0],`${G.win} étoiles`);
  const dead=[0,1].filter(i=>!PL(i).champion), lost=dead.filter(i=>!PL(i).bench.length);
  if(lost.length===2) return endRound(def,'deux champions vaincus, bancs vides');
  if(lost.length===1) return endRound(1-lost[0],'champion vaincu, banc vide');
  dead.forEach(i=>{
    const P=PL(i);
    if(P.bench.length===1) promote(i,P.bench[0].uid);
    else G.pending.push({kind:'replace',p:i,options:P.bench.map(b=>b.uid)});
  });
}
function promote(p,uid){
  const P=PL(p), c=P.bench.find(b=>b.uid===uid);
  P.bench.splice(P.bench.indexOf(c),1); P.champion=c;
  log(`${G.names[p]} : ${nm(c)} devient champion (remplacement).`);
}
function swap(p,uid,how){
  const P=PL(p), b=P.bench.find(x=>x.uid===uid), i=P.bench.indexOf(b), old=P.champion;
  P.bench[i]=old; P.champion=b;
  log(`${how} : ${nm(b)} devient champion de ${G.names[p]}, ${nm(old)} va au banc.`);
  const cb=C(b.id);
  if(cb.ab==='reflux'){const g=heal(b,cb.abX);log(`✦ Reflux : ${cb.name} récupère ${g} DEF (${curDef(b)}/${maxDef(b)}).`,'good');}
}
function onEnter(p,c){
  const card=C(c.id);
  if(abIs(card,'eclaireur')){ if(!drawCard(p)) return lose(p,'deck vide (Éclaireur)'); log(`✦ Éclaireur : ${G.names[p]} pioche 1 carte.`,'good'); }
  if(abIs(card,'eruption')){
    const t=mine(1-p).map(x=>x.uid);
    if(t.length===1) eruption(p,c.uid,t[0]);
    else G.pending.push({kind:'target',what:'eruption',p,src:c.uid,options:t});
  }
}
function eruption(p,srcUid,tUid){
  const src=findC(p,srcUid), card=src?C(src.id):null, x=card?card.abX:2;
  const t=findC(1-p,tUid); damage(1-p,t,x,p,`✦ ${card?ABIL[card.ab].name:'Éruption'} ${x}`);
  aftermath();
}
function canEvolve(c,card){
  const k=C(c.id);
  return k.fam===card.fam&&k.line&&k.line===card.line&&k.level===card.level-1
    &&(c.placedTurn<G.turn||abIs(k,'survolte'))&&!G.evolved.includes(c.uid)&&!(c.start&&G.pturns[G.cur]===1);
}
function evoOnly(c){return CONFIG.evoOnlyForLineage&&!(G&&G.noEvo)&&!!c.from&&!(G&&G.levM&&c.size==='M');}
function atkCost(){return G&&G.levAtk?0:CONFIG.attackCost;}
function takeHand(uid){const P=cp(),i=P.hand.findIndex(h=>h.uid===uid);return P.hand.splice(i,1)[0];}

/* ---- ce que permet une carte de la main ---- */
function handActions(h){
  if(!G||G.phase!=='actions'||G.pending.length||G.handoff) return [];
  const p=G.cur,P=cp(),O=op(),c=C(h.id),A=G.actions,out=[];
  const noA=n=>`Il faut ${n} action${s_(n)} (il en reste ${A})`;
  if(c.cat==='creature'){
    const cost=CONFIG.poseCost[c.size];
    if(!evoOnly(c)){
      const why=A<cost?noA(cost):P.bench.length>=CONFIG.benchSlots?'Banc plein':'';
      out.push({key:'pose',label:`Poser sur le banc (${cost})`,ok:!why,why});
    }
    if(!G.noEvo&&c.from){
      const t=mine(p).filter(x=>canEvolve(x,c)).map(x=>x.uid);
      let w='';
      if(A<CONFIG.evolveCost) w=noA(CONFIG.evolveCost);
      else if(!t.length){
        const any=mine(p).some(x=>x.id===c.from);
        w=!any?`Nécessite ${C(c.from).name} en jeu`
          :mine(p).some(x=>x.id===c.from&&x.start&&G.pturns[G.cur]===1)?'Les combattants posés à la préparation n\'évoluent pas pendant votre premier tour'
          :mine(p).some(x=>x.id===c.from&&x.placedTurn===G.turn&&!abIs(C(x.id),'survolte'))?'Posée ce tour : elle doit être en jeu au début du tour pour évoluer'
          :'Déjà évoluée ce tour';
      }
      out.push({key:'evolve',label:`Évoluer (${CONFIG.evolveCost})`,ok:!w,why:w,targets:t});
    }
    return out;
  }
  const cost=c.cat==='sort'?CONFIG.spellCost:CONFIG.itemCost;
  let why=A<cost?noA(cost):'', t=null;
  if(!why){
    if(c.id==='soin') t=mine(p).map(x=>x.uid);
    else if(c.id==='frappe') t=mine(1-p).map(x=>x.uid);
    else if(c.id==='echange_force'){t=O.bench.map(x=>x.uid);if(!t.length)why='Banc adverse vide';}
    else if(c.id==='renfort'){if(P.bench.length>=CONFIG.benchSlots)why='Banc plein';else t='deck';}
    else if(c.cat==='objet'){t=mine(p).filter(x=>!x.item).map(x=>x.uid);if(!t.length)why='Tous vos combattants ont déjà un objet';}
    else if(c.id==='pied_ferme'&&P.piedFerme) why='Déjà actif';
    else if(c.id==='elan'&&P.elan) why='Déjà actif ce tour';
  }
  out.push({key:c.cat==='objet'?'item':'spell',label:`${c.cat==='objet'?'Équiper':'Jouer'} (${cost})`,ok:!why,why,targets:t});
  return out;
}
function swapCost(b){return C(b.id).type===C(cp().champion.id).type?CONFIG.swapSameType:CONFIG.swapDiffType;}

/* ---- exécution ---- */
function doPose(uid){
  const h=takeHand(uid),c=makeC(h.id),cost=CONFIG.poseCost[C(h.id).size];
  cp().bench.push(c); G.actions-=cost;
  log(`${G.names[G.cur]} pose ${C(h.id).name} sur le banc (${cost} action${s_(cost)}).`);
  onEnter(G.cur,c);
}
function doEvolve(uid,tUid){
  const h=takeHand(uid), c=findC(G.cur,tUid), old=nm(c);
  const surv=c.placedTurn===G.turn;
  cp().discard.push(c.id); c.id=h.id; G.actions-=CONFIG.evolveCost; G.evolved.push(c.uid); G.evoCount++;
  if(abIs(C(c.id),'regeneration')&&c.dmg){c.dmg=0;log(`✦ Régénération : ${nm(c)} efface tous ses dégâts.`,'good');}
  log(`${G.names[G.cur]} fait évoluer ${old} en ${nm(c)}${surv?' (Survolté)':''} (${curDef(c)}/${maxDef(c)} DEF).`);
  onEnter(G.cur,c);
}
function doSpell(uid,tUid){
  const h=takeHand(uid),c=C(h.id),p=G.cur,P=cp(),n=G.names[p];
  P.discard.push(h.id); G.actions-=CONFIG.spellCost;
  if(c.id==='soin'){const t=findC(p,tUid),g=heal(t,CONFIG.heal);log(`${n} joue Soin : ${nm(t)} récupère ${g} DEF (${curDef(t)}/${maxDef(t)}).`,'good');}
  else if(c.id==='frappe'){const t=findC(1-p,tUid);log(`${n} joue Frappe sur ${nm(t)}.`);damage(1-p,t,CONFIG.frappe,p,'Frappe');aftermath();}
  else if(c.id==='echange_force'){log(`${n} joue Échange forcé.`);swap(1-p,tUid,'Échange forcé');}
  else if(c.id==='pied_ferme'){P.piedFerme=true;log(`${n} joue Pied ferme : son champion subira ${CONFIG.piedFerme} dégâts de moins par coup jusqu'à son prochain tour.`);}
  else if(c.id==='elan'){P.elan=true;log(`${n} joue Élan : +${CONFIG.elan} ATK à son champion ce tour.`);}
  else if(c.id==='pioche'){log(`${n} joue Pioche.`);for(let i=0;i<2;i++)if(!drawCard(p))return lose(p,'deck vide (Pioche)');}
}
function doRenfort(uid,cardId){
  const h=takeHand(uid),P=cp();
  P.discard.push(h.id); G.actions-=CONFIG.spellCost;
  if(!cardId){shuffle(P.deck);log(`${G.names[G.cur]} joue Renfort : aucun combattant ✯ dans le deck, l'atout est sans effet (deck mélangé).`,'sys');return;}
  P.deck.splice(P.deck.indexOf(cardId),1); shuffle(P.deck);
  const c=makeC(cardId); P.bench.push(c);
  log(`${G.names[G.cur]} joue Renfort : ${C(cardId).name} est posée sur le banc depuis le deck (deck mélangé).`);
  onEnter(G.cur,c);
}
function doItem(uid,tUid){
  const h=takeHand(uid),t=findC(G.cur,tUid);
  t.item=h.id; G.actions-=CONFIG.itemCost;
  log(`${G.names[G.cur]} équipe ${nm(t)} de ${C(h.id).name}${h.id==='plastron'?` (${curDef(t)}/${maxDef(t)} DEF)`:''}.`);
}
function doSwap(uid){
  if(isHeld(cp().champion)) return;
  const b=findC(G.cur,uid),cost=swapCost(b);
  G.actions-=cost;
  swap(G.cur,uid,`Échange (${cost} action${s_(cost)})`);
}
function isHeld(c){return !!(c&&c.heldUntil&&G&&G.turn<=c.heldUntil);}
// kind : 'base' ou 'spe' ; coin : résultat du Pari (true = face, false = pile, undefined = aperçu)
function attackCalc(kind,coin){
  kind=kind||'base';
  const A=cp(),D=op(),a=A.champion,d=D.champion,sp=C(a.id).spe;
  let atk=baseAtk(a)+(A.elan?CONFIG.elan:0);
  const parts=[`ATK ${atk}`]; let bonus=0,minus=0;
  if(kind==='spe'&&sp){
    if(sp.kw==='pari'&&coin===false) return {dmg:0,txt:'pile : l\'attaque rate, aucun dégât',kills:false,miss:true};
    if(sp.kw==='charge'||sp.kw==='assaut'||sp.kw==='pari'){bonus=sp.x;parts.push(`+${sp.x} ${SPE[sp.kw].name}${sp.kw==='pari'&&coin===undefined?' (si face)':''}`);}
    if(sp.kw==='acharnement'){ if(d.dmg>0){bonus=sp.x;parts.push(`+${sp.x} Acharnement`);} else parts.push('Acharnement sans effet (cible intacte)'); }
    if(sp.kw==='recherche'||sp.kw==='etreinte'){minus=1;}
  }
  const weak=C(d.id).weak===C(a.id).type;
  if(weak) parts.push(`+${CONFIG.weakBonus} faiblesse`);
  const red=armor(d)+(D.piedFerme?CONFIG.piedFerme:0)+(D.garde||0);
  if(armor(d)) parts.push(`−${armor(d)} Armure`);
  if(D.piedFerme) parts.push(`−${CONFIG.piedFerme} Pied ferme`);
  if(D.garde) parts.push(`−${D.garde} Garde`);
  if(minus) parts.push(`−1 ${SPE[sp.kw].name}`);
  const dmg=Math.max(0,atk+bonus+(weak?CONFIG.weakBonus:0)-red-minus);
  return {dmg,txt:parts.join(' ')+` = ${dmg}`,kills:dmg>=curDef(d)};
}
function attackBlocked(){
  if(G.phase!=='actions'||G.pending.length) return 'action en cours';
  if(!CONFIG.firstPlayerAttacksT1&&G.cur===G.first&&G.pturns[G.cur]===1) return 'le premier joueur n\'attaque pas à son premier tour';
  if(!(cp().champion&&op().champion)) return 'pas de champion';
  return '';
}
function canAttack(kind){
  if(attackBlocked()) return false;
  if(kind==='spe') return !!C(cp().champion.id).spe&&G.actions>=speCost(cp().champion.id);
  return G.actions>=atkCost();
}
function doAttack(kind){
  kind=kind==='spe'?'spe':'base';
  const p=G.cur,A=cp(),D=op(),a=A.champion,d=D.champion,card=C(a.id),sp=card.spe;
  let coin;
  if(kind==='spe'){G.actions-=speCost(a.id); if(sp.kw==='pari'){coin=Math.random()<.5; log(`🪙 Pari : la pièce tombe sur ${coin?'FACE':'PILE'}.`,coin?'good':'bad');}}
  else G.actions-=atkCost();
  const k=attackCalc(kind,coin);
  log(`⚔ ${nm(a)} attaque ${nm(d)} (${kind==='spe'?'attaque spéciale '+speLabel(card):'attaque de base'}) : ${k.txt}.`);
  if(!k.miss) damage(1-p,d,k.dmg,p);
  const dCard=C(d.id);
  if(!k.miss&&D.champion===d&&abIs(dCard,'riposte')&&A.champion===a) damage(p,a,dCard.abX,1-p,`↩ Riposte ${dCard.abX} de ${dCard.name}`);
  if(!k.miss&&!mine(1-p).includes(d)&&abIs(card,'frenesie')&&A.champion===a){
    const g=heal(a,card.abX);log(`✦ Frénésie : ${card.name} récupère ${g} DEF (${curDef(a)}/${maxDef(a)}).`,'good');}
  G.after='end';
  if(kind==='spe') speEffect(p,sp,a,d,k);
  if(!G.pending.some(x=>x.post)) aftermath();
  flow();
}
// Effet de l'attaque spéciale, après le coup (et ses conséquences) et avant la fin de la résolution
function speEffect(p,sp,a,d,k){
  const A=PL(p),D=PL(1-p),aliveA=A.champion===a,survived=D.champion===d;
  const kw=speBase(sp.kw),x=sp.x,L=SPE[sp.kw].name;
  if(kw==='assaut'&&aliveA){damage(p,a,x,1-p,`↩ Recul d'Assaut ${x}`);}
  else if(kw==='brasier'){
    if(!k.miss&&k.dmg>=1&&survived){if(x>=(d.burn||0)){d.burn=x;d.burnName=L;}log(`🔥 ${L} : ${nm(d)} subira ${d.burn} dégât${s_(d.burn)} direct${s_(d.burn)} au début du prochain tour de ${G.names[1-p]}.`);}
    else log(`🔥 ${L} sans effet (aucun dégât, ou cible vaincue).`,'sys');
  }
  else if(kw==='souffle'){
    const t=D.bench.map(c=>c.uid);
    if(!t.length) log('✦ Souffle : banc adverse vide, aucun effet.','sys');
    else if(t.length===1) souffleApply(p,t[0],x);
    else G.pending.push({kind:'target',what:'souffle',p,x,options:t,post:true,cardId:a.id});
  }
  else if(kw==='garde'){A.garde=Math.max(A.garde||0,x);log(`✦ Garde : jusqu'à son prochain tour, le champion de ${G.names[p]} subira ${x} dégât${s_(x)} de moins par coup.`);}
  else if(kw==='recherche'){ if(!drawCard(p)) return lose(p,'deck vide (Recherche)'); log(`✦ Recherche : ${G.names[p]} pioche 1 carte.`,'good'); }
  else if(kw==='vague'){ if(aliveA){const g=heal(a,x);log(`✦ Vague : ${nm(a)} récupère ${g} DEF (${curDef(a)}/${maxDef(a)}).`,'good');} }
  else if(kw==='repli'){
    if(!aliveA) return;
    if(isHeld(a)){log('✦ Repli impossible : votre champion est retenu par une Étreinte.','sys');return;}
    const t=A.bench.map(c=>c.uid);
    if(!t.length) log('✦ Repli : banc vide, aucun échange.','sys');
    else if(t.length===1) repliApply(p,t[0]);
    else G.pending.push({kind:'target',what:'repli',p,options:t,post:true,cardId:a.id});
  }
  else if(kw==='etreinte'){ if(survived&&!k.miss){d.heldUntil=G.turn+1;log(`✦ Étreinte : ${G.names[1-p]} ne pourra pas échanger ${nm(d)} pendant son prochain tour.`);} }
  else if(kw==='tourbillon'){
    if(!survived){log('✦ Tourbillon sans effet : la cible est vaincue.','sys');return;}
    const t=D.bench.map(c=>c.uid);
    if(!t.length) log('✦ Tourbillon : banc adverse vide, aucun effet.','sys');
    else if(t.length===1) swap(1-p,t[0],'✦ Tourbillon');
    else G.pending.push({kind:'target',what:'tourbillon',p,options:t,post:true,cardId:a.id});
  }
}
function souffleApply(p,uid,x){const t=findC(1-p,uid);damage(1-p,t,x,p,`✦ Souffle ${x}`);}
function repliApply(p,uid){
  const P=PL(p),b=P.bench.find(c=>c.uid===uid),i=P.bench.indexOf(b),old=P.champion;
  P.bench[i]=old;P.champion=b;log(`✦ Repli : ${nm(b)} devient champion de ${G.names[p]}, ${nm(old)} va au banc.`);
}
function endTurnNoAttack(){log(`${G.names[G.cur]} termine son tour sans attaquer.`,'sys');G.after='end';flow();}
function flow(){
  while(!isOver()&&!G.pending.length&&G.after){
    const a=G.after; G.after=null;
    if(a==='end'){
      const x=CONFIG.maxHand==null?0:cp().hand.length-CONFIG.maxHand;
      if(x>0) G.pending.push({kind:'discard',p:G.cur,n:x,chosen:[]});
      G.after='switch';
    } else if(a==='switch'){ cp().elan=false; G.cur=1-G.cur; startTurn(); }
  }
}
function endRound(w,reason){
  G.phase='roundover'; G.handoff=false; G.pending=[]; G.after=null;
  G.wins[w]++; G.lastWinner=w;
  HIST.push({round:G.round,decks:`${DECKS[G.decks[0]].name} (${G.names[0]}) contre ${DECKS[G.decks[1]].name} (${G.names[1]})${G.mode==='blitz'?' · Blitz':''}`,
    j1:G.names[G.first],winner:G.names[w],tours:G.turn,duree:((Date.now()-G.start)/60000).toFixed(1),
    troph:`${PL(0).trophies}–${PL(1).trophies}`,evos:G.evoCount,mull:`${G.mull[0]}/${G.mull[1]}`,reason,notes:''});
  G.histCount=HIST.length;
  log(`🏆 ${G.names[w]} remporte la manche ${G.round} (${reason}). Score ${G.wins[0]}–${G.wins[1]}.`,'good');
  if(G.wins[w]>=G.target){G.phase='matchover';if(G.mode!=='blitz')log(`${G.names[w]} remporte le match !`,'good');}
}
function nextRound(){G.first=1-G.lastWinner;startRound();}

/* ---- Collection : filtres et tri ---- */
const norm=t=>String(t).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function colCards(){
  const f=UI.col, catOrder={creature:0,sort:1,objet:2};
  let cs=Object.values(CARDS).filter(c=>{
    if(f.q&&!norm(c.name).includes(norm(f.q))) return false;
    if(f.cat!=='all'&&c.cat!==f.cat) return false;
    if(f.type!=='all'&&(c.cat!=='creature'||c.type!==f.type)) return false;
    if(f.stars!=='all'&&(c.cat!=='creature'||c.size!==f.stars)) return false;
    return true;
  });
  const base=(x,y)=>catOrder[x.cat]-catOrder[y.cat];
  const byStars=(x,y)=>(x.level||9)-(y.level||9)||DECK_ORDER.indexOf(x.fam)-DECK_ORDER.indexOf(y.fam)||String(x.line||'Z').localeCompare(String(y.line||'Z'))||x.name.localeCompare(y.name,'fr');
  // ▼ = du plus grand au plus petit, ▲ = du plus petit au plus grand ; atouts et objets toujours après les combattants
  const num=(k,dir)=>(x,y)=>base(x,y)||dir*((x[k]||0)-(y[k]||0))||byStars(x,y);
  const sorts={
    name:(x,y)=>x.name.localeCompare(y.name,'fr'),
    type:(x,y)=>base(x,y)||TYPE_CIRCLE.indexOf(x.type)-TYPE_CIRCLE.indexOf(y.type)||byStars(x,y),
    starsD:num('level',-1), starsA:num('level',1),
    atkD:num('atk',-1), atkA:num('atk',1), defD:num('def',-1), defA:num('def',1)
  };
  return cs.sort(sorts[f.sort]||sorts.starsA);
}
function colGridHTML(){
  const cs=colCards();
  return `<p class="muted" style="margin:0 0 10px">${cs.length} carte${s_(cs.length)}</p>`+
    (cs.length?`<div class="grid compact">${cs.map(c=>cardHTML(c.id,{cls:'click',attrs:`data-a="detail:${c.id}"`})).join('')}</div>`:'<p class="muted">Aucune carte ne correspond.</p>');
}
function renderCollection(){

  const bar=`<div class="filters">
    <input data-col="q" type="search" placeholder="Rechercher une carte…" value="${esc(f.q)}">
    ${sel('cat','Catégorie',[['all','Toutes'],['creature','Combattants'],['sort','Atouts'],['objet','Objets']])}
    ${sel('type','Type',[['all','Tous'],...TYPE_CIRCLE.map(t=>[t,TYPES[t].name])])}
    ${sel('stars','Étoiles',[['all','Toutes'],['P','✯'],['M','✯✯'],['G','✯✯✯']])}
    ${sel('sort','Trier par',[['name','Nom'],['type','Type'],['starsD','Étoiles ▼'],['starsA','Étoiles ▲'],['atkD','ATK ▼'],['atkA','ATK ▲'],['defD','DEF ▼'],['defA','DEF ▲']])}</div>`;
  return `<div class="page ctr"><div class="ptop"><h2>Collection</h2><button class="right" data-a="go:cartes:decks">Decks ›</button></div>${bar}<div id="colgrid">${colGridHTML()}</div></div>`;
}

const RULES_HTML=`
<p class="muted">Manuel des règles, livret des decks découverte et livret des decks à thème · Duel des champions · 23 octobre 2026</p>
<h3>1. But du jeu</h3>
<p><b>Le premier joueur qui récupère 6 étoiles gagne la partie.</b> L'arène est la zone de jeu : l'espace du champion et le banc de chaque joueur. Chaque joueur a <b>un champion</b> qui se bat et jusqu'à <b>deux remplaçants</b> sur le banc. Chaque fois que vous vainquez un combattant adverse, vous récupérez son nombre d'étoiles.</p>
<p>Vous perdez aussi si vous n'avez plus de combattant disponible (champion vaincu et banc vide), ou si vous devez piocher alors que votre deck est vide.</p>
<h3>2. Les cartes</h3>
<p>Trois sortes de cartes : les <b>combattants</b>, les <b>atouts</b> et les <b>objets</b>.</p>
<p>Un combattant a un <b>type</b> (Eau, Feu, Combat, Roche, Électrique ou Neutre), un <b>nombre d'étoiles</b> (✯, ✯✯ ou ✯✯✯), une <b>ATK</b>, une <b>DEF</b> (qui sert aussi de points de vie : les dégâts sont retirés de la DEF restante), une <b>faiblesse</b>, une <b>attaque spéciale</b> avec son coût en actions, et parfois une <b>capacité</b>.</p>
<table><tr><th>Étoiles</th><th>Coût de pose</th><th>Étoiles données</th></tr><tr><td>✯</td><td>1 action</td><td>1</td></tr><tr><td>✯✯</td><td>2 actions</td><td>2</td></tr><tr><td>✯✯✯</td><td>3 actions</td><td>3</td></tr></table>
<p>Les ✯✯ et ✯✯✯ d'une <b>lignée d'évolution</b> ne se posent pas directement : ils arrivent par évolution (section 8).</p>
<p>Un <b>atout</b> produit un effet immédiat, puis il est défaussé. Un <b>objet</b> se fixe à l'un de vos combattants (champion ou banc), un seul par combattant, et il est défaussé avec lui. Un deck contient <b>30 cartes</b>, 3 exemplaires maximum d'une même carte.</p>
<h3>3. Préparer une partie</h3>
<ol><li>Mélangez votre deck et piochez <b>6 cartes</b>.</li>
<li><b>Main noire</b> : sans combattant ✯ en main, remettez la main dans le deck, mélangez et repiochez 6 cartes, autant de fois que nécessaire. À chaque main noire, votre adversaire pioche 1 carte de plus.</li>
<li>Posez face cachée <b>1 combattant ✯</b> de votre main, sans payer d'action : c'est votre champion. Le banc commence vide. Les deux joueurs révèlent leur champion en même temps.</li>
<li>Pile ou face pour désigner le premier joueur. Les compteurs d'étoiles démarrent à 0.</li></ol>
<h3>4. Le tour de jeu</h3>
<ol><li><b>Début de tour</b> : piochez 1 carte (deck vide : vous perdez), puis les soins (Soigneuse), puis les dégâts (Brasier). Un combattant vaincu ainsi est remplacé avant vos actions.</li>
<li><b>Actions</b> : 3 actions, dans l'ordre que vous voulez.</li>
<li><b>Attaque</b> : votre champion peut attaquer avec son <b>attaque de base</b> (gratuite) ou son <b>attaque spéciale</b> (section 5). L'attaque termine votre tour. Vous pouvez ne pas attaquer.</li>
<li><b>Fin de tour</b> : les effets « jusqu'à la fin du tour » s'arrêtent.</li></ol>
<table><tr><th>Action</th><th>Coût</th></tr>
<tr><td>Poser un combattant de la main sur le banc</td><td>1 (✯), 2 (✯✯) ou 3 (✯✯✯)</td></tr>
<tr><td>Jouer un atout ou poser un objet</td><td>1</td></tr>
<tr><td>Échanger le champion avec un combattant du banc du même type</td><td>1</td></tr>
<tr><td>Échanger le champion avec un combattant du banc d'un type différent</td><td>2</td></tr>
<tr><td>Faire évoluer un combattant en jeu</td><td>1</td></tr></table>
<ul><li>L'attaque de base n'est pas une action : vous pouvez dépenser vos 3 actions puis attaquer. L'attaque spéciale se paie avec les actions qui vous restent au moment d'attaquer : gardez-en assez.</li>
<li>Les actions non utilisées sont perdues. Vous pouvez jouer plusieurs atouts dans le même tour.</li>
<li>Le banc a 2 places. Les combattants se posent toujours sur le banc ; le champion change par échange ou après une défaite.</li>
<li>Le premier joueur n'attaque pas lors de son premier tour.</li></ul>
<h3>5. Le combat</h3>
<p>Votre champion attaque le champion adverse, avec <b>l'attaque de base</b> (gratuite : il inflige son ATK) ou <b>son attaque spéciale</b> (coût de 0, 1 ou 2 actions, écrit sur la carte). Les deux terminent le tour, et on n'attaque qu'une fois par tour.</p>
<p>Dégâts = <b>ATK</b> + bonus d'ATK (Épée, Élan) + bonus de l'attaque spéciale, <b>+1</b> si le type de votre champion est la faiblesse de la cible, moins les réductions de dégâts de la cible (le coup peut tomber à 0). Les dégâts sont retirés de la DEF restante et <b>restent d'un tour à l'autre</b>.</p>
<p><b>Ordre</b> : on résout d'abord le coup sur la cible (combattant vaincu, étoiles, Embrasement), puis l'effet de l'attaque spéciale (recul, soin, pioche, échange…), puis la fin de la résolution (section 6).</p>
<h3>6. Combattant vaincu, remplacement et fin de partie</h3>
<p>Un combattant dont la DEF restante tombe à 0 ou moins est vaincu : il est défaussé avec son objet, puis l'adversaire récupère ses étoiles (1, 2 ou 3).</p>
<p>Quand l'attaque ou l'atout est entièrement résolu, on vérifie :</p>
<ol><li><b>Victoire</b> : un joueur à 6 étoiles ou plus gagne. Si les deux y arrivent, celui qui en a le plus gagne ; en cas d'égalité, le défenseur gagne.</li>
<li><b>Remplacement</b> : le joueur dont le champion est vaincu choisit un combattant de son banc, qui devient champion gratuitement.</li>
<li><b>Défaite</b> : sans combattant sur son banc, ce joueur perd. Si les deux perdent en même temps, le défenseur gagne.</li></ol>
<p>Si votre champion est vaincu par un atout, le remplacement a lieu après la résolution de l'atout.</p>
<h3>7. Atouts et objets des decks</h3>
<p>Chaque atout ou objet coûte le nombre d'actions indiqué sur sa carte (1 pour tous ceux des decks découverte).</p>
<table><tr><th>Carte</th><th>Effet</th></tr>
<tr><td><b>Frappe</b> ×2</td><td>3 dégâts directs à un combattant adverse (champion ou banc).</td></tr>
<tr><td><b>Soin</b> ×2</td><td>Un de vos combattants (champion ou banc) récupère 4 DEF, sans dépasser sa DEF maximale.</td></tr>
<tr><td><b>Élan</b></td><td>+2 ATK à votre champion jusqu'à la fin du tour.</td></tr>
<tr><td><b>Échange forcé</b></td><td>Vous choisissez le combattant du banc adverse qui devient son champion ; l'ancien champion va au banc.</td></tr>
<tr><td><b>Pioche</b></td><td>Piochez 2 cartes.</td></tr>
<tr><td><b>Renfort</b></td><td>Cherchez un ✯ dans votre deck et posez-le sur votre banc (place libre nécessaire), puis mélangez. Il compte comme posé depuis la main. Jouable même sans ✯ dans le deck : vous mélangez simplement.</td></tr>
<tr><td><b>Plastron</b></td><td>+2 DEF tant que le combattant est en jeu (DEF de départ et DEF restante).</td></tr>
<tr><td><b>Épée</b></td><td>+1 ATK tant que le combattant est en jeu.</td></tr></table>
<p>Frappe et Échange forcé ne se jouent que s'il existe une cible valide.</p>
<h3>8. L'évolution</h3>
<p>Une lignée va d'un ✯ à un ✯✯, puis éventuellement à un ✯✯✯. Les ✯✯ et ✯✯✯ d'une lignée ne se posent jamais depuis la main ; un combattant hors lignée se pose normalement.</p>
<ol><li>Évoluer coûte <b>1 action</b>, une étape à la fois.</li>
<li>Jouez la carte suivante de la lignée sur un de vos combattants en jeu de la même lignée (champion ou banc). L'ancienne carte est défaussée sans donner d'étoile.</li>
<li>Le combattant garde sa place, son objet et ses dégâts.</li>
<li>Il ne peut évoluer que s'il était <b>déjà en jeu au début de votre tour</b> (pas d'évolution le tour de la pose, ni deux fois par tour).</li>
<li>La carte jouée compte comme posée depuis la main et utilise sa propre capacité, sa propre attaque spéciale et sa propre faiblesse.</li>
<li>Vaincue plus tard, elle rapporte les étoiles de sa nouvelle carte.</li></ol>
<p>Le champion posé lors de la préparation ne peut pas évoluer pendant le premier tour de son propriétaire.</p>
<h3>9. Types et faiblesses</h3>
<p>Les cinq types forment un cercle : <b>Eau &gt; Feu &gt; Combat &gt; Roche &gt; Électrique &gt; Eau</b>. Quand un combattant attaque un combattant dont la faiblesse est son type, le coup inflige 1 dégât de plus.</p>
<table><tr><th>Type</th><th>Bat</th><th>Est battu par</th></tr>
<tr><td>Eau</td><td>Feu</td><td>Électrique</td></tr><tr><td>Feu</td><td>Combat</td><td>Eau</td></tr><tr><td>Combat</td><td>Roche</td><td>Feu</td></tr><tr><td>Roche</td><td>Électrique</td><td>Combat</td></tr><tr><td>Électrique</td><td>Eau</td><td>Roche</td></tr></table>
<p>Entre Vague (Eau) et Poing (Combat), aucune faiblesse ne joue.</p>
<h3>10. Capacités</h3>
<table><tr><th>Capacité</th><th>Effet</th></tr>
<tr><td><b>Éclaireur</b></td><td>Quand vous posez ce combattant, piochez 1 carte.</td></tr>
<tr><td><b>Soigneuse</b></td><td>Tant qu'il est sur votre banc, votre champion récupère 1 DEF au début de votre tour (cumulable, sans dépasser la DEF maximale, avant les dégâts de Brasier).</td></tr>
<tr><td><b>Éruption X</b> · <b>Onde de choc X</b></td><td>Quand vous posez ce combattant, il inflige X dégâts directs à un combattant adverse de votre choix (champion ou banc).</td></tr>
<tr><td><b>Embrasement X</b> · <b>Coup d'honneur X</b></td><td>Quand ce combattant est vaincu, il inflige X dégâts directs au champion du joueur qui l'a vaincu (après le décompte des étoiles ; peut s'enchaîner).</td></tr>
<tr><td><b>Armure X</b></td><td>Ce combattant subit X dégâts de moins par coup (le coup peut tomber à 0).</td></tr>
<tr><td><b>Survolté</b></td><td>Ce combattant peut évoluer pendant le tour où il a été posé (toujours une seule évolution par tour ; le champion de départ n'évolue pas au premier tour).</td></tr>
<tr><td><b>Riposte X</b></td><td>Quand ce combattant est champion et survit à un coup, il inflige X dégâts directs au champion qui l'a frappé.</td></tr>
<tr><td><b>Régénération</b></td><td>Quand ce combattant arrive par évolution, il efface tous ses dégâts.</td></tr>
<tr><td><b>Frénésie X</b></td><td>Quand ce combattant vainc le champion adverse en l'attaquant, il récupère X DEF.</td></tr></table>
<ul><li>« Quand vous posez » : pose depuis la main, évolution ou Renfort, jamais après un échange ou un remplacement.</li>
<li><b>Dégâts directs</b> (Frappe, Éruption, Onde de choc, Embrasement, Coup d'honneur, Brasier, Contusion, Souffle, Riposte) : ni la faiblesse ni les réductions (Armure, Garde) ne s'appliquent.</li>
<li><b>Armure et Garde</b> se cumulent, mais ne réduisent que les coups, jamais les dégâts directs.</li>
<li><b>Riposte et Frénésie</b> se résolvent juste après le coup, avant l'effet de l'attaque spéciale. Riposte ne joue que si le champion survit au coup.</li>
<li>Sur les cartes de Poing, <b>Contusion</b> = Brasier, <b>Coup d'honneur</b> = Embrasement, <b>Onde de choc</b> = Éruption.</li></ul>
<h3>11. Attaques spéciales</h3>
<table><tr><th>Mot-clé</th><th>Coût</th><th>Effet</th></tr>
<tr><td><b>Charge X</b></td><td>X</td><td>Le coup inflige X dégâts de plus.</td></tr>
<tr><td><b>Assaut X</b></td><td>0</td><td>Le coup inflige X dégâts de plus, puis votre champion subit X dégâts directs (recul). S'il tombe à 0 DEF, il est vaincu.</td></tr>
<tr><td><b>Pari X</b></td><td>0</td><td>Pièce : face, le coup inflige X dégâts de plus ; pile, l'attaque rate (elle compte quand même et termine le tour).</td></tr>
<tr><td><b>Acharnement X</b></td><td>1</td><td>Si la cible avait déjà subi des dégâts avant ce coup, le coup inflige X dégâts de plus.</td></tr>
<tr><td><b>Brasier X</b> · <b>Contusion X</b></td><td>1</td><td>Si le coup inflige au moins 1 dégât, la cible subit X dégâts directs au début du prochain tour de son propriétaire, après les soins (un seul à la fois par cible, le plus fort).</td></tr>
<tr><td><b>Souffle X</b></td><td>1</td><td>Après le coup, X dégâts directs à un combattant du banc adverse de votre choix.</td></tr>
<tr><td><b>Recherche</b></td><td>1</td><td>Le coup inflige 1 dégât de moins (minimum 0), puis piochez 1 carte.</td></tr>
<tr><td><b>Vague X</b></td><td>1</td><td>Après le coup, votre champion récupère X DEF (sans dépasser sa DEF maximale).</td></tr>
<tr><td><b>Garde X</b></td><td>1</td><td>Après le coup, jusqu'au début de votre prochain tour, votre champion subit X dégâts de moins par coup.</td></tr>
<tr><td><b>Repli</b></td><td>1</td><td>Après le coup, échangez votre champion avec un combattant de votre banc, sans payer l'échange.</td></tr>
<tr><td><b>Étreinte</b></td><td>0</td><td>Le coup inflige 1 dégât de moins (minimum 0). Si la cible survit, son propriétaire ne peut pas l'échanger pendant son prochain tour (Échange forcé reste possible).</td></tr>
<tr><td><b>Tourbillon</b></td><td>1</td><td>Si la cible survit, choisissez un combattant du banc adverse : il devient champion, l'ancien champion va au banc.</td></tr></table>
<p><b>Ordre</b> : le coup sur la cible (vaincu, étoiles, Embrasement, Riposte, Frénésie), puis l'effet de l'attaque spéciale, puis la fin de la résolution.</p>
<h3>12. Précisions</h3>
<ul><li>Il n'y a pas de limite de cartes en main.</li>
<li>Seule votre main reste cachée : champion, banc, objets, étoiles, DEF restantes et défausse sont visibles par les deux joueurs.</li>
<li>Les objets restent attachés au combattant quand il change de place.</li>
<li>Embrasement se résout après le décompte des étoiles ; la victoire est vérifiée une fois toute la résolution terminée.</li></ul>`;
function renderDetail(id){
  const c=C(id); let info='<dl>';
  if(c.cat==='creature'){
    info+=`<dt>Type et étoiles</dt><dd>${TYPES[c.type].name} · ${STARS[c.size]} · ATK ${c.atk} / DEF ${c.def}</dd>`;
    info+=`<dt>Faiblesse</dt><dd>${TYPES[c.weak].name} : +${CONFIG.weakBonus} dégât quand un combattant ${TYPES[c.weak].name} l'attaque</dd>`;
    info+=`<dt>Entrée en jeu</dt><dd>${c.from?`Uniquement par évolution depuis ${C(c.from).name} (${CONFIG.evolveCost} action, sur un combattant en jeu au début du tour). Jamais posé directement depuis la main.`:`Pose sur le banc : ${CONFIG.poseCost[c.size]} action${s_(CONFIG.poseCost[c.size])}`}</dd>`;
    info+=`<dt>Étoiles données si vaincu</dt><dd>${G?G.tro[c.size]:VARIANTS.std.tro[c.size]}</dd>`;
    if(c.spe) info+=`<dt>Attaque spéciale ⚔ ${speLabel(c)} (${speCostTxt(speCost(id))})</dt><dd>${esc(SPE[c.spe.kw].text(c.spe.x))}</dd>`;
    if(c.ab) info+=`<dt>Capacité ✦ ${abLabel(c)}</dt><dd>${esc(ABIL[c.ab].text(c.abX))}</dd>`;
    info+=`<dt>Lignée</dt><dd>${lineLabel(c)}</dd>`;
  } else info+=`<dt>${c.cat==='sort'?'Atout':'Objet'} · 1 action</dt><dd>${esc(c.text)}</dd>`;
  const inDecks=DECK_ORDER.map(k=>{const e=DECKS[k].list.find(([x])=>x===id);return e?`${DECKS[k].name} ×${e[1]}`:null;}).filter(Boolean);
  info+=`<dt>Présente dans</dt><dd>${inDecks.join(' · ')||'—'}</dd></dl>`;
  let chain='';
  if(c.cat==='creature'&&c.line){
    let first=c; while(first.from) first=C(first.from);
    const ids=[]; for(let x=first;x;x=x.next?C(x.next):null) ids.push(x.id);
    chain=`<h3>Lignée ${c.line}</h3><div class="chain">${ids.map(x=>cardHTML(x,{cls:'click'+(x===id?' sel':''),attrs:`data-a="detail:${x}"`})).join('<span class="arr">→</span>')}</div>`;
  }
  return `<div class="modal-bg" data-a="close"><div class="modal"><button class="mclose ghost" data-a="close">✕</button>
    <div class="mrow">${cardHTML(id,{cls:'big'})}<div class="minfo"><h2 style="margin:0">${esc(c.name)}</h2>${info}</div></div>${chain}</div></div>`;
}

/* ---- Combat : menus ---- */
function deckChoice(i){
  const r=UI.rand[i], k=UI.pick[i];
  return `<div style="display:flex;gap:8px;align-items:stretch"><button class="deckbtn" style="--tc:${r?'var(--line)':deckColor(k)}" data-a="go:combat:${UI.nav.combat.join(':')}:deck${i}"><small>Choix du deck</small><b>${r?'Aléatoire':deckLabel(k)}</b> ›</button><button class="randbtn ${r?'on':''}" data-a="pickrand:${i}" title="Deck aléatoire" aria-label="Deck aléatoire">🎲</button></div>`;
}
function resolveDeck(i){return UI.rand[i]?DECK_ORDER[Math.floor(Math.random()*DECK_ORDER.length)]:UI.pick[i];}
function deckChooser(i){
  const cur=UI.rand[i]?null:UI.pick[i], base=UI.nav.combat.join(':');
  const tiles=DECK_GROUPS.map(([g,t])=>`<h3>${t}</h3><div class="dtiles">${DECK_ORDER.filter(k=>DECKS[k].group===g).map(k=>deckTile(k,`go:combat:${base}:${k}`,k===cur)).join('')}</div>`).join('');
  return `<div class="page ctr">${navHead('combat','Choix du deck')}<p class="muted" style="margin-top:0">Touchez un deck pour voir sa composition et le choisir.</p>${tiles}
</div>`;
}
function deckPick(i,withRandom){
  return `<div class="dpick">${DECK_GROUPS.map(([g,t])=>`<span class="muted" style="width:100%;font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin-top:4px">${t}</span>`+DECK_ORDER.filter(k=>DECKS[k].group===g).map(k=>`<button class="dchip ${!UI.rand[i]&&UI.pick[i]===k?'on':''}" style="--tc:${deckColor(k)}" data-a="pick:${i}:${k}">${deckLabel(k)}</button>`).join('')).join('')}${withRandom?`<button class="dchip ${UI.rand[i]?'on':''}" style="--tc:var(--accent)" data-a="pickrand:${i}">🎲 Aléatoire</button>`:''}</div>`;
}
function modeChips(){
  const chip=(val,label)=>`<button class="dchip ${UI.mode===val?'on':''}" style="--tc:var(--accent)" data-a="set:mode:${val}">${label}</button>`;
  return `<div class="duels">${chip('match','Match · 2 manches gagnantes')}${chip('blitz','Blitz · 1 manche')}</div>`;
}

      <p>${esc(NET.status||'')}</p><p class="muted">Donnez ce code à votre adversaire : il choisit « Rejoindre un match » sur son appareil.</p>
      <button data-a="netcancel">Annuler</button></div></div>`;

function midParts(){

  if(G.phase==='setup'){

    info=`<div>${head}</div><div><b>Tour ${G.turn}</b> · ${n}</div><div>${pips}</div>`;
    const pd=G.pending[0];
    if(G.online&&actingPlayer()!==MY_SEAT){
      main+=`<div class="small">En attente de ${esc(G.names[actingPlayer()])}…${pd?' ('+pendingText(pd)+')':''}</div>`;
    } else if(pd){

      if(why){ main+=`<div class="small">Pas d'attaque : ${why}.</div>`; btns=`<button class="primary" data-a="endturn">Fin du tour</button>`; }
      else {

        btns=`<button class="primary" data-a="attack:base" title="Gratuite · termine le tour">⚔ Base · ${dm(kb)}</button>
          ${sp?`<button class="primary" data-a="attack:spe" ${okS?'':'disabled'} title="${okS?esc(SPE[sp.kw].text(sp.x)):`Il faut ${sc} action${s_(sc)}`}">✦ ${esc(speLabel(card))} (${sc}) · ${dm(ks,sp.kw==='pari')}</button>`:''}
          <button data-a="endturn">Fin du tour</button>`;
        if(sp&&!okS) main+=`<div class="small">${esc(speLabel(card))} : il faut ${sc} action${s_(sc)}.</div>`;
      }
    }

  else if(G.phase==='roundover'){
    main=`<div class="banner">🏆 <b>${esc(G.names[G.lastWinner])}</b> remporte la manche ${G.round}. Score ${G.wins[0]}–${G.wins[1]}.</div>`;

  return {info,main,btns,undo,over:G.phase==='roundover'||G.phase==='matchover'};

function boardCard(p,c,isChamp){

  const stats={atk,def:`${curDef(c)}/${maxDef(c)}`,ac:atk>card.atk?'up':'',dc:c.dmg?'hurt':(maxDef(c)>card.def?'up':'')};
  let tags='';

  if(G.evolved&&G.evolved.includes(c.uid)&&G.phase==='actions') tags+='<span class="tag st">Évoluée ce tour</span>';
  if(c.start&&G.pturns[p]<=1) tags+='<span class="tag">Départ</span>';
  if(c.burn) tags+=`<span class="tag" style="background:#ff5c5c33;color:#ffb199">🔥 ${c.burnName||'Brasier'} ${c.burn}</span>`;
  if(isHeld(c)) tags+='<span class="tag" style="background:#3b8ff033;color:#9cc8ff">Étreint</span>';
  if(c.placedTurn===G.turn&&G.phase==='actions'&&!c.start) tags+='<span class="tag">Posée ce tour</span>';
  let cls='',attrs='';
  const pd=G.pending[0];
  if(pd&&pd.options&&pd.options.includes(c.uid)&&mine_(pd.p)){cls='target';attrs=`data-a="pk:${c.uid}"`;}
  let btn='';
  if(!isChamp&&p===G.cur&&mine_(p)&&G.phase==='actions'&&!G.pending.length&&!G.handoff){
    const cost=swapCost(c);
    const held=isHeld(PL(p).champion);
    btn=`<button data-a="swap:${c.uid}" ${G.actions>=cost&&!held?'':'disabled'} title="${held?'Champion retenu par une Étreinte : pas d\'échange ce tour':''}${cost===CONFIG.swapSameType?'Même type':'Types différents'} : ${cost} action${s_(cost)}${G.actions<cost?' (pas assez d\'actions)':''}">Échanger (${cost})</button>`;
  }
  return `<div class="hcard">${cardHTML(c.id,{cls,attrs,stats,uid:c.uid,extra:tags?`<div class="tags">${tags}</div>`:''})}${btn}</div>`;

function pendingText(pd){
  const n=esc(G.names[pd.p]);
  if(pd.kind==='deckpick') return `Renfort : choisissez le combattant ✯ de votre deck à poser sur le banc.`;
  if(pd.kind==='replace') return `${n} : choisissez sur votre banc le nouveau champion.`;
  if(pd.kind==='discard') return `${n} : main de plus de ${CONFIG.maxHand} cartes, choisissez ${pd.n} carte${s_(pd.n)} à défausser (${pd.chosen.length}/${pd.n}).`;
  const w=pd.what;
  if(w==='eruption') return `✦ Éruption : choisissez le combattant adverse touché (champion ou banc).`;
  if(w==='souffle') return `✦ Souffle ${pd.x} : choisissez le combattant du banc adverse touché.`;
  if(w==='repli') return `✦ Repli : choisissez le combattant de votre banc qui devient champion.`;
  if(w==='tourbillon') return `✦ Tourbillon : choisissez le combattant du banc adverse qui devient son champion.`;
  if(w==='evolve') return `Choisissez le combattant qui évolue en ${C(pd.cardId).name}.`;
  if(w==='item') return `Choisissez le combattant qui reçoit ${C(pd.cardId).name}.`;
  return `${C(pd.cardId).name} : choisissez la cible.`;
}

  else h+=`<dt>Lignée</dt><dd>hors lignée (n'évolue pas)</dd>`;
  return h+'</dl>';

  mmodal(k){UI.mmodal=k;UI.gmenu=false;render();},
  closemm(_,e,el){if(el.classList.contains('modal-bg')&&e.target!==el)return;UI.mmodal=null;render();},
  undo(){if(!UNDO.length)return;if(G.online&&!undoAllowed(ACT_SEAT!=null?ACT_SEAT:0))return;G=JSON.parse(UNDO.pop());G.handoff=false;if(HIST.length>G.histCount)HIST.length=G.histCount;render();},
  copyreg(){
    const txt=registryText(), fb=()=>{UI.exportText=txt;render();};
    if(navigator.clipboard&&window.isSecureContext) navigator.clipboard.writeText(txt).then(()=>toast('Registre copié (tableau Markdown)'),fb); else fb();
  }
};
function execTarget(pd,uid){
  const w=pd.what;
  if(w==='souffle'||w==='repli'||w==='tourbillon'){
    if(w==='souffle') souffleApply(pd.p,uid,pd.x); else if(w==='repli') repliApply(pd.p,uid); else swap(1-pd.p,uid,'✦ Tourbillon');
    return aftermath();
  }
  if(w==='eruption') return eruption(pd.p,pd.src,uid);
  if(w==='evolve') return doEvolve(pd.handUid,uid);
  if(w==='item') return doItem(pd.handUid,uid);
  return doSpell(pd.handUid,uid);
}
const GAME_ACTIONS=new Set(['ssel','setupok','play','pk','rf','swap','attack','endturn','cancel','undo','nextround','rematch']);
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]'); if(!el||el.disabled) return;
  const [a,...args]=el.dataset.a.split(':');
  if(a==='play'||a==='swap'||a==='attack'||a==='endturn') UI.sheet=null;
  if(G&&G.online&&GAME_ACTIONS.has(a)){
    if(NET.role==='guest'){ if(NET.conn&&NET.conn.open) NET.conn.send({t:'act',a,args}); return; }
    if(NET.role==='host'){ hostExec(0,a,args); return; }
  }
  if(H[a]) H[a](...(args.length?args:[undefined]),e,el);
});
document.addEventListener('change',e=>{if(e.target.closest('[data-col]')){colUpdate(e);return;}const o=e.target.closest('[data-opt]');if(o)UI[o.dataset.opt]=o.checked;});
function colUpdate(e){const el=e.target.closest('[data-col]');if(!el)return false;UI.col[el.dataset.col]=el.value;const g=$('#colgrid');if(g)g.innerHTML=colGridHTML();return true;}
document.addEventListener('input',e=>{if(colUpdate(e))return;const n=e.target.closest('[data-note]');if(n&&HIST[+n.dataset.note])HIST[+n.dataset.note].notes=n.value;});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(UI.detail||UI.exportText!==null||UI.sheet||UI.mmodal||UI.gmenu)){UI.detail=null;UI.exportText=null;UI.sheet=null;UI.mmodal=null;UI.gmenu=false;render();}});
/* =========================================================
   RÉSEAU (en ligne, 2 appareils) — PeerJS, l'hôte est l'arbitre
   ========================================================= */
const NET={role:null,peer:null,conn:null,code:'',status:'',err:'',lost:false};
const PEER_PREFIX='rojjjo-tcg-';
function peerOptions(){
  // ?peer=hote:port pour utiliser votre propre serveur PeerJS (tests) ; sinon le service gratuit PeerJS
  const q=new URLSearchParams(location.search).get('peer');
  if(!q) return {debug:0};
  const [host,port]=q.split(':'); return {host,port:+port||9000,path:'/',secure:false,debug:0};
}
function newCode(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let c='';for(let i=0;i<4;i++)c+=A[Math.floor(Math.random()*A.length)];return c;}
function netErr(err){
  const t=err&&err.type;
  return t==='peer-unavailable'?'Aucune partie trouvée avec ce code (vérifiez-le, et que l\'appareil de l\'hôte est bien ouvert).'
    :t==='network'||t==='server-error'||t==='socket-error'||t==='socket-closed'?'Service de connexion injoignable. Vérifiez votre connexion Internet et réessayez.'
    :t==='browser-incompatible'?'Ce navigateur ne permet pas le jeu en ligne.'
    :'Erreur de connexion'+(t?` (${t})`:'')+'.';
}
function netSaved(){try{const x=JSON.parse(localStorage.getItem('rojjjo-online-host')||'null');return x&&x.G?x:null;}catch(e){return null;}}
function netSave(){try{localStorage.setItem('rojjjo-online-host',JSON.stringify({code:NET.code,G,HIST}));}catch(e){}}
function netForget(){try{localStorage.removeItem('rojjjo-online-host');}catch(e){}}
function netLeave(){
  try{if(NET.conn&&NET.conn.open)NET.conn.send({t:'bye'});}catch(e){}
  try{if(NET.peer)NET.peer.destroy();}catch(e){}
  if(NET.role==='host') netForget();
  Object.assign(NET,{role:null,peer:null,conn:null,code:'',status:'',err:'',lost:false,myDeck:null});
  MY_SEAT=null; if(G&&G.online){G=null;UNDO=[];}
}
function netHost(saved){
  if(typeof Peer==='undefined'){NET.err='Bibliothèque de connexion non chargée : il faut être connecté à Internet.';render();return;}
  try{if(NET.peer)NET.peer.destroy();}catch(e){}
  Object.assign(NET,{role:'host',conn:null,err:'',lost:false,code:saved?saved.code:newCode(),status:'Ouverture de la partie…'});
  if(saved){G=saved.G;HIST.splice(0,HIST.length,...(saved.HIST||[]));UNDO=[];MY_SEAT=0;UI.tab='combat';}
  const peer=new Peer(PEER_PREFIX+NET.code,peerOptions()); NET.peer=peer;
  peer.on('open',()=>{NET.status='En attente de votre adversaire…';render();});
  peer.on('error',err=>{
    if(err.type==='unavailable-id'&&!saved){netHost();return;}
    NET.err=err.type==='unavailable-id'?'Ce code est encore occupé : réessayez dans une minute.':netErr(err);render();
  });
  peer.on('disconnected',()=>{try{peer.reconnect();}catch(e){}});
  peer.on('connection',conn=>{
    conn.on('data',msg=>hostOnData(conn,msg));
    conn.on('close',()=>{if(NET.conn===conn){NET.conn=null;if(G)log('Adversaire déconnecté.','sys');render();}});
  });
  render();
}
function hostOnData(conn,msg){
  if(!msg||typeof msg!=='object') return;
  if(msg.t==='hello'){
    if(NET.conn&&NET.conn!==conn&&NET.conn.open){
      // même joueur qui revient (ancienne connexion pas encore détectée comme coupée) : on bascule ; sinon partie complète
      if(G&&String(msg.name||'')===G.names[1]){try{NET.conn.close();}catch(e){}}
      else {conn.send({t:'full'});setTimeout(()=>conn.close(),500);return;}
    }
    NET.conn=conn; NET.lastSeen=Date.now();
    if(!G){
      MY_SEAT=0; UI.tab='combat';
      const deck=DECK_ORDER.includes(msg.deck)?msg.deck:'poing';
      const name=String(msg.name||'Invité').slice(0,24);
      newMatch({decks:[NET.myDeck||UI.pick[0],deck],names:[UI.names[0],name],mode:UI.mode,variant:'std',hideHands:false,online:true});
      log(`${name} a rejoint la partie.`,'sys');
    } else log(`${G.names[1]} est de retour.`,'sys');
    render(); return;
  }
  if(conn!==NET.conn) return;
  NET.lastSeen=Date.now();
  if(msg.t==='ping') return;
  if(msg.t==='act'&&GAME_ACTIONS.has(msg.a)&&Array.isArray(msg.args)) hostExec(1,msg.a,msg.args.map(String));
  if(msg.t==='bye'){NET.conn=null;if(G)log(`${G.names[1]} a quitté la partie.`,'sys');render();}
}
function hostAllowed(seat,a,args){
  if(!G) return false;
  if(a==='nextround'||a==='rematch') return isOver();
  if(G.phase==='setup'){
    if(a==='ssel') return seatOfHand(+args[0])===seat;
    if(a==='setupok') return !PL(seat).champion;
    return false;
  }
  if(G.phase!=='actions') return false;
  if(a==='undo') return undoAllowed(seat);
  return actingPlayer()===seat;
}
function hostExec(seat,a,args){
  if(!hostAllowed(seat,a,args)||!H[a]) return;
  ACT_SEAT=seat;
  try{ H[a](...(args.length?args:[undefined])); } finally { ACT_SEAT=null; }
  render();
}
function viewFor(seat){
  const v=JSON.parse(JSON.stringify(G));
  v.players.forEach((P,i)=>{
    if(i===seat){P.deck=[...P.deck].sort();return;}
    P.deck=P.deck.map(()=>null);
    P.hand=P.hand.map(h=>({uid:h.uid,id:null}));
    if(!v.revealed){if(P.champion)P.champion.id=null;P.bench.forEach(b=>b.id=null);}
    v.setupSel[i]=[];
  });
  v.undoOk=undoAllowed(seat);
  return v;
}
// PeerJS refuse les messages JSON de plus de ~16 Ko : l'état est envoyé en morceaux de 4000 caractères
const CHUNK=4000; let SEND_SEQ=0;
function netSend(conn,obj){
  const str=JSON.stringify(obj), id=++SEND_SEQ, n=Math.max(1,Math.ceil(str.length/CHUNK));
  for(let i=0;i<n;i++) conn.send({t:'part',id,i,n,d:str.slice(i*CHUNK,(i+1)*CHUNK)});
}
const PARTS={id:0,got:[],count:0};
function netReceivePart(msg){
  if(msg.id<PARTS.id) return null;
  if(msg.id!==PARTS.id){PARTS.id=msg.id;PARTS.got=new Array(msg.n);PARTS.count=0;}
  if(PARTS.got[msg.i]==null){PARTS.got[msg.i]=msg.d;PARTS.count++;}
  if(PARTS.count<msg.n) return null;
  try{return JSON.parse(PARTS.got.join(''));}catch(e){return null;}
}
function netBroadcast(){
  netSave();
  if(NET.conn&&NET.conn.open){try{const v=viewFor(1);v.log=v.log.slice(-250);netSend(NET.conn,{t:'state',G:v,HIST,code:NET.code});}catch(e){}}
}
function netJoin(code){
  if(typeof Peer==='undefined'){NET.err='Bibliothèque de connexion non chargée : il faut être connecté à Internet.';render();return;}
  try{if(NET.peer)NET.peer.destroy();}catch(e){}
  Object.assign(NET,{role:'guest',code,conn:null,err:'',lost:false,status:'Connexion à la partie '+code+'…'});
  const peer=new Peer(undefined,peerOptions()); NET.peer=peer;
  peer.on('error',err=>{NET.err=netErr(err);if(!G){NET.role=null;}else NET.lost=true;render();});
  peer.on('open',()=>{
    const conn=peer.connect(PEER_PREFIX+code,{reliable:true,serialization:'json'}); NET.conn=conn;
    conn.on('open',()=>{NET.lost=false;NET.lastSeen=Date.now();NET.status='Connecté, en attente de l\'hôte…';if(!NET.myDeck)NET.myDeck=resolveDeck(0);conn.send({t:'hello',name:UI.names[0],deck:NET.myDeck});render();});
    conn.on('data',raw=>{
      if(!raw||typeof raw!=='object') return;
      NET.lastSeen=Date.now(); if(NET.lost){NET.lost=false;render();}
      const msg=raw.t==='part'?netReceivePart(raw):raw; if(!msg) return;
      if(msg.t==='full'){netLeave();NET.err='Cette partie a déjà deux joueurs.';render();return;}
      if(msg.t==='bye'){netLeave();NET.err='L\'hôte a quitté la partie.';render();return;}
      if(msg.t==='state'){G=msg.G;HIST.splice(0,HIST.length,...(msg.HIST||[]));MY_SEAT=1;UNDO=[];NET.err='';if(UI.tab==='combat'||!G)UI.tab='combat';render();}
    });
    conn.on('close',()=>{if(NET.role==='guest'){NET.lost=true;render();}});
  });
  render();
}

// Battement de cœur : détecte un appareil qui a disparu sans prévenir (écran verrouillé, réseau coupé)
setInterval(()=>{
  if(!NET.role||!NET.conn) return;
  if(NET.conn.open){try{NET.conn.send({t:'ping'});}catch(e){}}
  const silent=Date.now()-(NET.lastSeen||0)>10000;
  if(NET.role==='host'&&silent&&G){try{NET.conn.close();}catch(e){}NET.conn=null;log('Adversaire déconnecté.','sys');render();}
  if(NET.role==='guest'&&silent&&G&&!NET.lost){NET.lost=true;render();}
},3000);

render();
</script>
