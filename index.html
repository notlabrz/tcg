const RULES_HTML=`
<p class="muted">Règles et decks v1.16 · Duel des champions · 25 octobre 2026</p>
<h3>1. But du jeu</h3>
<p><b>Le premier joueur qui récupère 6 étoiles gagne la partie.</b> L'arène est la zone de jeu : l'espace du champion et le banc de chaque joueur. Chaque joueur a <b>un champion</b> qui se bat et jusqu'à <b>deux remplaçants</b> sur le banc. Chaque fois que vous vainquez un combattant adverse, vous récupérez son nombre d'étoiles.</p>
<p>Vous perdez aussi si vous n'avez plus de combattant disponible (champion vaincu et banc vide), ou si vous devez piocher alors que votre deck est vide.</p>
<h3>2. Les cartes</h3>
<p>Trois sortes de cartes : les <b>combattants</b>, les <b>atouts</b> et les <b>objets</b>.</p>
<p>Un combattant a un <b>type</b> (Eau, Feu, Plante, Roche, Électrique ou Neutre), un <b>nombre d'étoiles</b> (✯, ✯✯ ou ✯✯✯), une <b>ATK</b>, une <b>DEF</b> (qui sert aussi de points de vie : les dégâts sont retirés de la DEF restante), une <b>faiblesse</b>, une <b>attaque spéciale</b> avec son coût en étoiles, et parfois une <b>capacité</b>.</p>
<table><tr><th>Étoiles</th><th>Coût de pose</th><th>Étoiles données</th></tr><tr><td>✯</td><td>1 étoile</td><td>1</td></tr><tr><td>✯✯</td><td>2 étoiles</td><td>2</td></tr><tr><td>✯✯✯</td><td>3 étoiles</td><td>3</td></tr></table>
<p>Les ✯✯ et ✯✯✯ d'une <b>lignée d'évolution</b> ne se posent pas directement : ils arrivent par évolution (section 8).</p>
<p>Un <b>atout</b> produit un effet immédiat, puis il est défaussé. Un <b>objet</b> se fixe à l'un de vos combattants (champion ou banc), un seul par combattant, et il est défaussé avec lui. Un deck contient <b>30 cartes</b>, 3 exemplaires maximum d'une même carte.</p>
<h3>3. Préparer une partie</h3>
<ol><li>Mélangez votre deck et piochez <b>6 cartes</b>.</li>
<li><b>Main noire</b> : sans combattant ✯ en main, remettez la main dans le deck, mélangez et repiochez 6 cartes, autant de fois que nécessaire. À chaque main noire, votre adversaire pioche 1 carte de plus.</li>
<li>Posez face cachée <b>1 combattant ✯</b> de votre main, sans payer d'étoile : c'est votre champion. Le banc commence vide. Les deux joueurs révèlent leur champion en même temps.</li>
<li>Pile ou face pour désigner le premier joueur. Les compteurs d'étoiles démarrent à 0.</li></ol>
<h3>4. Le tour de jeu</h3>
<ol><li><b>Début de tour</b> : piochez 1 carte (deck vide : vous perdez), puis les soins (Soigneuse), puis les dégâts (Brasier). Un combattant vaincu ainsi est remplacé avant vos actions.</li>
<li><b>Actions</b> : 3 étoiles à dépenser, dans l'ordre que vous voulez.</li>
<li><b>Attaque</b> : votre champion peut attaquer avec son <b>attaque de base</b> (gratuite) ou son <b>attaque spéciale</b> (section 5). L'attaque termine votre tour. Vous pouvez ne pas attaquer.</li>
<li><b>Fin de tour</b> : les effets « jusqu'à la fin du tour » s'arrêtent.</li></ol>
<table><tr><th>Action</th><th>Coût</th></tr>
<tr><td>Poser un combattant de la main sur le banc</td><td>1 (✯), 2 (✯✯) ou 3 (✯✯✯)</td></tr>
<tr><td>Jouer un atout ou poser un objet</td><td>1</td></tr>
<tr><td>Échanger le champion avec un combattant du banc du même type, ou si l'un des deux est Neutre</td><td>1</td></tr>
<tr><td>Échanger le champion avec un combattant du banc d'un autre type (aucun des deux Neutre)</td><td>2</td></tr>
<tr><td>Faire évoluer un combattant en jeu</td><td>1</td></tr></table>
<ul><li>L'attaque de base est gratuite : vous pouvez dépenser vos 3 étoiles puis attaquer. L'attaque spéciale se paie avec les étoiles qui vous restent au moment d'attaquer : gardez-en assez.</li>
<li>Les étoiles non utilisées sont perdues. Vous pouvez jouer plusieurs atouts dans le même tour.</li>
<li>Le banc a 2 places. Les combattants se posent toujours sur le banc ; le champion change par échange ou après une défaite.</li>
<li>Le premier joueur n'attaque pas lors de son premier tour.</li></ul>
<h3>5. Le combat</h3>
<p>Votre champion attaque le champion adverse, avec <b>l'attaque de base</b> (gratuite : il inflige son ATK) ou <b>son attaque spéciale</b> (coût de 0, 1 ou 2 étoiles, écrit sur la carte). Les deux terminent le tour, et on n'attaque qu'une fois par tour.</p>
<p>Dégâts = <b>ATK</b> + bonus d'ATK (Épée, Élan) + bonus de l'attaque spéciale, <b>+1</b> si le type de votre champion est la faiblesse de la cible, moins les réductions de dégâts de la cible (le coup peut tomber à 0). Les dégâts sont retirés de la DEF restante et <b>restent d'un tour à l'autre</b>.</p>
<p><b>Ordre</b> : on résout d'abord le coup sur la cible (combattant vaincu, étoiles, Embrasement), puis l'effet de l'attaque spéciale (recul, soin, pioche, échange…), puis la fin de la résolution (section 6).</p>
<h3>6. Combattant vaincu, remplacement et fin de partie</h3>
<p>Un combattant dont la DEF restante tombe à 0 ou moins est vaincu : il est défaussé avec son objet, puis l'adversaire récupère ses étoiles (1, 2 ou 3).</p>
<p>Quand l'attaque ou l'atout est entièrement résolu, on vérifie :</p>
<ol><li><b>Victoire</b> : un joueur à 6 étoiles ou plus gagne. Si les deux y arrivent, celui qui en a le plus gagne ; en cas d'égalité, le défenseur gagne.</li>
<li><b>Remplacement</b> : le joueur dont le champion est vaincu choisit un combattant de son banc, qui devient champion gratuitement.</li>
<li><b>Défaite</b> : sans combattant sur son banc, ce joueur perd. Si les deux perdent en même temps, le défenseur gagne.</li></ol>
<p>Si votre champion est vaincu par un atout, le remplacement a lieu après la résolution de l'atout.</p>
<h3>7. Atouts et objets des decks</h3>
<p>Chaque atout ou objet coûte le nombre d'étoiles indiqué sur sa carte (1 pour tous ceux des decks découverte).</p>
<table><tr><th>Carte</th><th>Effet</th></tr>
<tr><td><b>Frappe</b> ×2</td><td>3 dégâts directs à un combattant adverse (champion ou banc).</td></tr>
<tr><td><b>Soin</b> ×2</td><td>Un de vos combattants (champion ou banc) récupère 4 DEF, sans dépasser sa DEF maximale.</td></tr>
<tr><td><b>Élan</b></td><td>+2 ATK à votre champion jusqu'à la fin du tour.</td></tr>
<tr><td><b>Échange forcé</b></td><td>Vous choisissez le combattant du banc adverse qui devient son champion ; l'ancien champion va au banc.</td></tr>
<tr><td><b>Pioche</b></td><td>Piochez 2 cartes.</td></tr>
<tr><td><b>Renfort</b></td><td>Cherchez un ✯ dans votre deck et posez-le sur votre banc (place libre nécessaire), puis mélangez. Il compte comme posé depuis la main. Jouable même sans ✯ dans le deck : vous mélangez simplement.</td></tr>
<tr><td><b>Plastron</b></td><td>+2 DEF tant que le combattant est en jeu (DEF de départ et DEF restante).</td></tr>
<tr><td><b>Épée</b></td><td>+1 ATK tant que le combattant est en jeu.</td></tr></table>
<p>Frappe et Échange forcé ne se jouent que s'il existe une cible valide.</p>
<h3>8. L'évolution</h3>
<p>Une lignée va d'un ✯ à un ✯✯, puis éventuellement à un ✯✯✯. Les ✯✯ et ✯✯✯ d'une lignée ne se posent jamais depuis la main ; un combattant hors lignée se pose normalement.</p>
<ol><li>Évoluer coûte <b>1 étoile</b>, une étape à la fois.</li>
<li>Jouez la carte suivante de la lignée sur un de vos combattants en jeu de la même lignée (champion ou banc). L'ancienne carte est défaussée sans donner d'étoile. L'Élémentaire naissant (Neutre) peut évoluer vers n'importe quel ✯✯ qui indique évoluer depuis lui.</li>
<li>Le combattant garde sa place, son objet et ses dégâts.</li>
<li>Il ne peut évoluer que s'il était <b>déjà en jeu au début de votre tour</b> (pas d'évolution le tour de la pose, ni deux fois par tour).</li>
<li>La carte jouée compte comme posée depuis la main et utilise sa propre capacité, sa propre attaque spéciale et sa propre faiblesse.</li>
<li>Vaincue plus tard, elle rapporte les étoiles de sa nouvelle carte.</li></ol>
<p>Le champion posé lors de la préparation ne peut pas évoluer pendant le premier tour de son propriétaire.</p>
<h3>9. Types et faiblesses</h3>
<p>Les cinq types forment un cercle : <b>Eau &gt; Feu &gt; Plante &gt; Roche &gt; Électrique &gt; Eau</b>. Chaque combattant typé est faible face au type qui bat le sien : quand il est attaqué par ce type, le coup inflige 1 dégât de plus (attaque de base comme attaque spéciale).</p>
<table><tr><th>Type</th><th>Bat</th><th>Est battu par</th></tr>
<tr><td>Eau</td><td>Feu</td><td>Électrique</td></tr><tr><td>Feu</td><td>Plante</td><td>Eau</td></tr><tr><td>Plante</td><td>Roche</td><td>Feu</td></tr><tr><td>Roche</td><td>Électrique</td><td>Plante</td></tr><tr><td>Électrique</td><td>Eau</td><td>Roche</td></tr></table>
<p><b>Le type Neutre</b> est hors du cercle : un combattant Neutre n'a pas de faiblesse, il ne bénéficie jamais du +1 quand il attaque, et l'échange entre le champion et un combattant du banc coûte 1 étoile dès que l'un des deux est Neutre.</p>
<p>Entre types éloignés dans le cercle, et entre Vague (Eau) et Sève (Plante), aucune faiblesse ne joue.</p>
<h3>10. Capacités</h3>
<table><tr><th>Capacité</th><th>Effet</th></tr>
<tr><td><b>Éclaireur</b></td><td>Quand vous posez ce combattant, piochez 1 carte.</td></tr>
<tr><td><b>Soigneuse</b></td><td>Tant qu'il est sur votre banc, votre champion récupère 1 DEF au début de votre tour (cumulable, sans dépasser la DEF maximale, avant les dégâts de Brasier).</td></tr>
<tr><td><b>Éruption X</b> · <b>Éclair X</b> · <b>Racines X</b></td><td>Quand vous posez ce combattant, il inflige X dégâts directs à un combattant adverse de votre choix (champion ou banc).</td></tr>
<tr><td><b>Embrasement X</b></td><td>Quand ce combattant est vaincu, il inflige X dégâts directs au champion du joueur qui l'a vaincu (après le décompte des étoiles ; peut s'enchaîner).</td></tr>
<tr><td><b>Armure X</b></td><td>Ce combattant subit X dégâts de moins par coup (le coup peut tomber à 0).</td></tr>
<tr><td><b>Survolté</b></td><td>Ce combattant peut évoluer pendant le tour où il a été posé (toujours une seule évolution par tour ; le champion de départ n'évolue pas au premier tour).</td></tr>
<tr><td><b>Épines X</b></td><td>Quand ce combattant est champion et survit à des dégâts infligés par l'adversaire (coup d'au moins 1 dégât, ou dégâts directs), il inflige X dégâts directs au champion adverse. Les dégâts d'Épines ne déclenchent pas d'Épines.</td></tr>
<tr><td><b>Régénération</b></td><td>Quand ce combattant arrive par évolution, il efface tous ses dégâts.</td></tr>
<tr><td><b>Frénésie X</b></td><td>Quand ce combattant vainc le champion adverse en l'attaquant, il récupère X DEF.</td></tr></table>
<ul><li>« Quand vous posez » : pose depuis la main, évolution ou Renfort, jamais après un échange ou un remplacement.</li>
<li><b>Dégâts directs</b> (Frappe, Éruption, Éclair, Racines, Embrasement, Brasier, Spores, Souffle, Absorption, Épines, recul d'Assaut) : ni la faiblesse ni les réductions (Armure, Garde) ne s'appliquent.</li>
<li><b>Armure et Garde</b> se cumulent, mais ne réduisent que les coups, jamais les dégâts directs.</li>
<li><b>Épines</b> se résolvent juste après les dégâts qui les déclenchent (après le coup, avant l'effet de l'attaque spéciale ; ou après un Brasier, une Éruption, une Frappe…). <b>Frénésie</b> se résout aussi avant l'effet de l'attaque spéciale.</li>
<li>Noms propres : <b>Spores</b> = Brasier (Plante) ; <b>Éclair</b> = Éruption (Électrique) ; <b>Racines</b> = Éruption (Plante).</li></ul>
<h3>11. Attaques spéciales</h3>
<table><tr><th>Mot-clé</th><th>Coût</th><th>Effet</th></tr>
<tr><td><b>Charge X</b></td><td>X</td><td>Le coup inflige X dégâts de plus.</td></tr>
<tr><td><b>Assaut X</b></td><td>0</td><td>Le coup inflige X dégâts de plus, puis votre champion subit X dégâts directs (recul). S'il tombe à 0 DEF, il est vaincu.</td></tr>
<tr><td><b>Pari X</b></td><td>0</td><td>Pièce : face, le coup inflige X dégâts de plus ; pile, l'attaque rate (elle compte quand même et termine le tour).</td></tr>
<tr><td><b>Acharnement X</b></td><td>1</td><td>Si la cible avait déjà subi des dégâts avant ce coup, le coup inflige X dégâts de plus.</td></tr>
<tr><td><b>Brasier X</b> · <b>Spores X</b></td><td>1</td><td>Si le coup inflige au moins 1 dégât, la cible subit X dégâts directs au début du prochain tour de son propriétaire, après les soins (un seul à la fois par cible, le plus fort).</td></tr>
<tr><td><b>Absorption X</b></td><td>1</td><td>Après le coup, si la cible survit, elle subit X dégâts directs et votre champion récupère X DEF.</td></tr>
<tr><td><b>Étourdissement</b></td><td>2</td><td>Le coup inflige 1 dégât de moins. Si la cible survit, elle ne peut pas attaquer pendant le prochain tour de son propriétaire (un échange permet d'attaquer avec un autre combattant).</td></tr>
<tr><td><b>Souffle X</b></td><td>1</td><td>Après le coup, X dégâts directs à un combattant du banc adverse de votre choix.</td></tr>
<tr><td><b>Recherche</b></td><td>1</td><td>Le coup inflige 1 dégât de moins (minimum 0), puis piochez 1 carte.</td></tr>
<tr><td><b>Vague X</b></td><td>1</td><td>Après le coup, votre champion récupère X DEF (sans dépasser sa DEF maximale).</td></tr>
<tr><td><b>Garde X</b></td><td>1</td><td>Après le coup, jusqu'au début de votre prochain tour, ce combattant subit X dégâts de moins par coup tant qu'il est champion (la Garde reste sur lui s'il va au banc).</td></tr>
<tr><td><b>Repli</b></td><td>1</td><td>Après le coup, échangez votre champion avec un combattant de votre banc, sans payer l'échange (impossible si votre champion est retenu par une Étreinte).</td></tr>
<tr><td><b>Étreinte</b></td><td>0</td><td>Le coup inflige 1 dégât de moins (minimum 0). Si la cible survit, son propriétaire ne peut pas l'échanger pendant son prochain tour (Échange forcé reste possible).</td></tr>
<tr><td><b>Tourbillon</b></td><td>1</td><td>Si la cible survit, choisissez un combattant du banc adverse : il devient champion, l'ancien champion va au banc.</td></tr></table>
<p><b>Ordre</b> : le coup sur la cible (vaincu, étoiles, Embrasement), puis Épines ou Frénésie, puis l'effet de l'attaque spéciale, puis la fin de la résolution.</p>
<h3>12. Précisions</h3>
<ul><li>Il n'y a pas de limite de cartes en main.</li>
<li>Seule votre main reste cachée : champion, banc, objets, étoiles, DEF restantes et défausse sont visibles par les deux joueurs.</li>
<li>Les objets restent attachés au combattant quand il change de place.</li>
<li>Embrasement se résout après le décompte des étoiles ; la victoire est vérifiée une fois toute la résolution terminée.</li></ul>`;
function renderDetail(id){

    row('Type',TYPES[c.type].name);
    row('Faiblesse',c.weak?TYPES[c.weak].name:'Aucune');
    if(c.ab) row(`Capacité · ${abLabel(c)}`,esc(ABIL[c.ab].text(c.abX)));
    if(c.spe) row(`Attaque spéciale · ${speLabel(c)} (${speCostTxt(speCost(id))})`,esc(SPE[c.spe.kw].text(c.spe.x)));
    if(c.line){
      const ids=[]; for(let x=c;x;x=x.from?C(x.from):null) ids.unshift(x.id);

}

/* ---- Combat : table ---- */
function actingPlayer(){return G.pending.length?G.pending[0].p:G.cur;}
function mine_(p){return !G.online||p===MY_SEAT;}
function undoAllowed(seat){
  if(!UNDO.length) return false;
  if(!G.online) return true;
  try{const prev=JSON.parse(UNDO[UNDO.length-1]);
    return G.phase==='actions'&&prev.phase==='actions'&&prev.cur===seat&&G.cur===seat&&prev.turn===G.turn&&actingPlayer()===seat;}catch(e){return false;}
}
function renderCombat(){
  if(!G) return renderSetup();
  const ho=G.handoff?`<div class="handoff"><div><p class="muted">Passez l'écran à</p><h2>${esc(G.names[G.cur])}</h2><button class="primary" data-a="ready">Je suis prêt</button></div></div>`:'';
  const hp=handOwner(), me=G.online?MY_SEAT:hp, op=1-me, m=midParts();

  const over=m.over?`<div class="bover"><div class="boverin">${m.main}<div class="abtns">${m.btns}</div></div></div>`:'';
  return `${netBanner()}<div class="match2"><div class="tinfo tr">${m.info}</div>${oppHand(op)}<div class="board">
    <div class="ring r1"></div><div class="ring r2"></div>
    <div class="brow bench"><div class="bside">${pileDisc(op)}</div>${benchPair(op)}<div class="bside"></div></div>
    <div class="brow champ"><div class="bside">${pileDeck(op)}</div>${champZone(op)}<div class="bside sinfo">${m.over?'':btnz}${mBar(op)}</div></div>
    <div class="brow champ"><div class="bside sact">${m.over?mBar(me):mBar(me)+msg}</div>${champZone(me)}<div class="bside end">${pileDeck(me)}</div></div>
    <div class="brow bench"><div class="bside gearz">${gearHTML()}</div>${benchPair(me)}<div class="bside end">${pileDisc(me)}</div></div>
    ${over}</div>${mHand(hp)}</div>${ho}`;
}
// Main affichée en bas : la sienne en ligne ; sur un seul écran, celle du joueur qui agit
function handOwner(){
  if(G.online) return MY_SEAT;
  if(G.phase==='setup') return G.cur;
  if(isOver()) return 0;
  return actingPlayer();
}
function mBar(p){
  const P=PL(p),k=G.decks[p],on=G.cur===p&&!isOver()&&G.phase!=='setup';
  return `<div class="pbar ${on?'on':''}"><span class="nm">${esc(G.names[p])}</span>
    ${p===G.first?'<span class="badge">1er</span>':'<span class="badge dim">2e</span>'}
    ${G.target>1?`<span class="wins" title="Manches gagnées">${'●'.repeat(G.wins[p])}${'○'.repeat(Math.max(0,G.target-G.wins[p]))}</span>`:''}
    <span class="st">✯ ${P.trophies}<small>/${G.win}</small></span></div>${P.piedFerme?`<div class="flags">${P.piedFerme?'<span class="flag">Pied ferme</span>':''}</div>`:''}`;
}
// Le joueur p peut-il agir maintenant sur cet appareil (son tour, phase d'actions, rien en attente) ?
function canPlayNow(p){return !!G&&G.phase==='actions'&&!G.pending.length&&!G.handoff&&p===G.cur&&mine_(p);}
function bslot(p,c,champ){
  const hidden=G.phase==='setup'&&!G.revealed;
  return c?(hidden?'<div class="mcard back"></div>':mBoardCard(p,c,champ)):`<div class="mempty" ${!champ&&canPlayNow(p)?'data-drop="bench"':champ?`data-drop="champ" data-p="${p}"`:''}>${champ?'—':'libre'}</div>`;
}
// Échange possible avec ce combattant du banc (coût, Étreinte)
function swapOk(uid){const P=cp(),b=P.bench.find(x=>x.uid===uid);return !!b&&!!P.champion&&!isHeld(P.champion)&&G.actions>=swapCost(b);}
function benchPair(p){const P=PL(p);return `<div class="pair"><span class="lb">Banc</span><div class="pr">${bslot(p,P.bench[0],false)}${bslot(p,P.bench[1],false)}</div></div>`;}
function champZone(p){const P=PL(p);return `<div class="cz"><span class="lb ch">Champion</span><div class="czc">${bslot(p,P.champion,true)}${P.elan&&P.champion?`<span class="flag czflag">Élan +${CONFIG.elan} ATK</span>`:''}</div></div>`;}
function pileDeck(p){return `<div class="pile deck"><div>Deck<br>(${PL(p).deck.length})</div></div>`;}
function pileDisc(p){const D=PL(p).discard,top=D.length?C(D[D.length-1]):null;
  return `<div class="pile disc ${top?'full':''}" data-a="mmodal:disc${p}" ${top?`style="--tc:${cardColor(top)}"`:''}>${top?`<b>${esc(top.name)}</b>`:''}<div>Cimetière<br>(${D.length})</div></div>`;}
function oppHand(p){const n=PL(p).hand.length;
  return `<div class="ohand"><div class="obacks">${Array.from({length:n},()=>'<i></i>').join('')}</div><div class="mhandlbl">${G.online?'Main de '+esc(G.names[p]):'Main de '+esc(G.names[p])} · ${n} carte${s_(n)}</div></div>`;}
function mField(p){
  const P=PL(p), hidden=G.phase==='setup'&&!G.revealed;
  const slot=(c,champ,lb)=>`<div class="mslot ${champ?'champ':''}"><span class="lb">${lb}</span>${c?(hidden?'<div class="mcard back"></div>':mBoardCard(p,c,champ)):`<div class="mempty">${champ?'—':'libre'}</div>`}</div>`;
  return `<div class="mfield">${slot(P.champion,true,'Champion')}${slot(P.bench[0],false,'Banc')}${slot(P.bench[1],false,'Banc')}</div>`;
}
function boardTags(c){
  let tags='';
  if(c.item) tags+=`<span>${c.item==='epee'?'🗡 Épée':'🛡 Plastron'}</span>`;
  if(c.burn) tags+=`<span style="color:#ffb199">🔥${c.burn}</span>`;
  if(c.garde) tags+=`<span style="color:#9cc8ff">Garde −${c.garde}</span>`;
  if(isHeld(c)) tags+='<span style="color:#9cc8ff">Étreint</span>';
  if(isStunned(c)) tags+='<span style="color:#ffd27a">Étourdi</span>';
  if(c.placedTurn===G.turn&&G.phase==='actions'&&!c.start) tags+='<span>Nouveau</span>';
  return tags;
}
function mBoardCard(p,c,isChamp){
  const card=C(c.id),P=PL(p),atk=baseAtk(c)+(isChamp&&P.elan?CONFIG.elan:0);
  const tags=boardTags(c);
  const pd=G.pending[0], target=pd&&pd.options&&pd.options.includes(c.uid)&&mine_(pd.p);
  const act=target?`pk:${c.uid}`:`sheet:${c.uid}`;
  const rep=pd&&pd.kind==='replace'&&pd.p===p&&mine_(p);
  const drag=isChamp?(canPlayNow(p)&&(canAttack('base')||swapTargets().length)?`data-drag="c:${c.uid}"`:'')
    :rep?`data-drag="r:${c.uid}"`:canPlayNow(p)&&swapOk(c.uid)?`data-drag="b:${c.uid}"`:'';
  return `<div class="mcard ${target?'target':''}" style="--tc:${cardColor(card)}" data-a="${act}" data-card="${c.id}" data-uid="${c.uid}" ${drag}>
    <div class="mtop"><span>${TYPES[card.type].name}</span><b>${STARS[card.size]}</b></div>
    <div class="mnm">${esc(card.name)}</div>
    ${card.ab?`<div class="mab">✦ ${abLabel(card)}</div>`:''}
    <div class="msp">⚔ ${speLabel(card)} (${speCost(card.id)}${ASTAR})</div>
    ${tags?`<div class="mtags">${tags}</div>`:''}
    <div class="mst"><span class="atk ${atk>card.atk?'up':''}">⚔${atk}</span><span class="def ${c.dmg?'hurt':(maxDef(c)>card.def?'up':'')}">🛡${curDef(c)}<small>/${maxDef(c)}</small></span></div></div>`;
}
function mHandCard(p,h){
  const card=C(h.id),P=PL(p),pd=G.pending[0];
  let cls='',act=`sheet:${h.uid}`,badge='',setupDrag=false;
  if(G.phase==='setup'&&!P.champion&&(G.online?p===MY_SEAT:(p===G.cur&&!G.handoff))){
    if(card.cat==='creature'&&card.size==='P'){cls='target';setupDrag=true;}
    else cls='dim';
  } else if(pd&&pd.kind==='discard'&&pd.p===p){cls='target'+(pd.chosen.includes(h.uid)?' sel':'');act=`pk:${h.uid}`;}
  else if(p===G.cur&&G.phase==='actions'&&!pd&&!handActions(h).some(a=>a.ok)) cls='dim';
  const body=card.cat==='creature'
    ?`${card.ab?`<div class="mab">✦ ${abLabel(card)}</div>`:''}<div class="msp">⚔ ${speLabel(card)} (${speCost(card.id)}${ASTAR})</div>${badge}<div class="mst"><span class="atk">⚔${card.atk}</span><span class="def">🛡${card.def}</span></div>`
    :`<div class="mtxt">${esc(card.text)}</div>`;

function atkButtons(){

  return h+'</dl>';

    if(ACT_SEAT!=null?seat!==ACT_SEAT:(!G.online&&(seat!==G.cur||G.handoff)))return;

  },
  rf(id){const pd=G.pending[0];if(!pd||pd.kind!=='deckpick')return;if(id==='none')id=null;else if(!pd.cards.includes(id))return;act(()=>{G.pending.shift();doRenfort(pd.handUid,id);});},

function execTarget(pd,uid){
  const w=pd.what;
  if(w==='souffle'||w==='repli'||w==='tourbillon'){
    if(w==='souffle') souffleApply(pd.p,uid,pd.x); else if(w==='repli') repliApply(pd.p,uid); else swap(1-pd.p,uid,'✦ Tourbillon');
    return aftermath();
  }
  if(w==='eruption') return eruption(pd.p,pd.src,uid);
  if(w==='evolve') return doEvolve(pd.handUid,uid);
  if(w==='item') return doItem(pd.handUid,uid);
  return doSpell(pd.handUid,uid);
}
const GAME_ACTIONS=new Set(['ssel','setupok','setdrop','play','drop','pk','rf','swap','swapsel','attack','endturn','cancel','undo','nextround','rematch']);
function dispatch(a,args,e,el){
  if(a==='play'||a==='swap'||a==='swapsel'||a==='setdrop'||a==='attack'||a==='endturn'||a==='drop') UI.sheet=null;
  if(G&&G.online&&GAME_ACTIONS.has(a)){
    if(NET.role==='guest'){ if(NET.conn&&NET.conn.open) NET.conn.send({t:'act',a,args}); return; }
    if(NET.role==='host'){ hostExec(0,a,args); return; }
  }
  if(H[a]) H[a](...(args.length?args:[undefined]),e,el);
}

  const el=e.target.closest('[data-a]'); if(!el||el.disabled) return;
  const [a,...args]=el.dataset.a.split(':');
  dispatch(a,args.map(String),e,el);
},true);
/* ---- Glisser-déposer en match ----
   Main : glisser une carte vers le haut puis la lâcher sur sa cible (banc libre, combattant, ou plateau pour Élan, Pioche, Renfort).
   Banc : glisser un combattant sur son champion pour l'échanger. Le lâcher valide directement ; un simple toucher ouvre toujours le détail. */
const DRAG={src:null,on:false,ghost:null,zones:[],over:null,x0:0,y0:0,id:null,suppress:false};
function dragZones(kind,uid){
  const out=[], byUid=u=>document.querySelector(`.board [data-uid="${u}"]`);
  if(kind==='b'){const ch=cp().champion,el=ch&&byUid(ch.uid);if(el)out.push({el,a:'swap',args:[String(uid)]});return out;}
  // champion sur le champion adverse : attaque de base
  if(kind==='c'){const oc=op().champion,el=oc&&byUid(oc.uid);if(el&&canAttack('base'))out.push({el,a:'attack',args:['base']});
    swapTargets().forEach(u=>{const b=byUid(u);if(b)out.push({el:b,a:'swap',args:[String(u)]});});return out;}
  // préparation : un ✯ de la main sur sa place de champion
  if(kind==='s'){const seat=seatOfHand(uid),el=document.querySelector(`.board [data-drop="champ"][data-p="${seat}"]`);if(el)out.push({el,a:'setdrop',args:[String(uid)]});return out;}
  // champion vaincu : un combattant du banc sur la place vide du champion
  if(kind==='r'){const p=ownerOf(uid),el=document.querySelector(`.board [data-drop="champ"][data-p="${p}"]`);if(el)out.push({el,a:'pk',args:[String(uid)]});return out;}
  const h=cp().hand.find(x=>x.uid===uid); if(!h) return out;
  handActions(h).filter(x=>x.ok).forEach(x=>{
    if(x.key==='pose') document.querySelectorAll('.board [data-drop="bench"]').forEach(el=>out.push({el,a:'drop',args:[String(uid),'pose','0']}));
    else if(!x.targets||x.targets==='deck'){const el=document.querySelector('.board');if(el)out.push({el,a:'drop',args:[String(uid),x.key,'0'],board:true});}
    else x.targets.forEach(t=>{const el=byUid(t);if(el)out.push({el,a:'drop',args:[String(uid),x.key,String(t)]});});
  });
  return out;
}
function dragEnd(){
  if(DRAG.ghost) DRAG.ghost.remove();
  DRAG.zones.forEach(z=>z.el.classList.remove('dz-ok','dz-over','dz-board'));
  if(DRAG.src) DRAG.src.classList.remove('dragging');
  document.body.classList.remove('dragmode');
  const later=DRAG.later;
  Object.assign(DRAG,{src:null,on:false,ghost:null,zones:[],over:null,id:null,later:false});
  if(later) render();
}
function dragHit(x,y){
  const el=document.elementFromPoint(x,y); if(!el) return null;
  const cell=DRAG.zones.find(z=>!z.board&&(z.el===el||z.el.contains(el)));
  return cell||DRAG.zones.find(z=>z.board&&z.el.contains(el))||null;
}
document.addEventListener('pointerdown',e=>{
  DRAG.suppress=false; // le clic qui suit un lâcher est ignoré, pas le toucher suivant
  if(e.button>0) return;
  const el=e.target.closest('[data-drag]'); if(!el||!G) return;
  DRAG.src=el; DRAG.x0=e.clientX; DRAG.y0=e.clientY; DRAG.id=e.pointerId; DRAG.on=false; DRAG.scroll=null;
  cancelAnimationFrame(DRAG.raf||0);
});
// Défilement de la main géré par l'app (le navigateur ne peut plus « voler » le geste et annuler le glisser)
function handScrollEnd(){
  const sc=DRAG.scroll; DRAG.scroll=null; if(!sc) return;
  let v=sc.v; const el=sc.el;
  const step=()=>{ if(Math.abs(v)<0.3) return; el.scrollLeft-=v; v*=0.93; DRAG.raf=requestAnimationFrame(step); };
  DRAG.raf=requestAnimationFrame(step);
}
document.addEventListener('pointermove',e=>{
  if(!DRAG.src||e.pointerId!==DRAG.id) return;
  const dx=e.clientX-DRAG.x0, dy=e.clientY-DRAG.y0;
  if(!DRAG.on){
    const [kind,u]=DRAG.src.dataset.drag.split(':'), inHand=kind==='h'||kind==='s';
    // Main : en défilement, la main suit le doigt horizontalement
    if(DRAG.scroll){ e.preventDefault(); const sc=DRAG.scroll; const nx=e.clientX; sc.v=nx-sc.lx; sc.lx=nx; sc.el.scrollLeft=sc.s0-dx; return; }
    // Main : on prend la carte dès que le doigt monte (même en diagonale, jusqu'à ~60° de l'horizontale) ;
    // un geste plutôt horizontal fait défiler la main
    const d=Math.hypot(dx,dy);
    const go=inHand?(d>9&&dy<-6&&-dy>=Math.abs(dx)*0.55):(d>10);
    if(!go){
      if(inHand&&d>9){ const h=DRAG.src.closest('.mhand'); if(h){ DRAG.scroll={el:h,s0:h.scrollLeft,lx:e.clientX,v:0}; try{DRAG.src.setPointerCapture(e.pointerId);}catch(_){} e.preventDefault(); h.scrollLeft=DRAG.scroll.s0-dx; } }
      return;
    }
    DRAG.on=true; hidePop();
    DRAG.zones=dragZones(kind,+u);
    DRAG.zones.forEach(z=>z.el.classList.add(z.board?'dz-board':'dz-ok'));
    const r=DRAG.src.getBoundingClientRect(), g=DRAG.src.cloneNode(true);
    g.className+=' dragghost'; g.removeAttribute('data-drag'); g.removeAttribute('data-a');
    Object.assign(g.style,{width:r.width+'px',height:r.height+'px'});
    document.body.appendChild(g); DRAG.ghost=g; DRAG.src.classList.add('dragging'); document.body.classList.add('dragmode');
    try{DRAG.src.setPointerCapture(e.pointerId);}catch(_){}
  }
  e.preventDefault();
  DRAG.ghost.style.transform=`translate(${e.clientX-DRAG.ghost.offsetWidth/2}px,${e.clientY-DRAG.ghost.offsetHeight*0.8}px) rotate(-3deg)`;
  const hit=dragHit(e.clientX,e.clientY);
  if(hit!==DRAG.over){ if(DRAG.over) DRAG.over.el.classList.remove('dz-over'); DRAG.over=hit; if(hit) hit.el.classList.add('dz-over'); }
},{passive:false});
document.addEventListener('pointerup',e=>{
  if(!DRAG.src||e.pointerId!==DRAG.id) return;
  if(!DRAG.on){ if(DRAG.scroll){DRAG.suppress=true;setTimeout(()=>{DRAG.suppress=false;},350);handScrollEnd();} DRAG.src=null;return;}
  const hit=dragHit(e.clientX,e.clientY);
  DRAG.suppress=true; setTimeout(()=>{DRAG.suppress=false;},350);
  dragEnd();
  if(hit) dispatch(hit.a,hit.args);
});
document.addEventListener('pointercancel',e=>{ if(DRAG.src&&e.pointerId===DRAG.id){ DRAG.scroll=null; dragEnd(); } });
// Zoom désactivé sur toutes les pages : pincement bloqué ici (iOS ignore user-scalable=no) ; le double tap est bloqué par touch-action:manipulation
// Carte qui bouge sous le doigt (ou la souris) avec un reflet de lumière, sur la fiche d'une carte
function tiltMove(el,x,y){
  const r=el.getBoundingClientRect(), px=Math.min(1,Math.max(0,(x-r.left)/r.width)), py=Math.min(1,Math.max(0,(y-r.top)/r.height));
  el.style.setProperty('--ry',((px-.5)*24).toFixed(2)+'deg'); el.style.setProperty('--rx',((.5-py)*24).toFixed(2)+'deg');
  el.style.setProperty('--mx',(px*100).toFixed(1)+'%'); el.style.setProperty('--my',(py*100).toFixed(1)+'%');
  el.style.setProperty('--hx',(px*100).toFixed(1)+'%'); el.style.setProperty('--hy',(py*100).toFixed(1)+'%');
  el.style.setProperty('--sc','1.04'); el.style.setProperty('--so','1'); el.classList.add('live');
}
function tiltReset(el){el.classList.remove('live');['--rx','--ry','--sc','--so'].forEach(k=>el.style.removeProperty(k));}
document.addEventListener('pointermove',e=>{const el=e.target.closest('.card.tilt');if(el)tiltMove(el,e.clientX,e.clientY);});
document.addEventListener('pointerdown',e=>{const el=e.target.closest('.card.tilt');if(el){try{el.setPointerCapture(e.pointerId);}catch(_){}tiltMove(el,e.clientX,e.clientY);}});
['pointerup','pointercancel','pointerleave','pointerout'].forEach(t=>document.addEventListener(t,e=>{const el=e.target.closest&&e.target.closest('.card.tilt');if(el&&(t!=='pointerout'||!el.contains(e.relatedTarget)))tiltReset(el);},true));
document.addEventListener('contextmenu',e=>{if(!e.target.closest('input,textarea'))e.preventDefault();});
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches&&e.touches.length>1)e.preventDefault();},{passive:false});
document.addEventListener('change',e=>{if(e.target.closest('[data-col]')){colUpdate(e);return;}
  const k=e.target.closest('[data-colchk]');
  if(k){const [key,v]=k.dataset.colchk.split(':'),a=UI.col[key],i=a.indexOf(v);if(k.checked&&i<0)a.push(v);if(!k.checked&&i>=0)a.splice(i,1);
    const g=$('#colgrid');if(g)g.innerHTML=colGridHTML();const c=$('#fcount');if(c)c.innerHTML=colCountTxt();return;}const o=e.target.closest('[data-opt]');if(o)UI[o.dataset.opt]=o.checked;});
function colUpdate(e){const el=e.target.closest('[data-col]');if(!el)return false;UI.col[el.dataset.col]=el.value;const g=$('#colgrid');if(g)g.innerHTML=colGridHTML();const c=$('#fcount');if(c)c.innerHTML=colCountTxt();return true;}
document.addEventListener('input',e=>{if(/^nm[01]$/.test(e.target.id||'')){const el=e.target,v=cleanName(el.value);if(v!==el.value){const pos=Math.min(v.length,el.selectionStart||v.length);el.value=v;try{el.setSelectionRange(pos,pos);}catch(_){}}return;}if(colUpdate(e))return;const n=e.target.closest('[data-note]');if(n&&HIST[+n.dataset.note])HIST[+n.dataset.note].notes=n.value;});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&UI.colf){UI.colf=false;render();return;}if(e.key==='Escape'&&(UI.detail||UI.exportText!==null||UI.sheet||UI.mmodal||UI.gmenu)){UI.detail=null;UI.exportText=null;UI.sheet=null;UI.mmodal=null;UI.gmenu=false;render();}});
/* =========================================================
   RÉSEAU (en ligne, 2 appareils) — PeerJS, l'hôte est l'arbitre
   ========================================================= */
const NET={role:null,peer:null,conn:null,code:'',status:'',err:'',lost:false};
const PEER_PREFIX='rojjjo-tcg-';
function peerOptions(){
  // ?peer=hote:port pour utiliser votre propre serveur PeerJS (tests) ; sinon le service gratuit PeerJS
  const q=new URLSearchParams(location.search).get('peer');
  if(!q) return {debug:0};
  const [host,port]=q.split(':'); return {host,port:+port||9000,path:'/',secure:false,debug:0};
}
function newCode(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let c='';for(let i=0;i<4;i++)c+=A[Math.floor(Math.random()*A.length)];return c;}
function netErr(err){
  const t=err&&err.type;
  return t==='peer-unavailable'?'Aucune partie trouvée avec ce code (vérifiez-le, et que l\'appareil de l\'hôte est bien ouvert).'
    :t==='network'||t==='server-error'||t==='socket-error'||t==='socket-closed'?'Service de connexion injoignable. Vérifiez votre connexion Internet et réessayez.'
    :t==='browser-incompatible'?'Ce navigateur ne permet pas le jeu en ligne.'
    :'Erreur de connexion'+(t?` (${t})`:'')+'.';
}
function netSaved(){try{const x=JSON.parse(localStorage.getItem('rojjjo-online-host')||'null');return x&&x.G?x:null;}catch(e){return null;}}
function netSave(){try{localStorage.setItem('rojjjo-online-host',JSON.stringify({code:NET.code,G,HIST}));}catch(e){}}
function netForget(){try{localStorage.removeItem('rojjjo-online-host');}catch(e){}}
function netLeave(){
  try{if(NET.conn&&NET.conn.open)NET.conn.send({t:'bye'});}catch(e){}
  try{if(NET.peer)NET.peer.destroy();}catch(e){}
  if(NET.role==='host') netForget();
  Object.assign(NET,{role:null,peer:null,conn:null,code:'',status:'',err:'',lost:false,myDeck:null});
  MY_SEAT=null; if(G&&G.online){G=null;UNDO=[];}
}
function netHost(saved){
  if(typeof Peer==='undefined'){NET.err='Bibliothèque de connexion non chargée : il faut être connecté à Internet.';render();return;}
  try{if(NET.peer)NET.peer.destroy();}catch(e){}
  Object.assign(NET,{role:'host',conn:null,err:'',lost:false,code:saved?saved.code:newCode(),status:'Ouverture de la partie…'});
  if(saved){G=saved.G;HIST.splice(0,HIST.length,...(saved.HIST||[]));UNDO=[];MY_SEAT=0;UI.tab='combat';}
  const peer=new Peer(PEER_PREFIX+NET.code,peerOptions()); NET.peer=peer;
  peer.on('open',()=>{NET.status='En attente de votre adversaire…';render();});
  peer.on('error',err=>{
    if(err.type==='unavailable-id'&&!saved){netHost();return;}
    NET.err=err.type==='unavailable-id'?'Ce code est encore occupé : réessayez dans une minute.':netErr(err);render();
  });
  peer.on('disconnected',()=>{try{peer.reconnect();}catch(e){}});
  peer.on('connection',conn=>{
    conn.on('data',msg=>hostOnData(conn,msg));
    conn.on('close',()=>{if(NET.conn===conn){NET.conn=null;if(G)log('Adversaire déconnecté.','sys');render();}});
  });
  render();
}
function hostOnData(conn,msg){
  if(!msg||typeof msg!=='object') return;
  if(msg.t==='hello'){
    if(NET.conn&&NET.conn!==conn&&NET.conn.open){
      // même joueur qui revient (ancienne connexion pas encore détectée comme coupée) : on bascule ; sinon partie complète
      if(G&&String(msg.name||'')===G.names[1]){try{NET.conn.close();}catch(e){}}
      else {conn.send({t:'full'});setTimeout(()=>conn.close(),500);return;}
    }
    NET.conn=conn; NET.lastSeen=Date.now();
    if(!G){
      MY_SEAT=0; UI.tab='combat';
      const deck=DECK_ORDER.includes(msg.deck)?msg.deck:'seve';
      const name=String(msg.name||'Invité').slice(0,24);
      newMatch({decks:[NET.myDeck||UI.pick[0],deck],names:[UI.names[0],name],mode:UI.mode,variant:'std',hideHands:false,online:true});
      log(`${name} a rejoint la partie.`,'sys');
    } else log(`${G.names[1]} est de retour.`,'sys');
    render(); return;
  }
  if(conn!==NET.conn) return;
  NET.lastSeen=Date.now();
  if(msg.t==='ping') return;
  if(msg.t==='act'&&GAME_ACTIONS.has(msg.a)&&Array.isArray(msg.args)) hostExec(1,msg.a,msg.args.map(String));
  if(msg.t==='bye'){NET.conn=null;if(G)log(`${G.names[1]} a quitté la partie.`,'sys');render();}
}
function hostAllowed(seat,a,args){
  if(!G) return false;
  if(a==='nextround'||a==='rematch') return isOver();
  if(G.phase==='setup'){
    if(a==='ssel') return seatOfHand(+args[0])===seat;
    if(a==='setupok') return !PL(seat).champion;
    if(a==='setdrop') return seatOfHand(+args[0])===seat&&!PL(seat).champion;
    return false;
  }
  if(G.phase!=='actions') return false;
  if(a==='undo') return undoAllowed(seat);
  return actingPlayer()===seat;
}
function hostExec(seat,a,args){
  if(!hostAllowed(seat,a,args)||!H[a]) return;
  ACT_SEAT=seat;
  try{ H[a](...(args.length?args:[undefined])); } finally { ACT_SEAT=null; }
  render();
}
function viewFor(seat){
  const v=JSON.parse(JSON.stringify(G));
  v.players.forEach((P,i)=>{
    if(i===seat){P.deck=[...P.deck].sort();return;}
    P.deck=P.deck.map(()=>null);
    P.hand=P.hand.map(h=>({uid:h.uid,id:null}));
    if(!v.revealed){if(P.champion)P.champion.id=null;P.bench.forEach(b=>b.id=null);}
    v.setupSel[i]=[];
  });
  v.undoOk=undoAllowed(seat);
  return v;
}
// PeerJS refuse les messages JSON de plus de ~16 Ko : l'état est envoyé en morceaux de 4000 caractères
const CHUNK=4000; let SEND_SEQ=0;
function netSend(conn,obj){
  const str=JSON.stringify(obj), id=++SEND_SEQ, n=Math.max(1,Math.ceil(str.length/CHUNK));
  for(let i=0;i<n;i++) conn.send({t:'part',id,i,n,d:str.slice(i*CHUNK,(i+1)*CHUNK)});
}
const PARTS={id:0,got:[],count:0};
function netReceivePart(msg){
  if(msg.id<PARTS.id) return null;
  if(msg.id!==PARTS.id){PARTS.id=msg.id;PARTS.got=new Array(msg.n);PARTS.count=0;}
  if(PARTS.got[msg.i]==null){PARTS.got[msg.i]=msg.d;PARTS.count++;}
  if(PARTS.count<msg.n) return null;
  try{return JSON.parse(PARTS.got.join(''));}catch(e){return null;}
}
function netBroadcast(){
  netSave();
  if(NET.conn&&NET.conn.open){try{const v=viewFor(1);v.log=v.log.slice(-250);netSend(NET.conn,{t:'state',G:v,HIST,code:NET.code});}catch(e){}}
}
function netJoin(code){
  if(typeof Peer==='undefined'){NET.err='Bibliothèque de connexion non chargée : il faut être connecté à Internet.';render();return;}
  try{if(NET.peer)NET.peer.destroy();}catch(e){}
  Object.assign(NET,{role:'guest',code,conn:null,err:'',lost:false,status:'Connexion à la partie '+code+'…'});
  const peer=new Peer(undefined,peerOptions()); NET.peer=peer;
  peer.on('error',err=>{NET.err=netErr(err);if(!G){NET.role=null;}else NET.lost=true;render();});
  peer.on('open',()=>{
    const conn=peer.connect(PEER_PREFIX+code,{reliable:true,serialization:'json'}); NET.conn=conn;
    conn.on('open',()=>{NET.lost=false;NET.lastSeen=Date.now();NET.status='Connecté, en attente de l\'hôte…';if(!NET.myDeck)NET.myDeck=resolveDeck(0);conn.send({t:'hello',name:UI.names[0],deck:NET.myDeck});render();});
    conn.on('data',raw=>{
      if(!raw||typeof raw!=='object') return;
      NET.lastSeen=Date.now(); if(NET.lost){NET.lost=false;render();}
      const msg=raw.t==='part'?netReceivePart(raw):raw; if(!msg) return;
      if(msg.t==='full'){netLeave();NET.err='Cette partie a déjà deux joueurs.';render();return;}
      if(msg.t==='bye'){netLeave();NET.err='L\'hôte a quitté la partie.';render();return;}
      if(msg.t==='state'){G=msg.G;HIST.splice(0,HIST.length,...(msg.HIST||[]));MY_SEAT=1;UNDO=[];NET.err='';if(UI.tab==='combat'||!G)UI.tab='combat';render();}
    });
    conn.on('close',()=>{if(NET.role==='guest'){NET.lost=true;render();}});
  });
  render();
}

// Battement de cœur : détecte un appareil qui a disparu sans prévenir (écran verrouillé, réseau coupé)
setInterval(()=>{
  if(!NET.role||!NET.conn) return;
  if(NET.conn.open){try{NET.conn.send({t:'ping'});}catch(e){}}
  const silent=Date.now()-(NET.lastSeen||0)>10000;
  if(NET.role==='host'&&silent&&G){try{NET.conn.close();}catch(e){}NET.conn=null;log('Adversaire déconnecté.','sys');render();}
  if(NET.role==='guest'&&silent&&G&&!NET.lost){NET.lost=true;render();}
},3000);

render();
</script>
