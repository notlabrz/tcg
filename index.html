<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@1,900&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>DC TCG · Duel des champions</title>
<!-- Application web : s'ouvre en plein écran depuis l'écran d'accueil -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DC TCG">
<meta name="theme-color" content="#0d0f13">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#121419;--panel:#1b1e25;--panel2:#242832;--line:#323745;--text:#eceef3;--muted:#98a0ae;--accent:#ffc94a;--good:#45d483;--bad:#ff5c5c;--atk:#ff8f6b;--def:#6fb6ff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);overscroll-behavior:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* Plein écran iPhone (app sur l'écran d'accueil) : avec la barre d'état transparente, iOS calcule la hauteur
   de la page sans la zone de la barre d'état ; sur une page courte, la barre du bas remonte. On compense. */
html{min-height:calc(100% + env(safe-area-inset-top))}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
#app{flex:1 0 auto}
html,body{color:var(--text);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover:not(:disabled){border-color:#5a6480}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--accent);color:#1a1400;border-color:var(--accent);font-weight:700}
button.ghost{background:transparent}
input,select,textarea{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
header{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:18px;padding:calc(10px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) 10px calc(18px + env(safe-area-inset-left));background:#0d0f13;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:17px;letter-spacing:3px;white-space:nowrap}
header h1 span{color:#3b8ff0}
.tabs{display:flex;gap:6px}
.tabs button{border-radius:999px;padding:6px 18px}
.tabs button.on{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:700}
.ver{margin-left:auto;color:var(--muted);font-size:12px}
.page{max-width:1200px;margin:0 auto;padding:18px}
.muted{color:var(--muted)}
h3{margin:22px 0 10px;font-size:15px}

/* cartes */
.card{--tc:#888;position:relative;width:128px;min-height:168px;border-radius:10px;background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 24%,var(--panel2)) 0,var(--panel2) 48%);border:2px solid var(--tc);padding:6px 7px;display:flex;flex-direction:column;gap:3px;transition:transform .15s,opacity .15s,box-shadow .15s;user-select:none}
.card .top{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.card .top b{color:var(--text);font-size:12px}
.card .nm{font-weight:750;font-size:13.5px;line-height:1.15}
.card .band{height:3px;background:var(--tc);border-radius:2px;margin:1px 0 2px}
.card .kind{font-size:10.5px;color:var(--muted)}
.card .tal{font-size:11px;color:var(--accent);font-weight:600}
.card .spe{font-size:11px;color:var(--atk);font-weight:700}
.card .txt{font-size:11px;color:#c9ced8;line-height:1.3}
.card .stats{margin-top:auto;display:flex;justify-content:space-between;font-weight:800;font-size:17px}
.card .stats .atk{color:var(--atk)} .card .stats .def{color:var(--def)}
.card .stats .up{text-decoration:underline;filter:brightness(1.25)}
.card .stats .hurt{color:var(--bad)}
.card .cnt{position:absolute;top:-9px;right:-9px;background:var(--text);color:var(--bg);font-weight:800;border-radius:999px;padding:1px 7px;font-size:12px}
.card .tags{display:flex;flex-wrap:wrap;gap:3px}
.tag{font-size:10px;background:#0007;border-radius:4px;padding:1px 5px;color:#dfe3ea}
.tag.eq{background:#2bb3a333;color:#7fe6da}
.tag.st{background:#ffc94a22;color:var(--accent)}
.card.click{cursor:pointer}
.card.click:hover{transform:translateY(-3px)}
.card.target{cursor:pointer;box-shadow:0 0 0 3px var(--accent)}
.card.target:hover{transform:translateY(-3px)}
.card.sel{box-shadow:0 0 0 3px var(--good)}
.card.dim{opacity:.55}
.card.big{width:210px;min-height:0;aspect-ratio:5/7;overflow:hidden;padding:10px 12px}
/* fiche d'une carte : carte centrée, détails dessous */
.dmodal{max-width:460px;position:relative}
.card.tilt{transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(var(--sc,1));transition:transform .45s cubic-bezier(.2,.8,.2,1);touch-action:none;will-change:transform;cursor:grab}
.card.tilt.live{transition:transform .06s linear}
/* brillance irisée qui glisse avec le mouvement : seulement les cartes ✯✯✯ */
.card.tilt.holo::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:var(--so,0);transition:opacity .35s;
  background:linear-gradient(115deg,transparent 18%,rgba(255,80,180,.26) 34%,rgba(80,200,255,.3) 47%,rgba(120,255,160,.26) 60%,transparent 78%);
  background-size:220% 220%;background-position:var(--hx,50%) var(--hy,50%);mix-blend-mode:screen}
.qmodal{max-width:340px;text-align:center}
.qmodal h3.xo{font-size:19px;margin:0 0 8px}
.qmodal p{margin:0 0 14px}
.qbtns{display:flex;gap:10px;justify-content:center;margin-top:6px}
.qbtns button{min-width:96px;padding:9px 14px;border-radius:9px}
.rmodal{max-width:420px}
.dpick{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:8px}
.dpi{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted)}
.dpi .card.mini{width:84px;text-align:left}
.dmodal .mclose{float:none;position:absolute;top:14px;right:14px;z-index:2}
.dcard{display:flex;justify-content:center;margin:6px 0 14px}
.cview{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;width:100%;max-width:420px;margin:auto;padding:16px;min-height:100%}
.cview .dcard{margin:0}
.catk{display:flex;flex-direction:column;gap:8px;width:100%;max-width:300px}
.catk button{padding:9px 10px;font-size:14px;border-radius:11px}
.catk button.brow2{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left}.catk .bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.catk .bl small{font-size:.85em;opacity:.85}.catk .br{flex:none;font-size:.92em}
.catk button.sec{background:#2b3346;border-color:#4a5674;color:var(--text)}
.catk button.off,.catk button:disabled{opacity:1;background:#262a34;border-color:#363c4a;color:#7d8597}
.catk{max-width:290px;gap:7px;align-items:center}.catk button{width:100%}.catk button[data-a^="play:"],.catk button[data-a^="setdrop:"]{width:auto;min-width:150px;padding:9px 22px}.catk button{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .btags{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 2px;font-size:12px;font-weight:700}.card .btags span{background:#0006;border-radius:6px;padding:2px 6px}
.card .stats small{font-size:.65em;opacity:.8}
.sinfo .azone{margin:0 0 8px;align-self:flex-end}.sinfo .abtns button{padding:6px 14px}
.mmodal{position:relative}.mmodal>.mclose{float:none;position:absolute;top:12px;right:12px}.mmodal h3{padding:0 34px}
.catk .why{font-size:12px;color:var(--muted);text-align:center;margin-top:-4px}
.dpick.cemet{max-height:62vh;overflow:auto}
.dinfo{margin:0}
.dname{font-size:26px;font-weight:850;text-align:center;margin:0 0 4px;line-height:1.15}
.dchain{gap:4px;margin-top:6px}
.dchain .arr{font-size:14px;margin:0 1px}
.card.mini{width:76px;min-height:0;aspect-ratio:5/7;overflow:hidden;padding:4px 5px;gap:1px}
.card.mini .top{font-size:8px}.card.mini .top b{font-size:9px}
.card.mini .nm{font-size:10px}
.card.mini .tal,.card.mini .spe,.card.mini .kind,.card.mini .txt{font-size:8px}
.card.mini .stats{font-size:12px}
.card.mini.sel{box-shadow:0 0 0 3px var(--accent)}
.dinfo dt{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.4px;margin-top:12px}
.dinfo dd{margin:3px 0 0;line-height:1.4}
.lk{color:#9cc8ff;text-decoration:underline;cursor:pointer}
.card.big .nm{font-size:20px}.card.big .stats{font-size:26px}.card.big .txt{font-size:13px}
.card.back{background:repeating-linear-gradient(45deg,#2a2f3b 0 8px,#222631 8px 16px);border-color:#454b5a;width:70px;min-height:96px}
.card.back.full{width:128px;min-height:168px}

/* decks */
.dtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.dtile{--tc:#888;text-align:left;padding:14px;border:2px solid var(--line);border-radius:14px;background:linear-gradient(160deg,color-mix(in srgb,var(--tc) 30%,var(--panel)) 0,var(--panel) 70%)}
.dtile.on{border-color:var(--tc);box-shadow:0 0 0 2px var(--tc)}
.dt-name{font-size:20px;font-weight:800}
.dt-sub{font-size:12px;color:var(--muted);margin:4px 0}
.deckhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:14px;margin-top:22px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.deckhead h2{margin:0}
.grid{display:flex;flex-wrap:wrap;gap:14px}
.seg{display:inline-flex;gap:4px;margin-top:14px}
.seg button.on{background:var(--text);color:var(--bg);font-weight:700}

/* modale */
.modal-bg{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:780px;width:100%;max-height:90vh;overflow:auto}
.mrow{display:flex;gap:20px;flex-wrap:wrap}
.minfo{flex:1;min-width:240px}
.minfo dt{color:var(--muted);font-size:12px;margin-top:10px}
.minfo dd{margin:2px 0 0}
.chain{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.chain .arr{color:var(--muted);font-size:20px}
.mclose{float:right}

/* préparation */
.setup{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.box h3{margin-top:0}
.dpick{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.dchip{--tc:#888;border:2px solid var(--line)}
.dchip.on{border-color:var(--tc);background:color-mix(in srgb,var(--tc) 35%,var(--panel2));font-weight:700}
.opts label{display:flex;gap:8px;align-items:flex-start;margin:8px 0}
.duels{display:flex;flex-wrap:wrap;gap:8px}

/* table */
.arena{display:grid;grid-template-columns:1fr 340px;gap:12px;padding:12px;align-items:start}
.table{display:flex;flex-direction:column;gap:10px;min-width:0}
.player{background:var(--panel);border-radius:14px;padding:10px 12px;border:2px solid transparent}
.player.active{border-color:var(--accent)}
.pinfo{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.pname{font-weight:800;font-size:16px}
.badge{font-size:11px;background:var(--accent);color:#1a1400;border-radius:4px;padding:1px 6px;font-weight:800}
.badge.dim{background:var(--line);color:var(--muted)}
.chip{--tc:#888;font-size:12px;border:1px solid var(--tc);color:var(--tc);border-radius:999px;padding:1px 9px;font-weight:700}
.wins{color:var(--accent);letter-spacing:2px}
.troph{font-size:24px;font-weight:850}
.troph small{font-size:12px;color:var(--muted);font-weight:600}
.flag{font-size:11px;background:#ffc94a22;color:var(--accent);border-radius:4px;padding:2px 6px;font-weight:700}
.field{display:flex;gap:18px;flex-wrap:wrap;padding:8px 2px;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);margin:6px 0}
.slotz{display:flex;flex-direction:column;gap:4px}
.slotz .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.slotz .row{display:flex;gap:10px;align-items:flex-start;min-height:170px}
.emptyslot{width:128px;min-height:168px;border:2px dashed var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px}
.zone{display:flex;flex-wrap:wrap;gap:10px;padding:8px 2px;min-height:60px;align-items:flex-start}
.empty{color:var(--muted);font-style:italic;align-self:center}
.hcard{display:flex;flex-direction:column;gap:4px;width:128px}
.hcard button{font-size:11.5px;padding:4px 6px}
.mid{background:#191c22;border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.midtxt{flex:1;min-width:260px}
.midbtns{display:flex;gap:8px;flex-wrap:wrap}
.counter{display:inline-block;font-size:12px;background:var(--panel2);border-radius:6px;padding:1px 7px;margin-left:6px}
.counter.hot{background:var(--accent);color:#1a1400;font-weight:800}
.pend{margin-top:6px;color:var(--accent)}
.prev{font-size:12.5px;color:var(--muted);margin-top:4px}
.side{display:flex;flex-direction:column;gap:12px;position:sticky;top:62px}
.side .box{padding:12px}
.log{max-height:320px;overflow:auto;font-size:12.5px;display:flex;flex-direction:column;gap:3px}
.log .l.head{font-weight:800;color:var(--accent);margin-top:4px}
.log .l.turn{font-weight:700;color:#cfd5e0;border-top:1px solid var(--line);padding-top:3px}
.log .l.good{color:var(--good)} .log .l.bad{color:var(--bad)} .log .l.sys{color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{border-bottom:1px solid var(--line);padding:4px 5px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600}
.reg input{width:100%;font-size:12px;padding:3px 5px}
.handoff{position:fixed;inset:0;z-index:40;background:#0d0f13f2;display:flex;align-items:center;justify-content:center;text-align:center}
.handoff h2{font-size:34px;margin:6px 0 18px}
.banner{font-size:16px}
details summary{cursor:pointer;font-weight:700}
.pop{position:fixed;z-index:70;width:290px;background:#0d0f13;border:1px solid #5a6480;border-radius:12px;padding:12px 14px;box-shadow:0 10px 30px #000a;font-size:13px;pointer-events:none}
.pop h4{margin:0 0 2px;font-size:16px}.pop .sub{color:var(--muted);font-size:12px;margin-bottom:8px}
.pop dl{margin:0}.pop dt{color:var(--muted);font-size:11.5px;margin-top:7px}.pop dd{margin:1px 0 0}
.pop .ab{color:var(--accent);font-weight:700}
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:35;display:flex;background:#0d0f13;border-top:1px solid var(--line);padding:6px calc(8px + env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left))}
.bottombar button{flex:1;border:0;background:transparent;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;color:var(--muted);font-size:12.5px}
.bottombar button .ic{font-size:24px;line-height:1}

.ico{display:inline-block;position:relative;width:36px;height:28px}
.ico::before,.ico::after{content:'';position:absolute;inset:0}
.ico::before{background:#2a2f3b;-webkit-mask:var(--icf) center/contain no-repeat;mask:var(--icf) center/contain no-repeat}
.ico::after{background:currentColor;-webkit-mask:var(--ic) center/contain no-repeat;mask:var(--ic) center/contain no-repeat}
.gear .ico{width:24px;height:24px;color:var(--text);vertical-align:middle}
.bottombar button.on{color:var(--text);background:var(--panel2);font-weight:700}
#app{padding-bottom:calc(120px + env(safe-area-inset-bottom))}
.backbtn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(62px + env(safe-area-inset-bottom));z-index:34;padding:9px 22px;border-radius:999px;background:var(--panel2);border:1px solid #5a6480;font-weight:600;box-shadow:0 4px 16px #0008}
.ptop h2,.ptitle{font-family:'Exo 2',system-ui,-apple-system,sans-serif;font-style:italic;font-weight:900;text-transform:uppercase;letter-spacing:.3px}
.ptitle{text-align:center;margin:0 0 16px;font-family:'Exo 2',system-ui,-apple-system,sans-serif;font-style:italic;font-weight:900;font-size:28px;line-height:1.15;text-transform:uppercase;letter-spacing:.3px}
.imenu{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.mbtn{display:block;width:100%;max-width:460px;aspect-ratio:1063/299;padding:0;border:0;border-radius:0;background:transparent center/100% 100% no-repeat;cursor:pointer;transition:transform .08s,filter .08s}
.mbtn:not(:disabled):active{transform:scale(.97);filter:brightness(1.25)}

.vcenter{display:flex;flex-direction:column;justify-content:flex-start;min-height:calc(100vh - 46px - 120px - env(safe-area-inset-bottom) - 36px);min-height:calc(100dvh - 46px - 120px - env(safe-area-inset-bottom) - 36px)}
.vcenter>.menu,.vcenter>.imenu{margin-top:auto;margin-bottom:auto}
.vcenter::after{content:'';flex:none;height:44px}
.ptop{position:relative;margin-bottom:16px}
.ptop h2{margin:0;font-size:28px;line-height:1.15;text-align:center}
.ptop .right{position:absolute;right:0;top:50%;transform:translateY(-50%);white-space:nowrap;padding:7px 10px}
.randbtn{flex:0 0 auto;margin-top:12px;padding:0 16px;border:2px solid var(--line);border-radius:12px;font-size:22px;background:var(--panel2)}
.randbtn.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 25%,var(--panel2))}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.menu button{text-align:left;padding:22px 20px;border:2px solid var(--line);border-radius:14px;background:var(--panel);font-size:22px;font-weight:800;min-height:96px}
.menu button small{display:block;font-size:11px;font-weight:500;color:var(--muted);margin-top:6px}
.menu button:disabled small{color:var(--muted)}
.navhead{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;margin-bottom:16px}
.navhead h2{text-align:center}
.navhead .ghost.spacer{visibility:hidden}
.ctr{text-align:center}
.ctr .menu button{text-align:center}
.ctr .dpick,.ctr .duels,.ctr .grid{justify-content:center}
.ctr .opts label{justify-content:center}
.ctr .dtile{text-align:center}
.ctr .card{text-align:left}
.deckbtn{--tc:#888;display:block;width:100%;margin-top:12px;padding:14px;border:2px solid var(--tc);border-radius:12px;background:color-mix(in srgb,var(--tc) 22%,var(--panel2));font-size:15px}
.deckbtn small{display:block;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.dtile.on{box-shadow:0 0 0 3px var(--accent)}
.grid.compact{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.grid.compact .card{width:auto;min-height:0;aspect-ratio:5/7;overflow:hidden;padding:5px 6px}
.grid.compact .card .txt{flex:1;min-height:0;overflow:hidden;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
.grid.compact .card .nm{font-size:12px}
.grid.compact .card .top{font-size:9.5px}
.grid.compact .card .tal,.grid.compact .card .spe,.grid.compact .card .kind,.grid.compact .card .txt{font-size:10px}
.grid.compact .card .stats{font-size:14px}
/* composition d'un deck : 4 cartes par ligne */
.grid.compact.c4{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 7px;padding-top:6px}
.grid.c4 .card{padding:3px 4px;gap:1px}
.grid.c4 .card .top{font-size:7.5px}.grid.c4 .card .top b{font-size:8.5px}
.grid.c4 .card .nm{font-size:9.5px}
.grid.c4 .card .tal,.grid.c4 .card .spe,.grid.c4 .card .kind,.grid.c4 .card .txt{font-size:7.5px}
.grid.c4 .card .stats{font-size:11px}
.grid.c4 .card .cnt{top:-7px;right:-5px;font-size:10px;padding:0 5px}
.grid.c4 .card{overflow:visible}
.dt-name.xo{font-size:20px}
.dgroup{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px 14px 16px;margin:0 0 16px}
.dgroup h3.grp{margin:12px 0 12px}
.colbar{display:flex;flex-direction:column;gap:8px;margin:0 0 12px}
.colbar input{width:100%;font-size:14px;padding:8px 10px;box-sizing:border-box}
.fbtn{align-self:stretch;padding:9px 12px;font-weight:700}
.fcount{display:inline-block;min-width:18px;padding:0 6px;margin-left:6px;border-radius:9px;background:var(--accent);color:#1a1a1a;font-size:11.5px;line-height:18px}
.fmodal{max-width:420px;padding-bottom:28px}
.fmodal .filters{margin-bottom:16px}
.fbtns{display:flex;gap:8px;justify-content:center}
.filters{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:0 0 12px;text-align:left}
.filters input{grid-column:1/-1}
.filters label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.filters select,.filters input{width:100%;font-size:14px;padding:7px 8px}
@media (min-width:760px){.filters{grid-template-columns:2fr repeat(4,1fr)}.filters input{grid-column:auto}}
.navhead h2{margin:0;font-size:20px}
.rules h3{margin:22px 0 8px}.rules p,.rules li{line-height:1.55}.rules table{margin:8px 0;max-width:640px}
/* ===== Écran de match compact (téléphone) ===== */
body.inmatch .bottombar{display:none}
body.inmatch header{display:none}
body.inmatch .match{padding-top:calc(6px + env(safe-area-inset-top))}
body.inmatch #app{padding-bottom:0;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
body.inmatch .match{flex:1 1 auto;min-height:0;width:100%;box-sizing:border-box;padding-bottom:calc(4px + env(safe-area-inset-bottom))}
body.inmatch .match>*{flex-shrink:0}
body.inmatch .mfield{flex:1 1 0;min-height:0}
body.inmatch .mslot{min-height:0}
body.inmatch .mfield .mcard,body.inmatch .mfield .mempty{flex:1 1 auto;height:auto!important;min-height:0}
.mhandrow{position:relative;display:flex;gap:6px;align-items:stretch}
.mhandrow .mhandcol{flex:1;min-width:0}
.match{max-width:560px;margin:0 auto;padding:6px 8px 0;display:flex;flex-direction:column;gap:6px}
.pbar{display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap;font-size:11.5px;padding:4px 8px;border-radius:10px;background:var(--panel);border:1px solid transparent;color:var(--muted)}
.pbar.on{border-color:var(--accent)}
.pbar .nm{font-weight:800;font-size:13.5px;color:var(--text)}
.pbar .st{font-weight:850;font-size:15px;color:var(--text)}
.pbar .st small{font-size:11px;color:var(--muted);font-weight:600}
.pbar .badge,.pbar .chip,.pbar .flag{font-size:10.5px;padding:0 6px}
.mfield{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mslot{display:flex;flex-direction:column;gap:2px;min-width:0}
.mslot .lb{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;text-align:center}
.mslot.champ .lb{color:var(--accent);font-weight:700}
.mcard{--tc:#888;position:relative;height:118px;border-radius:9px;border:2px solid var(--tc);background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 24%,var(--panel2)) 0,var(--panel2) 55%);padding:4px 5px;display:flex;flex-direction:column;gap:1px;overflow:hidden;cursor:pointer;font-size:10px;user-select:none;min-width:0}
.mcard .mtop{display:flex;justify-content:space-between;color:var(--muted);font-size:8.5px;text-transform:uppercase;letter-spacing:.3px}
.mcard .mtop b{color:var(--text);font-size:10px}
.mcard .mnm{font-weight:750;font-size:11.5px;line-height:1.12;max-height:2.25em;overflow:hidden}
.mcard .mab{color:var(--accent);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard .msp{color:var(--atk);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard .mtxt{color:#c9ced8;line-height:1.25;overflow:hidden;flex:1}
.mcard .mtags{display:flex;flex-wrap:wrap;gap:2px}
.mcard .mtags span{font-size:8.5px;background:#0007;border-radius:3px;padding:0 3px;white-space:nowrap}
.mcard .mst{margin-top:auto;display:flex;justify-content:space-between;align-items:baseline;font-weight:800;font-size:14px}
.mcard .mst .atk{color:var(--atk)} .mcard .mst .def{color:var(--def)} .mcard .mst .hurt{color:var(--bad)} .mcard .mst .up{text-decoration:underline}
.mcard .mst small{font-size:10px;color:var(--muted)}
.mcard.target{box-shadow:0 0 0 3px var(--accent)}
.mcard.sel{box-shadow:0 0 0 3px var(--good)}
.mcard.dim{opacity:.5}
.mcard.back{background:repeating-linear-gradient(45deg,#2a2f3b 0 8px,#222631 8px 16px);border-color:#454b5a;cursor:default}
.mempty{height:118px;border:2px solid var(--line);border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:10.5px}
.mhandlbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;text-align:center}
.mhand{display:flex;gap:6px;overflow-x:auto;padding:3px 2px 6px;-webkit-overflow-scrolling:touch}
.mhand .mcard{flex:0 0 88px}
.mhand .empty{margin:auto;font-size:12px}
.mmid{background:#191c22;border:1px solid var(--line);border-radius:12px;padding:7px 8px;display:flex;flex-direction:column;gap:6px;font-size:12.5px;text-align:center}
.mmid .pips{display:inline-flex;gap:3px;vertical-align:middle;margin-left:6px}
.mmid .pips i{width:10px;height:10px;border-radius:50%;background:var(--line);display:inline-block}
.mmid .pips i.on{background:var(--accent)}
.mmid .btns{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.mmid .btns button{padding:8px 10px;font-size:13px}
.mmid .small{font-size:11.5px;color:var(--muted)}
.mmid .pend{margin:0}
.gear{position:relative;align-self:flex-end;flex:0 0 auto;margin-bottom:6px;z-index:36;width:42px;height:42px;border-radius:50%;font-size:22px;padding:0;background:var(--panel2);border:1px solid #5a6480;box-shadow:0 4px 14px #0008}
.gmenu-bg{position:fixed;inset:0;z-index:36}
.gmenu{position:absolute;left:0;bottom:calc(100% + 6px);z-index:37;background:var(--panel);border:1px solid #5a6480;border-radius:14px;padding:6px;display:flex;flex-direction:column;gap:2px;min-width:230px;box-shadow:0 10px 30px #000a}
.gmenu button{text-align:left;border:0;background:transparent;padding:11px 12px;font-size:15px;border-radius:9px}
.gmenu button:hover{background:var(--panel2)}
.gmenu .confirm{padding:8px 10px;font-size:14px;display:flex;flex-direction:column;gap:8px}
.gmenu .confirm div{display:flex;gap:8px}
.sheet-bg{position:fixed;inset:0;background:#000a;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;width:100%;max-width:560px;max-height:78vh;overflow:auto;padding:14px 16px calc(16px + env(safe-area-inset-bottom));font-size:13.5px}
.sheet h4{margin:0 0 2px;font-size:17px}.sheet .sub{color:var(--muted);font-size:12px;margin-bottom:8px}
.sheet dl{margin:0}.sheet dt{color:var(--muted);font-size:11.5px;margin-top:7px}.sheet dd{margin:1px 0 0}.sheet .ab{color:var(--accent);font-weight:700}
.sheet .acts{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.sheet .acts button{padding:11px;font-size:15px}
.sheet .acts .why{font-size:11.5px;color:var(--muted);margin:-2px 0 4px;text-align:center}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--good);color:#04210f;padding:8px 16px;border-radius:8px;font-weight:700;z-index:60}
.bottombar~#toast{}
@media (max-width:1050px){.arena{grid-template-columns:1fr}.side{position:static}.setup{grid-template-columns:1fr}}
@media (max-height:760px){.mcard,.mempty{height:88px}.mhand .mcard{height:112px}.pbar{padding:3px 8px}.mhand{padding-bottom:3px}.mcard .mnm{font-size:11px}.mcard .mst{font-size:13px}.mmid{padding:5px 8px;gap:4px}.match{gap:4px}}
@media (max-width:400px){.pbar{flex-wrap:nowrap;white-space:nowrap;overflow:hidden}.pbar .chip{display:none}}
@media (min-height:761px){body.inmatch .mhand .mcard{height:150px}}

/* ===== Plateau de match (maquette v1.6) ===== */
.match2{flex:1 1 auto;min-height:0;width:100%;max-width:560px;margin:0 auto;box-sizing:border-box;display:flex;flex-direction:column;gap:3px;padding:calc(4px + env(safe-area-inset-top)) 8px calc(4px + env(safe-area-inset-bottom))}
.match2>*{flex-shrink:0}
.ohand{display:flex;flex-direction:column;align-items:center;gap:2px}
.obacks{display:flex;gap:0;justify-content:center;flex-wrap:nowrap;overflow:hidden;max-width:100%}
.obacks i+i{margin-left:var(--og,4px)}.obacks i{box-shadow:-1px 0 0 #0006;width:22px;height:30px;border-radius:3px;border:1px solid #4a5163;background:#262a34;flex:0 0 auto}
.board{position:relative;flex:1 1 0!important;min-height:0;display:flex;flex-direction:column;gap:4px;container-type:inline-size;overflow:visible}
.ring{position:absolute;left:50%;top:50%;border-radius:50%;transform:translate(-50%,-50%);border:10cqw solid #262b36;pointer-events:none;z-index:0}
.ring.r1{width:64cqw;height:64cqw}
.ring.r2{width:140cqw;height:140cqw}
.board{justify-content:space-evenly}
.brow{position:relative;z-index:1;display:grid;min-height:0;column-gap:8px;grid-template-rows:100%}
.brow.bench{flex:none;height:calc(var(--hb,110px) + 13px);grid-template-columns:1fr auto 1fr}
.brow:has(.gmenu){z-index:5}
.brow.champ{z-index:2;flex:none;height:calc(var(--hc,140px) + 13px);grid-template-columns:1fr auto 1fr}
.brow .bside{display:flex;flex-direction:column;min-height:0;min-width:0}
.brow .bside.end{align-items:flex-end;justify-content:flex-end}
.brow .lb{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;text-align:center;line-height:13px;height:13px}
.brow .lb.ch{color:var(--accent);font-weight:800}
.pair,.cz{display:flex;flex-direction:column;align-items:center;min-height:0;min-width:0}
.pair .pr{display:flex;gap:8px}
.board .mcard,.board .mempty{flex:none!important;box-sizing:border-box;min-height:0;min-width:0}
.pair .pr>*,.board .bside .pile{width:var(--wb,79px);height:var(--hb,110px)!important}
.czc{position:relative;display:flex;flex-direction:column;align-items:center}
.czflag{position:absolute;left:50%;top:100%;transform:translate(-50%,-55%);white-space:nowrap;font-size:10px;padding:1px 7px;background:#3a3015;border:1px solid var(--accent);z-index:2;pointer-events:none}
.czc>.mcard,.czc>.mempty,.cz>.mcard,.cz>.mempty{width:var(--wc,100px);height:var(--hc,140px)!important}
.board .mempty{background:var(--bg)}
.pile{flex:none;margin-top:13px;min-height:0;border:2px solid #3a4050;border-radius:9px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:10.5px;color:var(--muted);padding:3px;box-sizing:border-box;overflow:hidden}

.pile.deck>div{width:100%;height:100%;border-radius:6px;background:#2a2f3b;display:flex;align-items:center;justify-content:center}
.pile.disc{cursor:pointer}
.pile.disc.full{border:2px solid var(--tc);border-style:solid;background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 22%,var(--panel2)) 0,var(--panel2) 60%)}
.pile.disc b{color:var(--text);font-size:10.5px;line-height:1.15;margin-bottom:4px}
.sinfo{justify-content:flex-end;align-items:flex-end;padding-top:13px}.board .sinfo .pbar{align-self:flex-end;max-width:100%}.board .sact .pbar{max-width:100%}
.sact{justify-content:flex-start;padding-top:13px}
.board .pbar{align-self:flex-start;max-width:100%;box-sizing:border-box;flex-wrap:nowrap;white-space:nowrap;overflow:hidden;padding:3px 5px;font-size:10.5px;gap:3px;background:var(--panel);border-radius:10px}
.board .pbar .nm{overflow:hidden;text-overflow:ellipsis;min-width:0;font-size:11px}.board .pbar .badge{font-size:8.5px;padding:0 3px;flex:0 0 auto}.board .pbar .st{font-size:11px;flex:0 0 auto}.board .pbar .st small{font-size:8.5px}.board .pbar .wins{flex:0 0 auto;font-size:7px;letter-spacing:-.5px}
.flags{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}.flags .flag{font-size:10px;padding:0 5px}
.tinfo{font-size:10.5px;color:var(--muted);line-height:1.35;text-align:right}
.match2{position:relative}
.tinfo.tr{position:absolute;top:calc(4px + env(safe-area-inset-top));right:10px;z-index:3;pointer-events:none}
.match2 .ohand .obacks{max-width:calc(100% - 220px)}
.tinfo b{color:var(--text)}
.tinfo .pips{display:inline-flex;gap:3px}.tinfo .pips i{display:inline-flex;color:#3a4050}.tinfo .pips i.on{color:var(--accent)}.tinfo .pips .ast{width:16px;height:16px}
.azone{margin-top:5px;display:flex;flex-direction:column;gap:4px;min-height:0;overflow:visible;position:relative;z-index:5}
.amsg{font-size:10.5px;color:var(--muted);line-height:1.3}.amsg .pend{color:var(--accent);margin:0}.amsg .small{font-size:10.5px}
.abtns{display:flex;flex-direction:column;gap:4px;align-items:stretch}
.abtns button{padding:6px 7px;font-size:12px;border-radius:9px;line-height:1.15}
.abtns button.ghost[data-a="undo"]{align-self:flex-start;padding:4px 12px}
.gearz{justify-content:flex-end;position:relative;pointer-events:none}
.gearz .gear,.gearz .gmenu,.gearz .gmenu-bg{pointer-events:auto}
.gearz .gear{margin:0;align-self:flex-start;display:grid;place-items:center}
.gear .ico{display:block;margin:0}
.gearz .gmenu{bottom:50px;left:0}
.bover{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;pointer-events:none}
.boverin{pointer-events:auto;background:var(--panel);border:1px solid var(--accent);border-radius:14px;padding:14px;max-width:86%;text-align:center;box-shadow:0 10px 30px #000c;display:flex;flex-direction:column;gap:10px}
.boverin .abtns{align-items:center}
.match2 .mhandlbl{font-size:10px}
.match2 .mhand{padding:2px 2px 2px}
.match2 .mhand .mcard{flex:0 0 auto;aspect-ratio:5/7;width:auto}
.dlist .l{padding:7px 4px;border-bottom:1px solid var(--line)}
@media (max-height:700px){.match2 .mhand .mcard{height:104px}.match2>.mhandlbl{display:none}.obacks i{width:16px;height:22px}}
/* pas de sélection de texte ni de menu (copier, rechercher…) à l'appui long, sauf dans les champs */
html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,[contenteditable]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
img{-webkit-user-drag:none}
/* pages de préparation (1 écran, créer, rejoindre, attente) */
.xo{font-family:'Exo 2',system-ui,-apple-system,sans-serif;font-style:italic;font-weight:900;text-transform:uppercase;letter-spacing:.2px}
.sbox{margin-top:16px;padding:16px 18px 20px}
.sbox h3.xo{font-size:19px;margin:2px 0 14px;text-align:center}
h3.grp{font-size:19px;text-align:center;margin:22px 0 12px}
.filters.one{grid-template-columns:1fr}
.fgroup{margin:0 0 12px;padding:12px 12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}
.fgroup:last-child{margin-bottom:16px}
.fgroup.t3 .fchks{display:grid;grid-template-columns:repeat(3,auto);justify-content:center;gap:8px 16px}
.flbl{font-size:13.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:10px;text-align:center}
.fchks{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:center}
.fchks .chk{margin:0;flex-direction:row;align-items:center;gap:8px;justify-content:flex-start;text-transform:none;letter-spacing:0;color:var(--text);font-size:14px}
.fchks .chk span{font-size:14px}
/* bouton rond de tri (Collection) et son menu qui s'ouvre vers le haut */
.sortfab{position:fixed;right:calc(16px + env(safe-area-inset-right));bottom:calc(68px + env(safe-area-inset-bottom));z-index:34;width:46px;height:46px;border-radius:50%;padding:0;background:var(--panel2);border:1px solid #5a6480;box-shadow:0 6px 18px #000a;font-weight:800;font-size:13px;display:grid;place-items:center;white-space:nowrap}
.sortfab.open{border-color:var(--accent);color:var(--accent)}
.sortbg{position:fixed;inset:0;z-index:33}
.sortmenu{position:fixed;right:calc(16px + env(safe-area-inset-right));bottom:calc(122px + env(safe-area-inset-bottom));z-index:35;min-width:160px;background:var(--panel);border:1px solid #5a6480;border-radius:14px;padding:6px;display:flex;flex-direction:column;gap:2px;box-shadow:0 10px 30px #000a;animation:smup .14s ease-out}
@keyframes smup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sortmenu button{display:flex;align-items:center;gap:8px;text-align:left;border:0;background:transparent;padding:7px 10px;font-size:13.5px;border-radius:8px}
.sortmenu button.on{background:var(--panel2);color:var(--accent);font-weight:700}
.tdot{display:inline-block;width:16px;height:16px;border-radius:50%;vertical-align:middle;background:conic-gradient(#3b8ff0 0 20%,#e5484d 0 40%,#3fb950 0 60%,#a08560 0 80%,#e6bb12 0)}
.sortfab .tdot{width:19px;height:19px}
.sortmenu .sic{display:inline-flex;width:46px;justify-content:center;align-items:center}
.sico{display:inline-block;height:14px;background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}

.page>.ptitle+.backbtn+.sbox{margin-top:0}
.sbox .duels{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:340px;margin:0 auto}
.sbox .dchip{padding:9px 8px;font-size:14px;border-radius:10px}
.mcap{margin:12px 0 0;color:var(--muted);font-size:14px;letter-spacing:.3px;text-align:center}
.chk{display:flex;align-items:center;justify-content:center;gap:10px;margin:14px 0 0;cursor:pointer}
.chk input{appearance:none;-webkit-appearance:none;width:18px;height:18px;margin:0;border-radius:5px;border:2px solid var(--muted);background:#fff;display:grid;place-content:center}
.chk input:checked{background:var(--accent);border-color:var(--accent)}
.chk input:checked::after{content:'';width:5px;height:9px;border:solid #1a1400;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chk span{font-size:14px}
.nfield{display:flex;align-items:center;gap:10px;margin:0}
.nfield span{flex:0 0 auto;text-align:left;color:var(--muted);font-size:15.5px;text-transform:uppercase;letter-spacing:.6px;padding-left:2px}
.nfield input{flex:1;min-width:0;font-size:17px;padding:7px 10px;border-radius:8px}
.dchoice{display:flex;gap:8px;align-items:stretch;margin-top:12px}
.dchoice .deckbtn{margin-top:0;padding:10px 12px 12px;border-width:2.5px}
.dchoice .deckbtn small{font-size:12.5px;letter-spacing:.6px;margin-bottom:4px}
.dchoice .deckbtn b{font-size:20px}
.dchoice .deckbtn .chev{font-size:18px;margin-left:4px}
.dchoice .randbtn{margin-top:0;width:62px;padding:0;display:grid;place-items:center;color:var(--text)}
.setact{margin-top:18px;display:flex;flex-direction:column;align-items:center;gap:10px}
.setact .primary{font-size:14px;padding:9px 20px;border-radius:9px}
.snote{text-align:center;font-size:14px;margin-top:16px}
.codein{width:150px;font-size:24px!important;letter-spacing:6px;text-align:center;text-transform:uppercase;padding:8px 10px;display:block;margin:0 auto}
.wbox{text-align:center;padding:16px 18px 18px}
.wbox h3.xo{margin-bottom:6px}
.bigcode{font-size:62px;font-weight:900;letter-spacing:18px;margin:4px 0 8px;padding-left:18px;line-height:1.1}
.wstat{font-size:15px;margin:0 0 14px}
.sbtn{font-size:13px;padding:8px 12px;border-radius:9px}
.vcenter>.wbox{margin-top:auto;margin-bottom:auto}
.backbtn{padding:8px 22px 8px 18px;font-size:16px}
.backbtn .bchev{font-size:20px;line-height:0;margin-right:4px;position:relative;top:1px}
/* glisser-déposer */
.mhand .mcard[data-drag]{touch-action:none}
.board .mcard[data-drag]{touch-action:none}
.dragghost{position:fixed;left:0;top:0;z-index:80;pointer-events:none;opacity:.92;box-shadow:0 14px 30px #000c;transition:none}
.mcard.dragging{opacity:.35}
body.dragmode{user-select:none;-webkit-user-select:none}
.dz-ok{outline:2px dashed var(--accent);outline-offset:2px}
.dz-over{outline:3px solid var(--good)!important;outline-offset:2px;box-shadow:0 0 18px color-mix(in srgb,var(--good) 45%,transparent)}
.board.dz-board{outline:2px dashed color-mix(in srgb,var(--accent) 50%,transparent);outline-offset:-2px;border-radius:12px}
.board.dz-board.dz-over{box-shadow:inset 0 0 40px color-mix(in srgb,var(--good) 25%,transparent)}
/* pas de zoom automatique d'iOS sur les champs de saisie */
@media (pointer:coarse){input,select,textarea{font-size:16px!important}}
.ast{display:inline-block;width:.95em;height:.95em;fill:currentColor;vertical-align:-.12em}
.match2 .mcard .mnm{font-size:10.5px}.match2 .mcard .mab,.match2 .mcard .msp,.match2 .mcard .mtxt{font-size:9px}
.catk .bi{display:inline-block;width:1.3em;text-align:center;margin-right:4px}
.catk .brow2+.brow2.bmid{margin-top:9px}
.catk button.brow2.bmid{justify-content:center;width:auto;min-width:170px;padding-left:24px;padding-right:24px}.catk .bmid .br{display:none}.catk .bi{width:auto;margin-right:6px}
.card.mini>*{flex-shrink:0}.card.mini .band{flex:none;height:3px}.card.mini .stats{flex:none;margin-top:auto}
.card.mini .txt,.card.mini .kind{flex:0 1 auto;min-height:0;overflow:hidden}
.dpi .card{color:var(--text)}
.catk button.primary.brow2:hover:not(:disabled){background:#ffe27a;border-color:#ffe27a}
.catk button.primary.brow2:active:not(:disabled){background:#e9a800;border-color:#e9a800}
.catk button.primary:hover:not(:disabled){background:#ffe27a;border-color:#ffe27a}.catk button.primary:active:not(:disabled){background:#e9a800;border-color:#e9a800}
.card.art{width:min(290px,66vw);aspect-ratio:777/1072;min-height:0;padding:0;border:0;border-radius:4.5%/3.3%;background:transparent center/100% 100% no-repeat;container-type:inline-size;overflow:hidden;color:#222;font-family:Inter,system-ui,sans-serif;gap:0;display:block}
.card.art>div{position:absolute;line-height:1.1;white-space:nowrap}
.card.art .an{left:8.8%;top:57.6%;transform:translateY(-50%);max-width:58%;overflow:hidden;text-overflow:ellipsis;font-weight:800;color:#141414;letter-spacing:-.01em}
.card.art .adef{left:85.4%;top:10.1%;transform:translate(-50%,-50%);font-size:8.4cqw;font-weight:900;color:#5fb0ff;-webkit-text-stroke:.5cqw #1d2a3a;paint-order:stroke fill}
.card.art .aatk{right:12.2%;top:58.6%;transform:translateY(-50%);font-size:9cqw;font-weight:900;color:#f6896b;-webkit-text-stroke:.5cqw #7a1d1d;paint-order:stroke fill}
.card.art .alin{left:9.6%;top:62.5%;transform:translateY(-50%);font-size:2.6cqw;color:#4a4a4a;font-weight:500}
.card.art .aab{left:11.2%;top:68.9%;transform:translateY(-50%);font-size:4.2cqw;font-weight:800;color:#f2b632;-webkit-text-stroke:.35cqw #6b4a12;paint-order:stroke fill;max-width:78%;overflow:hidden;text-overflow:ellipsis}
.card.art .asp{left:11.2%;right:17.4%;top:83.6%;transform:translateY(-50%);display:flex;justify-content:space-between;gap:3%;font-size:4.2cqw;font-weight:800;color:#f08262;-webkit-text-stroke:.35cqw #6e2418;paint-order:stroke fill}
.card.art .asp span:first-child{overflow:hidden;text-overflow:ellipsis}
.card.art .asp .ast,.card.art .awk .ast{vertical-align:-.1em}
.card.art .awk{left:8.6%;top:92.8%;transform:translateY(-50%);font-size:3.5cqw;color:#4d4d4d;font-weight:500}
.card.art .atx{left:11%;right:11%;top:66.2%;white-space:normal;font-size:3.7cqw;line-height:1.35;color:#1e1e24;font-weight:600}
</style>

<script>
/* =========================================================
   RÉGLAGES (section 2 des règles) — à modifier ici
   ========================================================= */
const APP_VERSION = 'v1.18.0';   // numéro de version : à augmenter à chaque mise en ligne (affiché en bas de Paramètres)
const CONFIG = {
  actionsPerTurn: 3,
  startHand: 6,
  maxHand: null,           // pas de limite de main en fin de tour (manuel officiel)
  maxStarters: 1,          // préparation : 1 seul combattant ✯, le champion (manuel du 23/10)
  benchSlots: 2,
  weakBonus: 1,            // bonus de faiblesse
  poseCost: {P:1, M:2, G:3},
  spellCost: 1, itemCost: 1,
  swapSameType: 1,         // échange de champion entre deux créatures du même type
  swapDiffType: 2,         // échange entre deux types différents
  evoOnlyForLineage: true, // niveaux 2 et 3 d'une lignée : uniquement par évolution
  evolveCost: 1,           // par niveau
  heal: 4,                 // Soin
  frappe: 3,               // Frappe
  piedFerme: 2,
  elan: 2, epee: 1, plastron: 2,
  mulliganGift: 1,         // pour chaque mulligan, l'adversaire pioche 1 carte
  attackCost: 0,           // l'attaque est gratuite (pas une action) et termine le tour
  firstPlayerAttacksT1: false
};
// Conditions de victoire (section 2 + variantes C et C' de l'annexe B)
const VARIANTS = {
  std: {label:'6 étoiles (✯ 1 · ✯✯ 2 · ✯✯✯ 3)', win:6, tro:{P:1,M:2,G:3}}

};

/* =========================================================
   CARTES (section 9) — modifier ici
   ========================================================= */
const TYPES = {
  feu:        {name:'Feu',        color:'#e5484d'},
  eau:        {name:'Eau',        color:'#3b8ff0'},
  plante:     {name:'Plante',     color:'#3fb950'},
  roche:      {name:'Roche',      color:'#a08560'},
  electrique: {name:'Électrique', color:'#e6bb12'},
  neutre:     {name:'Neutre',     color:'#9aa3b2'}
};
// Cercle des types : chaque type bat le suivant (Eau > Feu > Plante > Roche > Électrique > Eau). Le Neutre est hors du cercle.
const TYPE_CIRCLE = ['eau','feu','plante','roche','electrique'];
const TYPE_ORDER = [...TYPE_CIRCLE,'neutre'];
// Faiblesse (v1.16) : un combattant typé est faible face au type qui bat le sien ; un Neutre n'a pas de faiblesse
function weakOf(t){const i=TYPE_CIRCLE.indexOf(t);return i<0?null:TYPE_CIRCLE[(i+4)%5];}
function weakName(c){return c.weak?TYPES[c.weak].name:'aucune';}
const ABIL = {
  armure:      {name:'Armure',      text:x=>`Ce combattant subit ${x} dégât${x>1?'s':''} de moins par coup (le coup peut tomber à 0). Ne réduit pas les dégâts directs.`},
  survolte:    {name:'Survolté',    text:()=>'Ce combattant peut évoluer pendant le tour où il a été posé (toujours une seule évolution par tour).'},
  epines:      {name:'Épines',      text:x=>`Quand ce combattant est champion et survit à des dégâts infligés par l'adversaire (coup d'au moins 1 dégât, ou dégâts directs), il inflige ${x} dégât${x>1?'s':''} direct${x>1?'s':''} au champion adverse. Les dégâts d'Épines ne déclenchent pas d'Épines.`},
  regeneration:{name:'Régénération',text:()=>'Quand ce combattant arrive par évolution, il efface tous ses dégâts : il repart avec toute sa DEF.'},
  frenesie:    {name:'Frénésie',    text:x=>`Quand ce combattant vainc le champion adverse en l'attaquant, il récupère ${x} DEF.`},
  eclaireur:   {name:'Éclaireur',   text:()=>'Quand vous posez ce combattant (depuis la main, par évolution ou par Renfort), piochez 1 carte.'},
  soigneuse:   {name:'Soigneuse',   text:()=>'Tant que ce combattant est sur votre banc, votre champion récupère 1 DEF au début de votre tour. L\'effet est cumulable, sans dépasser la DEF maximale.'},

function creatures(fam,type,rows){
  rows.forEach(([id,name,size,atk,def,ab,x,spe,sx,line,from])=>{

      line:line?line[0]:null,spe:{kw:spe,x:sx||0},from:from||null};
  });
}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function tip(c){
  if(c.cat!=='creature') return `${c.name} · ${c.cat==='sort'?'Atout':'Objet'} (1 étoile)\n${c.text}`;
  let t=`${c.name} · ${TYPES[c.type].name} ${c.size} · ATK ${c.atk} / DEF ${c.def}\nFaiblesse : ${weakName(c)} · ${lineLabel(c)}\nPose : ${CONFIG.poseCost[c.size]} étoile${s_(CONFIG.poseCost[c.size])}`;
  if(c.ab) t+=`\n✦ ${abLabel(c)} : ${ABIL[c.ab].text(c.abX)}`;
  return t;
}

// Carte illustrée (détail de la Collection) : fond par type et nombre d'étoiles, infos placées sur les zones du fond
function cardArt(id,o={}){
  const c=C(id), cr=c.cat==='creature', key=cr?c.type+'-'+c.size:c.cat, bgi=CARD_BG[key];
  if(!bgi) return cardHTML(id,o);
  const nl=c.name.length, nfs=nl>20?3.9:nl>16?4.5:5.3;
  let h=`<div class="an" style="font-size:${nfs}cqw">${esc(c.name)}</div>`;
  if(cr){
    h+=`<div class="adef">${c.def}</div><div class="aatk">${c.atk}</div><div class="alin">${esc(lineLabel(c))}</div>`;
    if(c.ab) h+=`<div class="aab">✦ ${esc(abLabel(c))}</div>`;
    if(c.spe) h+=`<div class="asp"><span>⚔ ${esc(speLabel(c))}</span><span>(${speCost(c.id)}${ASTAR})</span></div>`;
    h+=`<div class="awk">${c.weak?'Faible : '+TYPES[c.weak].name:'Sans faiblesse'}</div>`;
  } else {
    h+=`<div class="atx">${esc(c.text)}</div><div class="awk">${c.cat==='sort'?'Atout':'Objet'} · ${c.cat==='sort'?CONFIG.spellCost:CONFIG.itemCost}${ASTAR}</div>`;
  }
  return `<div class="card art ${o.cls||''}" style="background-image:url(${bgi})" data-card="${id}">${h}</div>`;
}
function cardHTML(id,o={}){
  const c=C(id); let top,body='';
  if(c.cat==='creature'){
    top=`<span>${TYPES[c.type].name}</span><b>${STARS[c.size]}</b>`;
    if(c.ab) body+=`<div class="tal">✦ ${abLabel(c)}</div>`;
    if(c.spe) body+=`<div class="spe">⚔ ${speLabel(c)} (${speCost(c.id)}${ASTAR})</div>`;
    body+=`<div class="kind">${c.weak?'Faible : '+TYPES[c.weak].name:'Neutre : sans faiblesse'}<br>${lineLabel(c)}</div>`;
    const s=o.stats||{atk:c.atk,def:c.def};
    body+=`<div class="stats"><span class="atk ${s.ac||''}">⚔ ${s.atk}</span><span class="def ${s.dc||''}">🛡 ${s.def}</span></div>`;
  } else {
    top=`<span>${c.cat==='sort'?'Atout':'Objet'}</span><span></span>`;
    body+=`<div class="txt">${esc(c.text)}</div>`;
  }
  return `<div class="card ${o.cls||''}" style="--tc:${cardColor(c)}" ${o.attrs||''} data-card="${id}"${o.uid?` data-uid="${o.uid}"`:''}>
    <div class="top">${top}</div><div class="nm">${esc(c.name)}</div><div class="band"></div>${o.extra||''}${body}
    ${o.count?`<div class="cnt">×${o.count}</div>`:''}</div>`;
}

const UI = {col:{q:'',cat:[],type:[],stars:[],sort:'starsA'}, tab:'combat', nav:{combat:[],cartes:[],params:[]}, rand:[false,false], deck:'vague', deckEvo:true, detail:null, exportText:null, confirmQuit:false,
  play:'local', joinCode:'', names:['JOUEUR1','JOUEUR2'], pick:['vague','seve'], mode:'match', hideHands:false};
let G=null, UNDO=[], HIST=[];
let MY_SEAT=null;   // en ligne : 0 = hôte (arbitre), 1 = invité ; null = un seul écran
let ACT_SEAT=null;  // siège du joueur dont l'action est en cours d'exécution (hôte)

/* =========================================================
   MOTEUR
   ========================================================= */
function nu(){return G.uid++;}
function PL(p){return G.players[p];}
function cp(){return G.players[G.cur];}
function op(){return G.players[1-G.cur];}
function log(m,c){G.log.push({msg:m,cls:c||''});}
function mine(p){const P=PL(p);return [P.champion,...P.bench].filter(Boolean);}
function findC(p,uid){return mine(p).find(c=>c.uid===uid);}
function ownerOf(uid){return findC(0,uid)?0:findC(1,uid)?1:-1;}
function maxDef(c){return C(c.id).def+(c.item==='plastron'?CONFIG.plastron:0);}
function curDef(c){return maxDef(c)-c.dmg;}
function baseAtk(c){return C(c.id).atk+(c.item==='epee'?CONFIG.epee:0);}
function reduction(p,c){return armor(c)+(PL(p).champion===c?(PL(p).piedFerme?CONFIG.piedFerme:0)+(c.garde||0):0);}
function armor(c){return abIs(C(c.id),'armure')?C(c.id).abX:0;}
function makeC(id,start){return {uid:nu(),id,dmg:0,item:null,start:!!start,placedTurn:G?G.turn:0};}
function nm(c){return C(c.id).name;}
function deckList(k){return DECKS[k].list;}
function isOver(){return G.phase==='roundover'||G.phase==='matchover';}

function newMatch(o){
  const v=VARIANTS[o.variant];
  G={uid:1,online:!!o.online,mode:o.mode,target:o.mode==='blitz'?1:2,variant:o.variant,win:v.win,tro:v.tro,noEvo:o.noEvo,hide:o.online?false:o.hideHands,
     levM:!!o.levM,levAtk:!!o.levAtk,names:o.names.slice(),decks:o.decks.slice(),wins:[0,0],round:0,log:[],players:[null,null],histCount:HIST.length};
  UNDO=[];
  G.first=coin()?0:1;
  log(`${o.mode==='blitz'?'Match rapide (1 manche)':'Match simple (2 manches gagnantes)'} : ${G.names[0]} (${deckLabel(G.decks[0])}) contre ${G.names[1]} (${deckLabel(G.decks[1])}) · victoire à ${v.win} étoiles.`,'sys');
  log(`Pile ou face : ${G.names[G.first]} commence.`,'sys');
  startRound();
}
function startRound(){
  G.round++; G.turn=0; G.pturns=[0,0]; G.phase='setup'; G.mull=[0,0]; G.evoCount=0; G.start=Date.now();
  G.pending=[]; G.after=null; G.revealed=false; G.setupSel=[[],[]];
  log(`Manche ${G.round} · premier joueur : ${G.names[G.first]}`,'head');
  for(let p=0;p<2;p++){
    const P={deck:shuffle(expand(deckList(G.decks[p]))),hand:[],champion:null,bench:[],discard:[],trophies:0,piedFerme:false,elan:false};
    G.players[p]=P;
    const deal=()=>{for(let i=0;i<CONFIG.startHand;i++)P.hand.push({uid:nu(),id:P.deck.pop()});};
    deal();
    let g=0;
    while(!P.hand.some(h=>C(h.id).size==='P')&&g++<100){P.deck.push(...P.hand.map(h=>h.id));P.hand=[];shuffle(P.deck);deal();G.mull[p]++;}
    if(G.mull[p]) log(`${G.names[p]} : main noire ×${G.mull[p]} (aucun combattant ✯ en main).`,'sys');
  }
  for(let p=0;p<2;p++){const n=G.mull[1-p]*CONFIG.mulliganGift;
    for(let i=0;i<n;i++) G.players[p].hand.push({uid:nu(),id:G.players[p].deck.pop()});
    if(n) log(`${G.names[p]} pioche ${n} carte${s_(n)} grâce à la main noire adverse.`,'sys');}
  G.cur=G.first; G.handoff=G.hide;
}
function seatOfHand(uid){return PL(0).hand.some(h=>h.uid===uid)?0:PL(1).hand.some(h=>h.uid===uid)?1:-1;}
function setupToggle(uid){
  const seat=seatOfHand(uid); if(seat<0||PL(seat).champion) return;
  const h=PL(seat).hand.find(x=>x.uid===uid); if(C(h.id).cat!=='creature'||C(h.id).size!=='P') return;
  const sel=G.setupSel[seat], i=sel.indexOf(uid);
  if(i>=0) sel.splice(i,1); else if(sel.length<CONFIG.maxStarters) sel.push(uid); else if(CONFIG.maxStarters===1) sel[0]=uid;
}
function setupConfirm(seat){
  if(seat==null) seat=G.cur;
  const P=PL(seat), sel=G.setupSel[seat];
  const ids=sel.map(u=>{const i=P.hand.findIndex(h=>h.uid===u);return P.hand.splice(i,1)[0].id;});
  P.champion=makeC(ids[0],true); P.bench=ids.slice(1).map(id=>makeC(id,true));
  log(`${G.names[seat]} pose ${ids.length} combattant${s_(ids.length)} face cachée.`,'sys');
  if(!PL(1-seat).champion){ if(!G.online){G.cur=1-seat;G.handoff=G.hide;} return; }
  G.revealed=true;
  [0,1].forEach(p=>{const P=PL(p);log(`Révélation · ${G.names[p]} : champion ${nm(P.champion)}${P.bench.length?`, banc ${P.bench.map(nm).join(' et ')}`:', banc vide'}.`);});
  G.cur=G.first; startTurn();
}
function drawCard(p){const P=PL(p);if(!P.deck.length)return false;P.hand.push({uid:nu(),id:P.deck.pop()});return true;}
function lose(p,reason){if(!isOver()) endRound(1-p,reason);}
function startTurn(){
  G.turn++; G.pturns[G.cur]++;
  const P=cp();
  P.piedFerme=false; P.garde=0; mine(G.cur).forEach(c=>{c.garde=0;});
  G.actions=CONFIG.actionsPerTurn; G.evolved=[]; G.phase='actions'; G.after=null;
  log(`Tour ${G.turn} · ${G.names[G.cur]}`,'turn');
  if(!drawCard(G.cur)) return lose(G.cur,'deck vide');
  // Début de tour (v1.7) : pioche, puis soins (Soigneuse), puis dégâts (Brasier)
  const n=P.bench.filter(b=>abIs(C(b.id),'soigneuse')).length;
  if(n&&P.champion){const g=heal(P.champion,n);if(g)log(`Soigneuse${s_(n)} : ${nm(P.champion)} récupère ${g} DEF (${curDef(P.champion)}/${maxDef(P.champion)}).`,'good');}
  const burnt=mine(G.cur).filter(c=>c.burn);
  burnt.forEach(c=>{if(!mine(G.cur).includes(c))return;const x=c.burn;c.burn=0;const L=c.burnName||'Brasier';c.burnName=null;damage(G.cur,c,x,1-G.cur,`🔥 ${L} ${x}`);});
  if(burnt.length){aftermath();if(isOver())return;}
  G.handoff=G.hide;
}
function heal(c,n){const b=curDef(c);c.dmg=Math.max(0,c.dmg-n);return curDef(c)-b;}
// p = propriétaire du combattant touché ; src = joueur qui marque les étoiles s'il est vaincu
// o.self : dégâts que l'on s'inflige (recul d'Assaut) ; o.thorns : dégâts d'Épines (ne déclenchent pas d'Épines)
function damage(p,c,n,src,label,o){
  o=o||{};
  c.dmg+=n;
  log(`${label?label+' : ':''}${nm(c)} (${G.names[p]}) subit ${n} dégât${s_(n)} → ${Math.max(0,curDef(c))}/${maxDef(c)} DEF.`, n?'bad':'');
  if(curDef(c)<=0) return vanquish(p,c,src);
  // Épines (v1.16) : le champion qui survit à des dégâts infligés par l'adversaire riposte
  const card=C(c.id);
  if(n>=1&&!o.self&&!o.thorns&&PL(p).champion===c&&abIs(card,'epines')){
    const oc=PL(1-p).champion;
    if(oc) damage(1-p,oc,card.abX,p,`🌿 Épines ${card.abX} de ${card.name}`,{thorns:true});
  }
}
function vanquish(p,c,killer){
  const P=PL(p);
  if(P.champion===c) P.champion=null; else P.bench.splice(P.bench.indexOf(c),1);
  P.discard.push(c.id); if(c.item) P.discard.push(c.item);
  const card=C(c.id), t=G.tro[card.size];
  PL(killer).trophies+=t;
  log(`☠ ${card.name} est vaincu : ${G.names[killer]} récupère ${t} étoile${s_(t)} (${PL(killer).trophies}/${G.win}).`,'good');
  if(abIs(card,'embrasement')){
    const kc=PL(killer).champion;
    if(kc) damage(killer,kc,card.abX,p,`✦ ${ABIL[card.ab].name} ${card.abX}`);
    else log(`✦ ${ABIL[card.ab].name} : aucun champion à toucher.`,'sys');
  }
}
// Fin de résolution : victoire, remplacement, défaite (section 6.3)
function aftermath(){
  if(isOver()) return;
  const t=G.players.map(x=>x.trophies), def=1-G.cur;
  const r=[0,1].filter(i=>t[i]>=G.win);
  if(r.length===2) return endRound(t[0]>t[1]?0:t[1]>t[0]?1:def,'étoiles (les deux joueurs)');
  if(r.length===1) return endRound(r[0],`${G.win} étoiles`);
  const dead=[0,1].filter(i=>!PL(i).champion), lost=dead.filter(i=>!PL(i).bench.length);
  if(lost.length===2) return endRound(def,'deux champions vaincus, bancs vides');
  if(lost.length===1) return endRound(1-lost[0],'champion vaincu, banc vide');
  dead.forEach(i=>{
    const P=PL(i);
    if(P.bench.length===1) promote(i,P.bench[0].uid);
    else G.pending.push({kind:'replace',p:i,options:P.bench.map(b=>b.uid)});
  });
}
function promote(p,uid){
  const P=PL(p), c=P.bench.find(b=>b.uid===uid);
  P.bench.splice(P.bench.indexOf(c),1); P.champion=c;
  log(`${G.names[p]} : ${nm(c)} devient champion (remplacement).`);
}
function swap(p,uid,how){
  const P=PL(p), b=P.bench.find(x=>x.uid===uid), i=P.bench.indexOf(b), old=P.champion;
  P.bench[i]=old; P.champion=b;
  log(`${how} : ${nm(b)} devient champion de ${G.names[p]}, ${nm(old)} va au banc.`);
  const cb=C(b.id);
  if(cb.ab==='reflux'){const g=heal(b,cb.abX);log(`✦ Reflux : ${cb.name} récupère ${g} DEF (${curDef(b)}/${maxDef(b)}).`,'good');}
}
function onEnter(p,c){
  const card=C(c.id);
  if(abIs(card,'eclaireur')){ if(!drawCard(p)) return lose(p,'deck vide (Éclaireur)'); log(`✦ Éclaireur : ${G.names[p]} pioche 1 carte.`,'good'); }
  if(abIs(card,'eruption')){
    const t=mine(1-p).map(x=>x.uid);
    if(t.length===1) eruption(p,c.uid,t[0]);
    else G.pending.push({kind:'target',what:'eruption',p,src:c.uid,options:t});
  }
}
function eruption(p,srcUid,tUid){
  const src=findC(p,srcUid), card=src?C(src.id):null, x=card?card.abX:2;
  const t=findC(1-p,tUid); damage(1-p,t,x,p,`✦ ${card?ABIL[card.ab].name:'Éruption'} ${x}`);
  aftermath();
}
function canEvolve(c,card){
  const k=C(c.id);
  return card.from===k.id
    &&(c.placedTurn<G.turn||abIs(k,'survolte'))&&!G.evolved.includes(c.uid)&&!(c.start&&G.pturns[G.cur]===1);
}
function evoOnly(c){return CONFIG.evoOnlyForLineage&&!(G&&G.noEvo)&&!!c.from&&!(G&&G.levM&&c.size==='M');}
function atkCost(){return G&&G.levAtk?0:CONFIG.attackCost;}
function takeHand(uid){const P=cp(),i=P.hand.findIndex(h=>h.uid===uid);return P.hand.splice(i,1)[0];}

/* ---- ce que permet une carte de la main ---- */
function handActions(h){
  if(!G||G.phase!=='actions'||G.pending.length||G.handoff) return [];
  const p=G.cur,P=cp(),O=op(),c=C(h.id),A=G.actions,out=[];
  const noA=n=>`Il faut ${n} étoile${s_(n)} (il en reste ${A})`;
  if(c.cat==='creature'){
    const cost=CONFIG.poseCost[c.size];
    if(!evoOnly(c)){
      const why=A<cost?noA(cost):P.bench.length>=CONFIG.benchSlots?'Banc plein':'';
      out.push({key:'pose',label:`Poser sur le banc (${cost})`,ok:!why,why});
    }
    if(!G.noEvo&&c.from){
      const t=mine(p).filter(x=>canEvolve(x,c)).map(x=>x.uid);
      let w='';
      if(A<CONFIG.evolveCost) w=noA(CONFIG.evolveCost);
      else if(!t.length){
        const any=mine(p).some(x=>x.id===c.from);
        w=!any?`Nécessite ${C(c.from).name} en jeu`
          :mine(p).some(x=>x.id===c.from&&x.start&&G.pturns[G.cur]===1)?'Les combattants posés à la préparation n\'évoluent pas pendant votre premier tour'
          :mine(p).some(x=>x.id===c.from&&x.placedTurn===G.turn&&!abIs(C(x.id),'survolte'))?'Posée ce tour : elle doit être en jeu au début du tour pour évoluer'
          :'Déjà évoluée ce tour';
      }
      out.push({key:'evolve',label:`Évoluer (${CONFIG.evolveCost})`,ok:!w,why:w,targets:t});
    }
    return out;
  }
  const cost=c.cat==='sort'?CONFIG.spellCost:CONFIG.itemCost;
  let why=A<cost?noA(cost):'', t=null;
  if(!why){
    if(c.id==='soin') t=mine(p).map(x=>x.uid);
    else if(c.id==='frappe') t=mine(1-p).map(x=>x.uid);
    else if(c.id==='echange_force'){t=O.bench.map(x=>x.uid);if(!t.length)why='Banc adverse vide';}
    else if(c.id==='renfort'){if(P.bench.length>=CONFIG.benchSlots)why='Banc plein';else t='deck';}
    else if(c.cat==='objet'){t=mine(p).filter(x=>!x.item).map(x=>x.uid);if(!t.length)why='Tous vos combattants ont déjà un objet';}
    else if(c.id==='pied_ferme'&&P.piedFerme) why='Déjà actif';
    else if(c.id==='elan'&&P.elan) why='Déjà actif ce tour';
  }
  out.push({key:c.cat==='objet'?'item':'spell',label:`${c.cat==='objet'?'Équiper':'Jouer'} (${cost})`,ok:!why,why,targets:t});
  return out;
}
// Échange : 1 action si même type, ou si l'un des deux est Neutre ; sinon 2
function swapCost(b){const t1=C(b.id).type,t2=C(cp().champion.id).type;return t1===t2||t1==='neutre'||t2==='neutre'?CONFIG.swapSameType:CONFIG.swapDiffType;}

/* ---- exécution ---- */
function doPose(uid){
  const h=takeHand(uid),c=makeC(h.id),cost=CONFIG.poseCost[C(h.id).size];
  cp().bench.push(c); G.actions-=cost;
  log(`${G.names[G.cur]} pose ${C(h.id).name} sur le banc (${cost} étoile${s_(cost)}).`);
  onEnter(G.cur,c);
}
function doEvolve(uid,tUid){
  const h=takeHand(uid), c=findC(G.cur,tUid), old=nm(c);
  const surv=c.placedTurn===G.turn;
  cp().discard.push(c.id); c.id=h.id; G.actions-=CONFIG.evolveCost; G.evolved.push(c.uid); G.evoCount++;
  if(abIs(C(c.id),'regeneration')&&c.dmg){c.dmg=0;log(`✦ Régénération : ${nm(c)} efface tous ses dégâts.`,'good');}
  log(`${G.names[G.cur]} fait évoluer ${old} en ${nm(c)}${surv?' (Survolté)':''} (${curDef(c)}/${maxDef(c)} DEF).`);
  onEnter(G.cur,c);
}
function doSpell(uid,tUid){
  const h=takeHand(uid),c=C(h.id),p=G.cur,P=cp(),n=G.names[p];
  P.discard.push(h.id); G.actions-=CONFIG.spellCost;
  if(c.id==='soin'){const t=findC(p,tUid),g=heal(t,CONFIG.heal);log(`${n} joue Soin : ${nm(t)} récupère ${g} DEF (${curDef(t)}/${maxDef(t)}).`,'good');}
  else if(c.id==='frappe'){const t=findC(1-p,tUid);log(`${n} joue Frappe sur ${nm(t)}.`);damage(1-p,t,CONFIG.frappe,p,'Frappe');aftermath();}
  else if(c.id==='echange_force'){log(`${n} joue Échange forcé.`);swap(1-p,tUid,'Échange forcé');}
  else if(c.id==='pied_ferme'){P.piedFerme=true;log(`${n} joue Pied ferme : son champion subira ${CONFIG.piedFerme} dégâts de moins par coup jusqu'à son prochain tour.`);}
  else if(c.id==='elan'){P.elan=true;log(`${n} joue Élan : +${CONFIG.elan} ATK à son champion ce tour.`);}
  else if(c.id==='pioche'){log(`${n} joue Pioche.`);for(let i=0;i<2;i++)if(!drawCard(p))return lose(p,'deck vide (Pioche)');}
}
function doRenfort(uid,cardId){
  const h=takeHand(uid),P=cp();
  P.discard.push(h.id); G.actions-=CONFIG.spellCost;
  if(!cardId){shuffle(P.deck);log(`${G.names[G.cur]} joue Renfort : aucun combattant ✯ dans le deck, l'atout est sans effet (deck mélangé).`,'sys');return;}
  P.deck.splice(P.deck.indexOf(cardId),1); shuffle(P.deck);
  const c=makeC(cardId); P.bench.push(c);
  log(`${G.names[G.cur]} joue Renfort : ${C(cardId).name} est posée sur le banc depuis le deck (deck mélangé).`);
  onEnter(G.cur,c);
}
function doItem(uid,tUid){
  const h=takeHand(uid),t=findC(G.cur,tUid);
  t.item=h.id; G.actions-=CONFIG.itemCost;
  log(`${G.names[G.cur]} équipe ${nm(t)} de ${C(h.id).name}${h.id==='plastron'?` (${curDef(t)}/${maxDef(t)} DEF)`:''}.`);
}
function doSwap(uid){
  if(isHeld(cp().champion)) return;
  const b=findC(G.cur,uid),cost=swapCost(b);
  G.actions-=cost;
  swap(G.cur,uid,`Échange (${cost} étoile${s_(cost)})`);
}
function isHeld(c){return !!(c&&c.heldUntil&&G&&G.turn<=c.heldUntil);}
function isStunned(c){return !!(c&&c.stunUntil&&G&&G.turn<=c.stunUntil);}
// kind : 'base' ou 'spe' ; coin : résultat du Pari (true = face, false = pile, undefined = aperçu)
function attackCalc(kind,coin){
  kind=kind||'base';
  const A=cp(),D=op(),a=A.champion,d=D.champion,sp=C(a.id).spe;
  let atk=baseAtk(a)+(A.elan?CONFIG.elan:0);
  const parts=[`ATK ${atk}`]; let bonus=0,minus=0;
  if(kind==='spe'&&sp){
    if(sp.kw==='pari'&&coin===false) return {dmg:0,txt:'pile : l\'attaque rate, aucun dégât',kills:false,miss:true};
    if(sp.kw==='charge'||sp.kw==='assaut'||sp.kw==='pari'){bonus=sp.x;parts.push(`+${sp.x} ${SPE[sp.kw].name}${sp.kw==='pari'&&coin===undefined?' (si face)':''}`);}
    if(sp.kw==='acharnement'){ if(d.dmg>0){bonus=sp.x;parts.push(`+${sp.x} Acharnement`);} else parts.push('Acharnement sans effet (cible intacte)'); }
    if(sp.kw==='recherche'||sp.kw==='etreinte'||sp.kw==='etourdissement'){minus=1;}
  }
  const weak=C(d.id).weak===C(a.id).type;
  if(weak) parts.push(`+${CONFIG.weakBonus} faiblesse`);
  const red=armor(d)+(D.piedFerme?CONFIG.piedFerme:0)+(d.garde||0);
  if(armor(d)) parts.push(`−${armor(d)} Armure`);
  if(D.piedFerme) parts.push(`−${CONFIG.piedFerme} Pied ferme`);
  if(d.garde) parts.push(`−${d.garde} Garde`);
  if(minus) parts.push(`−1 ${SPE[sp.kw].name}`);
  const dmg=Math.max(0,atk+bonus+(weak?CONFIG.weakBonus:0)-red-minus);
  return {dmg,txt:parts.join(' ')+` = ${dmg}`,kills:dmg>=curDef(d)};
}
function attackBlocked(){
  if(G.phase!=='actions'||G.pending.length) return 'action en cours';
  if(!CONFIG.firstPlayerAttacksT1&&G.cur===G.first&&G.pturns[G.cur]===1) return 'le premier joueur n\'attaque pas à son premier tour';
  if(!(cp().champion&&op().champion)) return 'pas de champion';
  if(isStunned(cp().champion)) return 'votre champion est étourdi ce tour (échangez-le pour attaquer avec un autre combattant)';
  return '';
}
function canAttack(kind){
  if(attackBlocked()) return false;
  if(kind==='spe') return !!C(cp().champion.id).spe&&G.actions>=speCost(cp().champion.id);
  return G.actions>=atkCost();
}
function doAttack(kind){
  kind=kind==='spe'?'spe':'base';
  const p=G.cur,A=cp(),D=op(),a=A.champion,d=D.champion,card=C(a.id),sp=card.spe;
  let coin;
  if(kind==='spe'){G.actions-=speCost(a.id); if(sp.kw==='pari'){coin=Math.random()<.5; log(`🪙 Pari : la pièce tombe sur ${coin?'FACE':'PILE'}.`,coin?'good':'bad');}}
  else G.actions-=atkCost();
  const k=attackCalc(kind,coin);
  log(`⚔ ${nm(a)} attaque ${nm(d)} (${kind==='spe'?'attaque spéciale '+speLabel(card):'attaque de base'}) : ${k.txt}.`);
  if(!k.miss) damage(1-p,d,k.dmg,p);
  if(!k.miss&&!mine(1-p).includes(d)&&abIs(card,'frenesie')&&A.champion===a){
    const g=heal(a,card.abX);log(`✦ Frénésie : ${card.name} récupère ${g} DEF (${curDef(a)}/${maxDef(a)}).`,'good');}
  G.after='end';
  if(kind==='spe') speEffect(p,sp,a,d,k);
  if(!G.pending.some(x=>x.post)) aftermath();
  flow();
}
// Effet de l'attaque spéciale, après le coup (et ses conséquences) et avant la fin de la résolution
function speEffect(p,sp,a,d,k){
  const A=PL(p),D=PL(1-p),aliveA=A.champion===a,survived=D.champion===d;
  const kw=speBase(sp.kw),x=sp.x,L=SPE[sp.kw].name;
  if(kw==='assaut'&&A.champion===a){damage(p,a,x,1-p,`↩ Recul d'Assaut ${x}`,{self:true});}
  else if(kw==='brasier'){
    if(!k.miss&&k.dmg>=1&&survived){if(x>=(d.burn||0)){d.burn=x;d.burnName=L;}log(`🔥 ${L} : ${nm(d)} subira ${d.burn} dégât${s_(d.burn)} direct${s_(d.burn)} au début du prochain tour de ${G.names[1-p]}.`);}
    else log(`🔥 ${L} sans effet (aucun dégât, ou cible vaincue).`,'sys');
  }
  else if(kw==='souffle'){
    const t=D.bench.map(c=>c.uid);
    if(!t.length) log('✦ Souffle : banc adverse vide, aucun effet.','sys');
    else if(t.length===1) souffleApply(p,t[0],x);
    else G.pending.push({kind:'target',what:'souffle',p,x,options:t,post:true,cardId:a.id});
  }
  else if(kw==='garde'){if(aliveA){a.garde=Math.max(a.garde||0,x);log(`✦ Garde : jusqu'au prochain tour de ${G.names[p]}, ${nm(a)} subira ${x} dégât${s_(x)} de moins par coup tant qu'il est champion.`);}}
  else if(kw==='recherche'){ if(!drawCard(p)) return lose(p,'deck vide (Recherche)'); log(`✦ Recherche : ${G.names[p]} pioche 1 carte.`,'good'); }
  else if(kw==='vague'){ if(aliveA){const g=heal(a,x);log(`✦ Vague : ${nm(a)} récupère ${g} DEF (${curDef(a)}/${maxDef(a)}).`,'good');} }
  else if(kw==='repli'){
    if(!aliveA) return;
    if(isHeld(a)){log('✦ Repli impossible : votre champion est retenu par une Étreinte.','sys');return;}
    const t=A.bench.map(c=>c.uid);
    if(!t.length) log('✦ Repli : banc vide, aucun échange.','sys');
    else if(t.length===1) repliApply(p,t[0]);
    else G.pending.push({kind:'target',what:'repli',p,options:t,post:true,cardId:a.id});
  }
  else if(kw==='absorption'){
    if(k.miss||!survived){log('✦ Absorption sans effet : la cible est vaincue.','sys');return;}
    damage(1-p,d,x,p,`✦ Absorption ${x}`);
    if(A.champion===a){const g=heal(a,x);log(`✦ Absorption : ${nm(a)} récupère ${g} DEF (${curDef(a)}/${maxDef(a)}).`,'good');}
  }
  else if(kw==='etourdissement'){ if(survived&&!k.miss){d.stunUntil=G.turn+1;log(`✦ Étourdissement : ${nm(d)} ne pourra pas attaquer pendant le prochain tour de ${G.names[1-p]}.`);} }
  else if(kw==='etreinte'){ if(survived&&!k.miss){d.heldUntil=G.turn+1;log(`✦ Étreinte : ${G.names[1-p]} ne pourra pas échanger ${nm(d)} pendant son prochain tour.`);} }
  else if(kw==='tourbillon'){
    if(!survived){log('✦ Tourbillon sans effet : la cible est vaincue.','sys');return;}
    const t=D.bench.map(c=>c.uid);
    if(!t.length) log('✦ Tourbillon : banc adverse vide, aucun effet.','sys');
    else if(t.length===1) swap(1-p,t[0],'✦ Tourbillon');
    else G.pending.push({kind:'target',what:'tourbillon',p,options:t,post:true,cardId:a.id});
  }
}
function souffleApply(p,uid,x){const t=findC(1-p,uid);damage(1-p,t,x,p,`✦ Souffle ${x}`);}
function repliApply(p,uid){
  const P=PL(p),b=P.bench.find(c=>c.uid===uid),i=P.bench.indexOf(b),old=P.champion;
  P.bench[i]=old;P.champion=b;log(`✦ Repli : ${nm(b)} devient champion de ${G.names[p]}, ${nm(old)} va au banc.`);
}
function endTurnNoAttack(){log(`${G.names[G.cur]} termine son tour sans attaquer.`,'sys');G.after='end';flow();}
function flow(){
  while(!isOver()&&!G.pending.length&&G.after){
    const a=G.after; G.after=null;
    if(a==='end'){
      const x=CONFIG.maxHand==null?0:cp().hand.length-CONFIG.maxHand;
      if(x>0) G.pending.push({kind:'discard',p:G.cur,n:x,chosen:[]});
      G.after='switch';
    } else if(a==='switch'){ cp().elan=false; G.cur=1-G.cur; startTurn(); }
  }
}
function endRound(w,reason){
  G.phase='roundover'; G.handoff=false; G.pending=[]; G.after=null;
  G.wins[w]++; G.lastWinner=w;
  HIST.push({round:G.round,decks:`${DECKS[G.decks[0]].name} (${G.names[0]}) contre ${DECKS[G.decks[1]].name} (${G.names[1]})${G.mode==='blitz'?' · Match rapide':''}`,
    j1:G.names[G.first],winner:G.names[w],tours:G.turn,duree:((Date.now()-G.start)/60000).toFixed(1),
    troph:`${PL(0).trophies}–${PL(1).trophies}`,evos:G.evoCount,mull:`${G.mull[0]}/${G.mull[1]}`,reason,notes:''});
  G.histCount=HIST.length;
  log(`🏆 ${G.names[w]} remporte la manche ${G.round} (${reason}). Score ${G.wins[0]}–${G.wins[1]}.`,'good');
  if(G.wins[w]>=G.target){G.phase='matchover';if(G.mode!=='blitz')log(`${G.names[w]} remporte le match !`,'good');}
}
function nextRound(){G.first=1-G.lastWinner;startRound();}

  render.hk=hk; if(hsl){const m2=$('.mhand');if(m2)m2.scrollLeft=hsl;} // garde la position de la main entre deux affichages du même tour
  const inMatch=UI.tab==='combat'&&!!G; document.body.classList.toggle('inmatch',inMatch);
  if(!inMatch){UI.gmenu=false;UI.sheet=null;if(UI.mmodal)UI.mmodal=null;}
  $('#modal').innerHTML = UI.detail?renderDetail(UI.detail):UI.colf&&UI.tab==='cartes'?renderColFilters():UI.exportText!==null?renderExport():UI.confirmQuit&&inMatch?renderQuitModal():inMatch&&G.pending[0]&&G.pending[0].kind==='deckpick'&&mine_(G.pending[0].p)?renderDeckpick():UI.bigc&&UI.mmodal&&inMatch?cardView(UI.bigc,'','closebig'):UI.mmodal&&inMatch?renderMatchModal():UI.sheet&&inMatch?renderSheet():'';
  if(inMatch) sizeBoard();

}
// Taille des cartes du plateau au format 2,5 × 3,5 (largeur/hauteur = 5/7), calculée selon la place disponible
function sizeBoard(){
  const b=document.querySelector('.board'); if(!b) return;
  const w=b.clientWidth, h=b.clientHeight, g=8, lab=13, rg=4;
  if(!w||!h) return;
  const k=1.25;                                   // le champion est un peu plus grand que le banc
  let hb=(h-4*lab-3*rg)/(2+2*k);                   // hauteur d'une carte de banc selon la hauteur
  let wb=Math.min((w-3*g)/4, hb*5/7);              // 4 cartes de banc doivent tenir en largeur (pile + 2 bancs + côté)
  hb=wb*7/5;
  let wc=Math.min(wb*k, w-2*g-2*138);              // le champion laisse la place aux barres des joueurs
  wc=Math.max(wc,wb); let hc=wc*7/5;
  const r=document.documentElement.style;
  r.setProperty('--wb',wb.toFixed(1)+'px'); r.setProperty('--hb',hb.toFixed(1)+'px');
  r.setProperty('--wc',wc.toFixed(1)+'px'); r.setProperty('--hc',hc.toFixed(1)+'px');
  // main adverse : chevauchement des dos selon la place réellement disponible
  const ob=document.querySelector('.obacks');
  if(ob&&ob.children.length>1){const n=ob.children.length,cw=ob.children[0].offsetWidth||22,av=ob.parentElement.clientWidth-220;
    ob.style.setProperty('--og',Math.min(4,Math.floor((av-cw)/(n-1)-cw))+'px');}
}

/* ---- Collection : filtres et tri ---- */
const norm=t=>String(t).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function colCards(){
  const f=UI.col, catOrder={creature:0,sort:1,objet:2};
  let cs=Object.values(CARDS).filter(c=>{
    if(f.q&&!norm(c.name).includes(norm(f.q))) return false;
    // filtres à cases : aucune case cochée = tout ; plusieurs cases d'un même groupe = l'une ou l'autre
    if(f.cat.length&&!f.cat.includes(c.cat)) return false;
    if(f.type.length&&(c.cat!=='creature'||!f.type.includes(c.type))) return false;
    if(f.stars.length&&(c.cat!=='creature'||!f.stars.includes(c.size))) return false;
    return true;
  });
  const base=(x,y)=>catOrder[x.cat]-catOrder[y.cat];
  const byStars=(x,y)=>(x.level||9)-(y.level||9)||DECK_ORDER.indexOf(x.fam)-DECK_ORDER.indexOf(y.fam)||String(x.line||'Z').localeCompare(String(y.line||'Z'))||x.name.localeCompare(y.name,'fr');
  // ▼ = du plus grand au plus petit, ▲ = du plus petit au plus grand ; atouts et objets toujours après les combattants
  const num=(k,dir)=>(x,y)=>base(x,y)||dir*((x[k]||0)-(y[k]||0))||byStars(x,y);
  const sorts={
    name:(x,y)=>x.name.localeCompare(y.name,'fr'),
    type:(x,y)=>base(x,y)||TYPE_ORDER.indexOf(x.type)-TYPE_ORDER.indexOf(y.type)||byStars(x,y),
    starsD:num('level',-1), starsA:num('level',1),
    atkD:num('atk',-1), atkA:num('atk',1), defD:num('def',-1), defA:num('def',1)
  };
  return cs.sort(sorts[f.sort]||sorts.starsA);
}

  const cs=colCards();
